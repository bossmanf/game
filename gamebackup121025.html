<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">

    <title>Change this title!</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <script src="https://unpkg.com/@tonejs/midi@2.0.2/build/Midi.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <!-- Load aggressive/angular fonts: Orbitron for titles, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'electric-cyan': '#00FFFF', // Custom color for highlights
                        'neon-pink': '#FF00FF',     // Custom color for titles
                        'electric-blue': '#1e90ff', // Another vibrant blue
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Define the Speed Metal Aesthetic */
        :root {
            --metal-black: #111827; /* Tailwind gray-900 */
            --metal-gray: #374151;  /* Tailwind gray-700 */
            --electric-cyan: #00ffff;
            --electric-blue: #3b82f6;
        }

        body {
            /* Using a safer background property for better compatibility */
            background-image: url('https://www.greatmusichall.com/wp-content/uploads/2020/07/venue_main_image-5.png?fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Inter', sans-serif;
            color: #d1d5db;
            font-family: 'Chakra Petch', sans-serif;
            color: #F7FAFC;
        }

        .container {
            border: 3px solid var(--music-accent);
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(229, 62, 62, 0.7);
            max-width: 1100px;
            overflow: hidden;
        }

        /* Map Host Setup */
        #map-host {
            position: relative;
            width: 100%;
            /* ViewBox is 1000x800 for better vertical space matching the stylized map */
            padding-bottom: 80%; 
            background-image: url('./sf.jpg');
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        .sf-map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; 
        }

        /* Landmark Node Group (Invisible clickable box) */
        .landmark-group {
            cursor: pointer;
            transition: filter 0.2s;
        }
        .landmark-group:hover {
            /* Static Glow effect instead of scale */
            filter: drop-shadow(0 0 8px var(--music-accent));
        }

        /* Landmark Marker Styling (The visible emoji/text) */
        .landmark-emoji {
            text-shadow: 0 0 13px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }
        
        .landmark-name {
            fill:  #111111; /*#FFFFFF; */
            font-size: 15px; /* 10px Small font size as requested */
            font-weight: 600;
            text-shadow: 100 100 3px #000000; 
            pointer-events: none; /* Allows click-through to the group/rect */
        }

        /* Music Panel Styling */
        .music-panel {
             background-color: var(--panel-bg);
             border-top: 4px dashed var(--music-accent);
             font-family: 'VT323', monospace; /* Retro terminal font */
             color: #A0EEFF;
             box-shadow: inset 0 0 10px rgba(229, 62, 62, 0.5);
        }
        .music-panel .title {
            color: var(--music-accent);
            text-shadow: 0 0 5px var(--music-accent);
        }


        .title-font {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px var(--electric-cyan), 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 0.1em;
        }

        .metal-card {
            background-color: #1f2937; /* Darker background for components */
            border: 2px solid var(--metal-gray);
            border-radius: 0; /* Sharp corners */
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); /* Blue core glow */
            /* Aggressive look: subtle skew */
            transform: skew(-0.5deg);
            transition: transform 0.3s;
        }

        .metal-button {
            /* Aggressive, sharp styling */
            background-color: var(--electric-blue);
            color: var(--metal-black);
            font-weight: 800;
            letter-spacing: 0.08em;
            transition: all 0.2s ease-in-out;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%); /* Angular cut */
            border: none;
        }

        .metal-button:hover:not(:disabled) {
            background-color: var(--electric-cyan);
            color: var(--metal-black);
            transform: scale(1.02);
            box-shadow: 0 0 8px var(--electric-cyan);
        }
        
        .disabled-button {
            background-color: #4b5563 !important;
            color: #d1d5db !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .panel-border {
            border-left: 3px solid var(--electric-cyan);
            border-right: 3px solid var(--electric-cyan);
        }

        /* SVG Icon for angular, fast look */
        .speed-icon {
            filter: drop-shadow(0 0 4px var(--electric-cyan));
        }


        .game-header {
            border-bottom: 1px solid #3d3d3d;
        }

       .wordle-grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 8px;
            padding: 16px;
            max-width: 350px;
            width: 90%;
            margin: 0 auto;
        }
        .wordle-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 8px;
        }
        .wordle-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            color: #f3f4f6;
            border: 3px solid #374151;
            border-radius: 6px;
            text-transform: uppercase;
            transition: background-color 0.5s ease, transform 0.1s ease;
        }

        /* Box Colors */
        .box-empty { border-color: #374151; }
        .box-current { border-color: #6b7280; }
        .box-absent { background-color: #3a3a3c; border-color: #3a3a3c; } /* Gray 900 */
        .box-present { background-color: #b59f3b; border-color: #b59f3b; } /* Yellow 700 */
        .box-correct { background-color: #538d4e; border-color: #538d4e; } /* Green 700 */

        /* Keyboard */
        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }
        .key-button {
            background-color: #6b7280;
            color: white;
            font-weight: 700;
            border-radius: 4px;
            margin: 2px;
            cursor: pointer;
            user-select: none;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s ease;
            min-width: 30px;
            flex-grow: 1;
            padding: 0 8px;
            text-transform: uppercase;
            font-size: 14px;
        }
        .key-button:active {
            transform: scale(0.95);
        }
        .key-absent { background-color: #3a3a3c !important; }
        .key-present { background-color: #b59f3b !important; }
        .key-correct { background-color: #538d4e !important; }

        /* Neon Button Style */
        .neon-button {
            background-color: #00ffff;
            color: #000000;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            font-weight: 700;
        }
        .neon-button:hover {
            background-color: #00e5e5;
            box-shadow: 0 0 15px #00e5e5, 0 0 30px #00e5e5;
            transform: translateY(-2px);
        }
        
        /* Visualizer Pulse (for Phase 8) */
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
            50% { box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; }
            100% { box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
        }
        .music-pulse {
            animation: pulse 1s infinite alternate;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .record-spin {
            animation: spin 3s linear infinite;
        }

        /* ROCK AESTHETIC - Phase 4 */
        .rock-card {
            background: linear-gradient(145deg, #1f1f1f 10%, #000000 90%);
            border: 5px solid #cc0000;
            border-radius: 10px;
            box-shadow: 0 0 25px #cc0000, inset 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .rock-title {
            color: #ff0000;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #ff0000;
            font-size: 3rem;
            line-height: 1;
        }
        .item-card {
            background-color: rgba(50, 50, 50, 0.7);
            border: 2px dashed #999;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: scale(1.05);
            border-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* PUNK AESTHETIC - Phase 5 */
        .punk-bg {
            background: repeating-linear-gradient(-45deg, #222, #222 5px, #000 5px, #000 10px);
            border: 4px dashed #99ff00;
            box-shadow: 0 0 20px #99ff00;
        }
        .punk-text {
            font-family: monospace;
            color: #ff00ff;
            text-shadow: 2px 2px #000;
            text-transform: uppercase;
        }
        .punk-button {
            background-color: #ff00ff;
            color: black;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
        }
        .punk-button:hover {
            background-color: #99ff00;
            box-shadow: 2px 2px 0 #000;
            transform: translate(2px, 2px);
        }


         /* Family Feud Board Styles */
        .answer-slot {
            height: 4.5rem; /* Taller slots */
            background: linear-gradient(145deg, #374151, #1f2937);
            border: 3px solid #6b7280;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease-in-out;
            cursor: default;
        }

        .revealed {
            background: linear-gradient(145deg, #fcd34d, #b45309);
            border-color: #f59e0b;
            color: #1f2937;
            box-shadow: 0 0 20px #f59e0b;
        }

        .strike-slot {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background-color: #1f2937;
            border: 2px solid #4b5563;
        }
        .strike-hit {
            background-color: #dc2626;
            border-color: #f87171;
            box-shadow: 0 0 15px #dc2626;
            animation: strike-anim 0.5s ease-in-out;
        }

        @keyframes strike-anim {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* --- SUCCESS ANIMATION STYLES --- */
        @keyframes rockShake {
            0% { transform: scale(1.5) rotate(0deg); }
            10% { transform: scale(1.7) rotate(10deg); }
            20% { transform: scale(1.7) rotate(-10deg); }
            30% { transform: scale(1.8) rotate(10deg); }
            40% { transform: scale(1.8) rotate(-10deg); }
            50% { transform: scale(1.9) rotate(10deg); }
            60% { transform: scale(1.9) rotate(-10deg); }
            100% { transform: scale(2.0) rotate(0deg); }
        }

        .rock-animation {
            /* Keep applying the shaking keyframes */
            animation: rockShake 0.1s linear infinite; 
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }
        /* Cinematic View specific styling */
        #cinematicView {
            z-index: 100; /* Ensure it is on top of everything */
            transition: opacity 500ms ease-out;
            background-color: rgba(0, 0, 0, 0.95);
        }
        
        #cinematicText {
            transition: color 500ms;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        #textBox {
            backdrop-filter: blur(5px);
            background-color: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fan-panel-glow {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 20px rgba(255, 100, 100, 0.5); /* Neon red/fuchsia glow */
        }
        
        .speed-icon {
            filter: drop-shadow(0 0 3px currentColor);
        }

        @keyframes cloudPulse { 
            0%, 100% {
                transform: scale(1.1);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03); /* Softer base shadow */
            }
            50% {
                transform: scale(1.2); 
                box-shadow: 0 5px 12px rgba(0, 0, 0, 0.06); /* Even smaller shadow peak */
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8); /* Reduced scale change */
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); /* Much softer shadow */
            }
            100% {
                transform: scale(1.2); /* Reduced scale change */
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7); /* Reduced shadow peak */
            }
        }
        /* Custom style for the dreamy, cloud-shaped memory box */
        .dreamy-cloud {
            position: relative;
            /* Using the original complex cloud shape */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            overflow: visible; /* Allow puffs to extend outside the main box */
            animation: cloudPulse 1.5s infinite alternate; /* Soft, dreamy pulsing effect */
            transition: all 0.3s;
            border: 4px solid; /* Border to use the memory color */
            padding: 50px 70px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transform: scale(0.98);
        }
        .dreamy-puff, 
        .dreamy-cloud::before,
        .dreamy-cloud::after {
            position: absolute;
            background: inherit;
            border-radius: 50%;
            animation: cloudPulse 4s infinite ease-in-out;
            transition: all 0.3s;
            opacity: 100;
            filter: brightness(1.05); /* Slightly less bright than before */
            z-index: -1;
        }

        .dreamy-cloud::before {
            width: 80px;
            height: 80px;
            top: -15px;
            left: 10%;
            filter: brightness(1.05);
        }

        .dreamy-cloud::after {
            width: 100px;
            height: 100px;
            bottom: -25px;
            filter: brightness(1.1); 
            right: 15%;
        }
        /* Puff 1 (::before - Top-Left-Center) */
        .dreamy-cloud::before {
            width: 80px;
            height: 80px;
            top: -15px;
            left: 10%;
            filter: brightness(1.05);
        }

        /* Puff 2 (::after - Bottom-Right-Center) */
        .dreamy-cloud::after {
            width: 100px;
            height: 100px;
            bottom: -25px;
            right: 15%;
            filter: brightness(1.1);
        }

        /* Puff 3 (Explicit HTML element - Far Top-Left Corner) */
        .dreamy-cloud .puff-1 { 
            width: 65px;
            height: 65px;
            top: 20px;
            left: 2px;
            filter: brightness(1.15); 
        }

        /* Puff 4 (Explicit HTML element - Far Bottom-Right Corner) */
        .dreamy-cloud .puff-2 { 
            width: 90px;
            height: 90px;
            bottom: 10px;
            right: -30px;
            filter: brightness(1.1); 
        }
        
        /* Puff 5 (NEW Explicit HTML element - Top-Right Corner) */
        .dreamy-cloud .puff-3 { 
            width: 75px;
            height: 75px;
            top: 5px;
            right: 0px;
            filter: brightness(1.1); 
        }
        .inner-content {
            background-color: rgba(255, 255, 255, 0.01); /* Very subtle overlay */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Modal specific styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .memory-ball {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        .memory-ball:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .memory-ball.used {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .memory-ball-count {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.75rem;
            line-height: 1;
            padding: 2px 5px;
            border-radius: 9999px;
            background-color: #f59e0b; /* Amber */
            color: #1f2937; /* Dark text */
            font-weight: bold;
        }
         /* Item Rotation Animation */
        @keyframes slowRotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .rotating-item {
            animation: slowRotate 15s linear infinite;
        }
         /* iPhone Specific Styles */
        .iphone-frame {
            position: relative;
            width: 300px; /* Fixed width for phone effect */
            height: 600px; /* Fixed height for phone effect */
            background: #000;
            border-radius: 40px;
            padding: 10px;
            box-shadow: 0 0 0 2px #333, 0 0 0 5px #111, inset 0 0 10px rgba(0,0,0,0.8);
            margin: 0 auto;
            overflow: hidden;
            cursor: pointer; /* Allows clicking outside the screen to exit */
        }
        
        .iphone-screen {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            /* Punk/Heavy Music Aesthetic Background */
            background: url('https://placehold.co/300x600/101010/8d0000?text=PUNK+ROCK+NOISE') no-repeat center center;
            background-size: cover;
            border: 3px solid #222;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        
        .iphone-notch {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: #000;
            border-radius: 0 0 15px 15px;
            z-index: 10;
        }

        .notification-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        
        .unread {
            border-left: 5px solid var(--neon-pink);
            background-color: rgba(150, 0, 150, 0.3); /* Darker pink for unread */
        }
        
        .notification-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .message-modal-background {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 20;
        }

    </style>
</head>
<body>

    <div id="app" class="min-h-screen p-4 md:p-8 flex flex-col items-center">

        <div id="error-display" class="hidden fixed top-0 left-0 right-0 p-4 bg-red-800 text-white font-bold text-center z-50 shadow-2xl border-b-4 border-red-500">
            <p id="error-message">System Error Detected.</p>
        </div>

        <!-- Image header outside the main game card -->
        <div class="w-full max-w-4xl">
            
            <!-- The main game container will be where the dynamic rendering happens -->
            <div id="game-container">

                <div class="mx-auto w-11/12 md:w-2/3 mb-10 border-4 border-yellow-500 rounded-lg overflow-hidden shadow-xl">

                <img 
                    id="main-image-display" 
                    src="https://media.gettyimages.com/id/1363411424/photo/smiling-young-man-playing-an-acoustic-guitar.jpg?s=2048x2048&w=gi&k=20&c=z8m_ZT1x5gFEstoTfBIulNKpBzp6D-XAbbfA7b7e2B8="
                    alt="Current Landmark View" 
                    class="w-full h-auto object-cover"
                    onerror="this.onerror=null;this.src='https://placehold.co/800x400/374151/FFFFFF?text=Image+Load+Error';"
                />

                <!-- Content will be rendered here by JavaScript -->
            </div>
        </div>
    </div>

     <!-- Global Modal Structure for the Memory Matrix -->
    <div id="matrix-modal" class="modal" onclick="this.style.display = 'none';">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border-4 border-neon-pink max-w-3xl w-11/12" onclick="event.stopPropagation()">
            <h4 class="text-3xl title-font text-neon-pink mb-6 text-center">MEMORY COMPONENT MATRIX</h4>
            <div id="matrix-content">
                <!-- Matrix table generated here -->
            </div>
            <p class="text-center text-sm text-gray-400 mt-4 italic">Click out of this window to close it.</p>
        </div>
    </div>

    <!-- Cinematic View Overlay (Fixed position, hidden by default) -->
    <div id="cinematicView" class="hidden fixed inset-0 flex flex-col items-center justify-center p-4 bg-black/90 opacity-0" onclick="displayNextSentence()">
        
        <!-- Image Container -->
        <div class="mb-6 flex justify-center w-full max-w-4xl">
            <img id="imageDisplay" src="" alt="Cinematic Scene Image" class="rounded-xl transition-opacity duration-700 opacity-0 w-full h-auto max-h-[60vh] object-cover shadow-2xl" onerror="this.src='https://placehold.co/800x450/1e293b/ffffff?text=Image+Loading+Failed'" />
        </div>

        <!-- Text Box (Larger and centered) -->
        <div id="textBox" class="w-full max-w-4xl p-6 text-2xl font-sans text-center rounded-xl transition-all duration-500 hover:shadow-2xl hover:bg-opacity-95">
            <p id="cinematicText" class="text-gray-100 italic">Click anywhere to begin...</p>
        </div>

        <!-- Optional instruction/hint -->
        <p class="text-xs text-gray-500 mt-4 tracking-wider uppercase">Click anywhere on the screen to advance the story.</p>
    </div>



    <!-- Success Animation Overlay: Hidden by default, appears on successful challenge -->
    <div id="success-animation-overlay" class="success-overlay">
        <div id="rock-emoji" class="text-[100px] md:text-[200px] transform transition-transform duration-100 ease-out">
            🤘
        </div>
    </div>

    <script type="module">
        // Global Game State

        
        const songRecipesData = [

        function getLevelProgression() {
            // 1. Calculate Total XP
            const totalXP = Object.values(game.chops).reduce((sum, value) => sum + value, 0);
            game.totalXP = totalXP; // Update global state
            
            // 2. Determine current level and boundaries
            let currentLevelData = LEVEL_CONFIG[0];
            let currentLevelIndex = 0;

            // Find the highest level the player has achieved
            for (let i = LEVEL_CONFIG.length - 1; i >= 0; i--) {
                if (totalXP >= LEVEL_CONFIG[i].requiredXP) {
                    currentLevelData = LEVEL_CONFIG[i];
                    currentLevelIndex = i;
                    break;
                }
            }

            const nextLevelIndex = currentLevelIndex + 1;
            const nextLevelData = LEVEL_CONFIG[nextLevelIndex] || LEVEL_CONFIG[LEVEL_CONFIG.length - 1];

            // 3. Calculate progress for the overall level bar
            let progressPercentage = 0;
            let xpToNextLevel = 'N/A';
            const isMaxLevel = currentLevelData.level === LEVEL_CONFIG[LEVEL_CONFIG.length - 1].level;
            
            if (!isMaxLevel) {
                const requiredXPForCurrent = currentLevelData.requiredXP;
                const requiredXPForNext = nextLevelData.requiredXP;
                
                const xpInCurrentSegment = totalXP - requiredXPForCurrent;
                const levelSpan = requiredXPForNext - requiredXPForCurrent;

                xpToNextLevel = requiredXPForNext - totalXP;
                progressPercentage = (xpInCurrentSegment / levelSpan) * 100;
                progressPercentage = Math.min(100, Math.max(0, progressPercentage));
            } else {
                // Max level reached
                progressPercentage = 100;
                xpToNextLevel = 'MAX';
            }

            game.level = currentLevelData.level; // Update global state
            
            const RANK_NAMES = ["Dreamer", "Aspiring Artist", "Opener", "Headliner", "Rock Legend"];


            return {
                level: currentLevelData.level,
                rank: RANK_NAMES[currentLevelData.level] || 'Beyond Legend',
                xpToNextLevel: xpToNextLevel,
                progressPercentage: progressPercentage.toFixed(0),
                currentChopMax: currentLevelData.chopMaxScale // New dynamic scale for individual chops
            };
        }

        /**
         * Simple Base64 decoding utility (needed for exponential backoff)
         */
        const base64ToArrayBuffer = (base64) => {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        };

        /**
         * Exponential backoff retry loop for API calls.
         * @param {Function} fetcher - The function that performs the fetch request.
         * @param {number} maxRetries - Maximum number of retries.
         */
        async function fetchWithRetry(fetcher, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetcher();
                    if (!response.ok) {
                        // Throw error if response is not 2xx
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === maxRetries - 1) throw error; // Re-throw if last attempt failed
                    
                    // Wait 2^i * 1000ms
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

            const maxId = notifications.reduce((max, notification) => Math.max(max, notification.id), 0);
            const newId = maxId + 1;

            const summaryText = fullText.length > 30 
                                ? fullText.substring(0, 27) + '...' 
                                : fullText;

            const newNotification = {
                id: newId,
                app: appName,
                emoji: emoji,
                summary: summaryText,
                fullContent: fullText,
                unread: true // Always set to true
            };

            let arrayToAppendTo = notifications;

            if (notifications.length >= 6) {
                arrayToAppendTo = notifications.slice(1);
            }
            
            return [...arrayToAppendTo, newNotification];
        }

        function renderPhase7() {
        // --- Local Wordle Game State ---
            const targetWord = 'music'; //game.words[Math.floor(Math.random() * game.words.length)];

            let guesses = []; // Array of {word: '...', result: ['absent', 'present', 'correct', ...]}
            let currentGuess = '';
            let gameStatus = 'playing'; // 'playing', 'win', 'lose'
            let localMessage = game.message; // Use initial global message
            let availableKeys = {}; // Tracks key status for keyboard colors

            // --- Utility Functions ---

            function updateUI() {
                const contentDiv = document.getElementById('wordle-content');
                if (!contentDiv) return;

                // 1. Update the message
                const messageEl = document.getElementById('wordle-message');
                if (messageEl) messageEl.textContent = localMessage;

                // 2. Update the grid
                const gridHtml = Array(6).fill(0).map((_, rowIdx) => {
                    const rowData = guesses[rowIdx];
                    let rowContent = '';
                    for (let i = 0; i < 5; i++) {
                        let letter = '';
                        let className = 'box-empty';

                        if (rowData) {
                            // Previous guess
                            letter = rowData.word[i];
                            className = `box-${rowData.result[i]}`;
                        } else if (rowIdx === guesses.length) {
                            // Current guess
                            letter = currentGuess[i] || '';
                            className = currentGuess[i] ? 'box-current' : 'box-empty';
                        }

                        rowContent += `<div class="wordle-box ${className}">${letter}</div>`;
                    }
                    return `<div class="wordle-row">${rowContent}</div>`;
                }).join('');

                const gridEl = document.getElementById('wordle-grid');
                if (gridEl) gridEl.innerHTML = gridHtml;

                // 3. Update the keyboard
                const keyElements = document.querySelectorAll('.key-button');
                keyElements.forEach(keyEl => {
                    const key = keyEl.getAttribute('data-key');
                    keyEl.className = `key-button ${availableKeys[key] ? `key-${availableKeys[key]}` : ''}`;

                    // Disable keys if game over
                    if (gameStatus !== 'playing') {
                        keyEl.disabled = true;
                    } else {
                        keyEl.disabled = false;
                    }
                });
            }

            function checkGuess(guess) {
                guess = guess.toLowerCase()
                if (guess.length !== 5) {
                    localMessage = 'ERROR: Word must be 5 letters.';
                    updateUI();
                    return;
                }

                        //Dictionary Check ---
                if (!game.words.includes(guess)) {
                    //console.log('Guess:', guess)
                    localMessage = `ERROR: "${guess}" is not in the dictionary.`;
                    currentGuess = ''; // Clear guess to force re-entry
                    updateUI();
                    return;
                }

                const result = Array(5).fill('absent');
                const targetMap = {};
                for (const char of targetWord) {
                    targetMap[char] = (targetMap[char] || 0) + 1;
                }

                // Pass 1: Check for correct (green)
                for (let i = 0; i < 5; i++) {
                    if (guess[i] === targetWord[i]) {
                        result[i] = 'correct';
                        targetMap[guess[i]]--;
                        availableKeys[guess[i]] = 'correct';
                    }
                }

                // Pass 2: Check for present (yellow)
                for (let i = 0; i < 5; i++) {
                    if (result[i] !== 'correct') {
                        if (targetMap[guess[i]] > 0) {
                            result[i] = 'present';
                            targetMap[guess[i]]--;
                            if (availableKeys[guess[i]] !== 'correct') {
                                availableKeys[guess[i]] = 'present';
                            }
                        } else {
                            if (!availableKeys[guess[i]]) {
                                availableKeys[guess[i]] = 'absent';
                            }
                        }
                    }
                }

                guesses.push({ word: guess, result: result });
                currentGuess = '';

                if (guess === targetWord) {
                    gameStatus = 'win';
                    console.log('winning wordle');
                    const scoreIncrease = 100 - (guesses.length * 10); // Better score for fewer guesses

                    setTimeout(returnToMainMenu, 3500);
                } else {
                    localMessage = 'Guess submitted. Try again.';
                    updateUI(); // Update UI for next gue
                }

                updateUI();
            }



            function handleKey(key) {
                if (gameStatus !== 'playing') return;

                key = key.toUpperCase();

                if (key === 'ENTER') {
                    checkGuess(currentGuess);
                } else if (key === 'BACKSPACE') {
                    currentGuess = currentGuess.slice(0, -1);
                    localMessage = 'Guess the 5-letter word!';
                    updateUI();
                } else if (key.length === 1 && key.match(/[A-Z]/)) {
                    if (currentGuess.length < 5) {

                        updateUI();

                }
            }

        /**
         * Initializes the Tone.js components with better sound quality.
         * Creates a PolySynth with distortion for a "rock/metal" feel.
         */
        function initializeTone() {
            if (game.leadSynth && game.musicTransport) {
                console.log("Tone.js components already initialized.");
                return;
            }
            
            console.log("Initializing Tone.js components...");

            // 1. Create Effects Chain
            const reverb = new Tone.Reverb({
                decay: 1.5, // Slightly shorter reverb
                preDelay: 0.01,
            });
            reverb.wet.value = 0.05; 

            // 2. Create the PolySynth (Tone.Synth for a cleaner sound)
            game.leadSynth = new Tone.PolySynth(Tone.Synth, {
                // Classic MIDI/clean tone parameters
                oscillator: { 
                    type: "triangle" // Softer, cleaner waveform, replacing 'sawtooth'
                },
                envelope: {
                    attack: 0.005, // Very fast attack
                    decay: 0.1,   // Quick decay
                    sustain: 0.8, // No sustain (more like a piano/bell)
                    release: 1.0, // Moderate release
                },
                volume: -10 //
            }).chain(reverb, Tone.Destination); // Chain through reverb to output (no distortion)

            // 3. Set up Tone.Transport
            game.musicTransport = Tone.Transport;
            game.musicTransport.bpm.value = 120; // Fast tempo
            console.log("Tone.js PolySynth and Transport Initialized.");
        }




        async function playMusicChallenge(rawMidiPath) {
             // 1. Dispose of previous music part if it exists
            if (game.musicPart) {
                game.musicPart.dispose();
                game.musicPart = null;
            }
            stopMusic(); // Ensure transport is stopped

            // Safety check
            if (!Midi) {
                 updateState({ error: "MIDI parser library not loaded.", message: 'MIDI PARSER MISSING.' });
                 return;
            }
            
            // Ensure audio context and instruments are initialized
            await Tone.start();
            initializeTone();

            const PUBLIC_MIDI_URL = rawMidiPath
            try {
                console.log(`Attempting to load MIDI from: ${PUBLIC_MIDI_URL}`);
                updateState({ message: `Loading and parsing track: ${game.currentSong}...`, isLoading: true });

                // 2. Fetch the MIDI file as an ArrayBuffer
                const response = await fetch(PUBLIC_MIDI_URL);
                const arrayBuffer = await response.arrayBuffer();

                // 3. Parse the MIDI data
                const midi = new Midi(arrayBuffer);

                // 4. Extract notes for the Tone.Part
                const partData = [];
                let maxDuration = 0; // Use to calculate the loop end

                midi.tracks.forEach(track => {
                    // Collect all notes from all tracks
                    track.notes.forEach(note => {
                        // The MIDI parser returns note data in the format Tone.js expects
                        partData.push({
                            time: note.time,        // Time in seconds
                            note: note.name,        // E.g., 'C4'
                            duration: note.duration,
                            velocity: note.velocity // 0-1
                        });
                    });
                    
                    // Track the maximum duration for looping purposes
                    if (track.duration > maxDuration) {
                        maxDuration = track.duration;
                    }
                });

                if (partData.length === 0) {
                    throw new Error("MIDI file contained no playable notes/tracks.");
                }

                const START_OFFSET_SECONDS  = 40
                // Set the transport loop based on the MIDI file's total duration
                // We will loop the music over the total max duration of the longest track.
                game.musicTransport.loop = true;
                game.musicTransport.position = START_OFFSET_SECONDS;
                game.musicTransport.loopEnd = maxDuration; // Set loop end to the actual duration

                // 5. Create the Tone.Part with the real data
                game.musicPart = new Tone.Part((time, value) => {
                    // Use the leadSynth to play the note
                    game.leadSynth.triggerAttackRelease(
                        value.note, 
                        value.duration, 
                        time, 
                        value.velocity
                    );
                }, partData);
                
                game.musicPart.start(0); // Start the part at transport position 0

                // 6. Start the Transport
                game.musicTransport.start();

                console.log(`Successfully loaded and scheduled ${partData.length} notes from MIDI.`);
                updateState({ message: `Streaming LIVE: ${game.currentSong}. GUESS THE BAND!`, isLoading: false });

            } catch (e) {
                console.error("MIDI loading/parsing failed:", e);
                updateState({ 
                    error: `MIDI Load Error: ${e.message}. Check console for details.`, 
                    message: 'AUDIO SYSTEM FAILED TO LOAD TRACK.', 
                    isLoading: false 
                });
            }

        }

        /**
         * Stops the Tone.js transport and disposes of the synth.
         */
        function stopMusic() {
            if (game.musicTransport && game.musicTransport.state === 'started') {
                game.musicTransport.stop();
                game.musicTransport.cancel(0); // Clear all scheduled events
            }
            if (game.musicLoop) {
                game.musicLoop.dispose();
                game.musicLoop = null;
            }
        }

        function setupFeudGame() {
            game.familyFeud.challenges = familyFeudChallenges.sort(() => Math.random() - 0.5); // Shuffle challenges
            game.familyFeud.currentChallengeIndex = 0;
            game.familyFeud.totalPointsScored = 0;
            loadNextFeudQuestion();
            if (game.familyFeud.currentChallenge) {
                 setPhase(11, 'Welcome to the Survey Challenge! Guess the top 5 answers.');
            } else {
                 setPhase(0, `No challenges found! Returning to menu.`, null);
            }
            renderGame();
        }

        /**
         * Loads the next question from the challenge pool.
         */
        function loadNextFeudQuestion() {
            const index = game.familyFeud.currentChallengeIndex;
            if (index >= game.familyFeud.challenges.length) {
                setPhase(0, `You cleared all challenges! Total score: $${game.familyFeud.totalPointsScored}`, null);
                return;
            }

            const challenge = game.familyFeud.challenges[index];
            game.familyFeud.currentChallenge = challenge;
            game.familyFeud.revealedAnswers = challenge.a.map(() => false);
            game.familyFeud.strikes = 0;
            game.familyFeud.roundPoints = 0;
            game.familyFeud.isRoundActive = true;
            //renderGame(); // Re-render to show new question
        }

        /**
         * Player submits a guess for the current question.
         * @param {string} guess - The player's answer attempt.
         */
        function submitFeudGuess(guess) {
            if (!game.familyFeud.isRoundActive || game.isLoading) return;
            
            const normalizedGuess = guess.trim().toLowerCase();
            const currentChallenge = game.familyFeud.currentChallenge;
            let correct = false;

            // Check against each unrevealed answer
            for (let i = 0; i < currentChallenge.a.length; i++) {
                if (game.familyFeud.revealedAnswers[i]) continue; // Skip revealed answers

                const normalizedAnswer = currentChallenge.a[i].text.toLowerCase();

                // Simple matching logic (could be improved with fuzzy matching)
                if (normalizedAnswer.includes(normalizedGuess) || normalizedGuess === normalizedAnswer) {
                    game.familyFeud.revealedAnswers[i] = true;
                    game.familyFeud.roundPoints += currentChallenge.a[i].points;
                    game.message = `CORRECT! You found answer #${i + 1} for ${currentChallenge.a[i].points} points.`;
                    correct = true;
                    break;
                }
            }

            if (correct) {
                // Check if all answers are revealed (round over)
                if (game.familyFeud.revealedAnswers.filter(r => r).length >= 3) {
                    endFeudRound(true);
                    

                }
            } else {
                game.familyFeud.strikes++;
                game.message = `STRIKE ${game.familyFeud.strikes}! Incorrect answer.`;
                // Check for 3 strikes (round lost)
                if (game.familyFeud.strikes >= 3) {
                    endFeudRound(false);
                    
                }
            }

            renderGame();
        }

        /**
         * Ends the current round and updates score.
         * @param {boolean} wonRound - True if all answers were found, false if 3 strikes hit.
         */
        function endFeudRound(wonRound) {
            game.familyFeud.isRoundActive = false;
            
            if (wonRound) {
                game.score += game.familyFeud.roundPoints;
                game.familyFeud.totalPointsScored += game.familyFeud.roundPoints;
                game.chops["Stage Presence"] += game.familyFeud.roundPoints
                game.message = `ROUND WON! You scored ${game.familyFeud.roundPoints} Stage Presence points.`;
            } else {
                game.chops["Stage Presence"] = Math.max(0, game.chops["Stage Presence"] - 10);
                game.message = `THREE STRIKES! You lost score 10 points. Total score remains $${game.chops["Stage Presence"]}.`;
                  // Reveal all answers for feedback
                game.familyFeud.revealedAnswers = game.familyFeud.currentChallenge.a.map(() => true);
            }

            // Move to next question index
            game.familyFeud.currentChallengeIndex++;

            renderGame();
        }

        /**

        function handleGuess() {
            if (CLUE_GAME_STATE.gameOver || !clueGameElements.guessInput || !CLUE_GAME_STATE.currentChallenge) return;

            const { word, points } = CLUE_GAME_STATE.currentChallenge;

                updateFeedback("Please enter a guess.", 'text-yellow-400 bg-yellow-900/50 border border-yellow-700');
                return;

            const normalizedGuess = rawGuess.toUpperCase();
            const normalizedCorrect = word.toUpperCase();

            if (normalizedGuess === normalizedCorrect) {
                game.score += points; // Use dynamic points

                updateFeedback(`🎉 CORRECT! The word was: ${word}. +${points} Lyrical Flow points!`, 'text-green-400 bg-green-900/50 border border-green-700');
                endGame();
                //renderGame(); // Update main score display

            } else {
                CLUE_GAME_STATE.triesLeft--;

                if (CLUE_GAME_STATE.triesLeft > 0) {
                    game.chops["Lyrical Flow"] = Math.max(0, game.chops["Lyrical Flow"] - 10);

                } else {
                    updateFeedback(`❌ GAME OVER. The correct word was: ${word}.`, 'text-red-400 bg-red-900/50 border border-red-700');
                    endGame();
                }
            }
        }

    /**
     * Renders all landmark markers and their bounding boxes.
     */
    function renderLandmarks() {
     const mapElement = document.getElementById('sf-map');
        if (!mapElement) return;
        
        // Clear all previous children
        mapElement.innerHTML = ''; 

        for (const name in landmarkData) {
            const bbox = landmarkData[name];
            
            // Only render nodes that are visible on the map (Y < 800)
            const isRendered = bbox.Y < 800;

            if (isRendered) {
                
                // Read the 'hidden' property
                const isHidden = bbox.hidden || false; 

                // Calculate center of bounding box for the visual node
                const centerX = bbox.X + (bbox.W / 2);
                const centerY = bbox.Y + (bbox.H / 2);
                
                // --- Create a group for the whole landmark (emoji + name + click area) ---
                // Add the 'hidden' class based on the data property
                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute('class', `landmark-group ${isHidden ? 'hidden' : ''}`); 
                group.setAttribute('title', name);
                group.onclick = () => handleClick(name);
                
                // --- 1. Draw the Invisible Bounding Box (Clickable Area) ---
                const nodeRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                nodeRect.setAttribute('x', bbox.X - 5);
                nodeRect.setAttribute('y', bbox.Y - 5);
                nodeRect.setAttribute('width', bbox.W + 10);
                nodeRect.setAttribute('height', bbox.H + 10);
                nodeRect.setAttribute('fill', '#000');
                nodeRect.setAttribute('opacity', 0);
                
                group.appendChild(nodeRect); 
                
                // --- 2. Draw the Visual Landmark Marker (Emoji) ---
                const markerEmoji = document.createElementNS("http://www.w3.org/2000/svg", "text");
                markerEmoji.setAttribute('x', centerX);
                markerEmoji.setAttribute('y', centerY + 3);
                markerEmoji.setAttribute('font-size', '24'); 
                markerEmoji.setAttribute('text-anchor', 'middle');
                markerEmoji.setAttribute('class', 'landmark-emoji');
                markerEmoji.textContent = bbox.emoji; 
                
                group.appendChild(markerEmoji);
                
                // --- 3. Draw the Location Name (With Highlighting) ---
                const markerName = document.createElementNS("http://www.w3.org/2000/svg", "text");
                markerName.setAttribute('x', centerX);
                markerName.setAttribute('y', centerY + 24); 
                markerName.setAttribute('text-anchor', 'middle');
                markerName.setAttribute('class', 'landmark-name');
                
                let displayName = name;
                if (name.length > 15 && name.indexOf(' ') !== -1) {
                    displayName = name.split(' ')[0] + '...'; 
                } else if (name.length > 15) {
                    displayName = name.substring(0, 12) + '...';
                }

                markerName.textContent = displayName.toUpperCase();
                
                group.appendChild(markerName);
                
                mapElement.appendChild(group);
            }
        }
        return mapElement;
    }

    /** Calculates the combined score from memories on the mixing board. */
        function calculateMixedScore() {
            let grit = 0;
            let soul = 0;
            let depth = 0;

            game.mixingBoard.forEach(theme => {
                const memory = memoryComponentMatrix[theme];
                grit += memory.grit;
                soul += memory.soul;
                depth += memory.depth;
            });

            game.mixedScore = { grit, soul, depth };
        }

        /** Checks if the current mixed score matches any un-found recipe. */
        function checkRecipeMatch() {
            const currentG = game.mixedScore.grit;
            const currentS = game.mixedScore.soul;
            const currentD = game.mixedScore.depth;
            let matchFound = null;

            game.songRecipes.forEach(recipe => {
                if (!recipe.found && 
                    recipe.mix.grit === currentG &&
                    recipe.mix.soul === currentS &&
                    recipe.mix.depth === currentD) {
                    
                    recipe.found = true; 
                    game.songCounts +=1; // Mark as found
                    matchFound = recipe;
                }
            });


            if (matchFound) {
                game.message = `NEW SONG ACHIEVED: "${matchFound.title}" (${matchFound.type})!`;
            }
        }

        /** Handles adding/removing a memory from the mixing board. */
        function toggleMemoryOnBoard(memoryTheme, isFromBoard = false) {
            
            // Check if the memory is already on the board
            const indexOnBoard = game.mixingBoard.indexOf(memoryTheme);

            if (indexOnBoard !== -1) {
                // Remove from board
                game.mixingBoard.splice(indexOnBoard, 1);
                game.memories[memoryTheme]++; // Return count
                game.message = `De-mixed ${memoryTheme}.`;
            } else if (!isFromBoard) {
                // Add to board (only if clicked from inventory and capacity allows)
                if (game.mixingBoard.length < 3) {
                    if (game.memories[memoryTheme] > 0) {
                        game.mixingBoard.push(memoryTheme);
                        game.memories[memoryTheme]--; // Decrement count
                        game.message = `Mixed in ${memoryTheme}.`;
                    } else {
                        game.message = `No ${memoryTheme} memories remaining in inventory.`;
                    }
                } else {
                    game.message = `Mixing Board is full (Max 3 components). Click a memory on the board to remove it first.`;
                }
            }

            calculateMixedScore();
            checkRecipeMatch();
            renderGame(); // Re-render to update scores and UI
        }

        function renderMessageDetail(index) {
            const note = iphoneNotifications[index];
            if (!note) return createElement('div', 'text-center p-8 text-red-500', 'Message not found.');

            const messageDetail = createElement('div', 'message-modal-background absolute inset-0 flex flex-col justify-between p-6 rounded-3xl', `
                <div class="flex justify-between items-center border-b border-gray-600 pb-3">
                    <span class="text-lg font-bold text-white">${note.app}</span>
                    <span class="text-2xl">${note.emoji}</span>
                </div>
                <div class="flex-1 overflow-y-auto my-4 text-center">
                    <p class="text-xl font-mono text-gray-200">${note.fullContent}</p>
                </div>
                <button class="bg-neon-pink text-gray-900 font-extrabold py-2 rounded-lg mt-4 shadow-xl hover:bg-white transition" onclick="closeMessageView()">
                    BACK TO NOTIFICATIONS
                </button>
            `);

            // Attach click handler to the background to close the message view
            messageDetail.onclick = (event) => {
                 event.stopPropagation(); // Prevents exiting phase 11 when clicking the message screen
            };

            return messageDetail;
        }

        function renderIphoneScreen() {
            if (game.iphoneState.view === 'message') {
                return renderMessageDetail(game.iphoneState.selectedMessageIndex);
            }
            // Default view: notifications list
            const screenContent = createElement('div', 'h-full w-full flex flex-col items-center');
            
            // Status Bar Placeholder
            screenContent.innerHTML = `
                <div class="w-full text-center text-xs font-mono text-white mb-4 flex justify-between px-6">
                    <span>9:41</span>
                    <span class="font-bold text-neon-pink"></span>
                    <span>📶🛜🔋</span>
                </div>
                <h1 class="text-2xl font-bold text-white mb-6 uppercase tracking-wider">NOTIFICATIONS</h1>
            `;

            screenContent.appendChild(renderNotificationList());
            return screenContent;
        }

        function renderPhone() {
            // The main click handler for the entire 
            const phaseContainer = createElement('div', 'flex flex-col items-center justify-center h-full p-6');
            phaseContainer.innerHTML = `
                <p class="text-lg text-gray-400 mb-6 text-center">
                   
                </p>
                <!-- Outer click handler to return to menu -->
                <div id="iphone-exit-area" class="w-full h-full flex items-center justify-center absolute inset-0 z-10" onclick="returnPhoneToMainMenu()">
                    
                    <div class="iphone-frame z-20" onclick="event.stopPropagation()">
                        <div class="iphone-notch"></div>
                        <div class="iphone-screen" id="iphone-screen-content">
                            <!-- Dynamic Content Rendered Here -->
                        </div>
                    </div>

                </div>
            `;
            
            // Since the phaseContainer is created first, we need a slight delay to find the inner element
            setTimeout(() => {
                const screenContentArea = document.getElementById('iphone-screen-content');
                if (screenContentArea) {
                    screenContentArea.innerHTML = '';
                    screenContentArea.appendChild(renderIphoneScreen());
                }
            }, 0);

            return phaseContainer;
        }

        const getUnreadNotificationCount = () => {
            return iphoneNotifications.filter(n => n.unread).length;
        };

        /** Toggles between the Main Menu (0) and the Notifications (16) screen. */
        function handlePhoneClick() {
            if (game.phase === 16) {
                setPhase(0, 'Returning to System Menu.');
            } else {
                setPhase(16, 'New communications received. Check your Pocket Comp.');
            }
        }
        
        /** Generates the SVG icon for the "Pocket Comp" (iPhone). */
        const generatePhoneIcon = () => {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="text-neon-pink p-1 rounded-lg border-2 border-neon-pink bg-gray-900 shadow-xl transition-all" style="filter: drop-shadow(0 0 8px rgba(255, 0, 255, 0.5));">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                    <path d="M12 18h.01" />
                    <path d="M7 6h10" />
                    <path d="M7 15h10" />
                    <path d="M7 12h10" />
                    <path d="M7 9h10" />
                </svg>
            `;
        }

        /** Generates the red notification badge if unread notifications exist. */
        const generateNotificationBadge = () => {
            const unreadCount = getUnreadNotificationCount();
            if (unreadCount > 0) {
                return `<div class="absolute -top-1 -right-1 h-5 w-5 bg-red-600 rounded-full flex items-center justify-center text-xs font-bold text-white shadow-lg border border-white z-10 animate-pulse">
                            ${unreadCount}
                        </div>`;
            }
            return '';
        };
    function renderWinScreen() {
        const winContent = createElement('div', 'flex flex-col items-center justify-center h-full text-center bg-gray-800 p-10 rounded-xl shadow-2xl');
        winContent.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-electric-cyan mb-6 speed-icon">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>
            </svg>
            <h3 class="text-5xl font-extrabold title-font text-electric-cyan">SYSTEM OVERRIDE!</h3>
            <p class="text-2xl text-gray-300 mt-4">MACHINE DEFEATED. FINAL SCORE: $${game.score}</p>
        `;
        const restartButton = createElement('button', 'metal-button w-2/3 py-4 text-xl mt-8 bg-red-600 hover:bg-red-700', 'REBOOT CHALLENGE');
        restartButton.onclick = () => window.location.reload();
        winContent.appendChild(restartButton);
        return winContent;
    }

        

    /**
     * Main render function: builds the entire UI based on game state.
     */
    window.renderGame = function() {
        if (game.score >= 20001) {
            appContainer.innerHTML = '';
            appContainer.appendChild(renderWinScreen());
            return;
        }

        // --- 1. Calculate Progression ---
        const progression = getLevelProgression();
        const chopMax = progression.currentChopMax; // Get dynamic max for chop bars

        // --- 2. Define chop colors ---
        const chopColorMap = {
            "Harmonic Theory": { bg: 'bg-blue-500', text: 'text-blue-400' },
            "Tone Crafting": { bg: 'bg-yellow-500', text: 'text-yellow-400' },
            "Rhythm Mastery": { bg: 'bg-red-500', text: 'text-red-400' },
            "Fretboard Control": { bg: 'bg-green-500', text: 'text-green-400' },
            "Lyrical Flow": { bg: 'bg-purple-500', text: 'text-purple-400' },
            "Stage Presence": { bg: 'bg-pink-500', text: 'text-pink-400' }
        };

       const chopsHtml = Object.entries(game.chops).map(([chopName, chopValue]) => {
                const color = chopColorMap[chopName];
                // Individual Chop Bar calculation uses the dynamic chopMax
                const percentage = Math.min(100, Math.max(0, (chopValue / chopMax) * 100)); 
                
                return `
                    <div class="space-y-1">
                        <div class="flex justify-between items-center text-xs font-mono text-gray-400">
                            <span class="${color.text} font-bold tracking-wide">${chopName.toUpperCase()}</span>
                            <span class="${color.text}">${chopValue} / ${chopMax} XP</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-2 shadow-inner border border-gray-700">
                            <div class="h-2 rounded-full transition-all duration-500 ${color.bg}" style="width: ${percentage}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');


        // Game Panels Structure
        let mainContent = `
                <div class="flex w-full metal-card min-h-[700px]">
                    <!-- LEFT PANEL: Conductor Info -->
                    <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-between border-r-4 border-electric-cyan">
                        <div class="text-center space-y-3">
                            <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 font-title text-electric-cyan">A.I. CONDUCTOR</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-electric-cyan speed-icon">
                                <path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M9 10h.01"/><path d="M15 10h.01"/>
                            </svg>
                            <div class="text-sm font-mono mt-4 p-2 bg-gray-700 rounded-lg border border-electric-cyan/50">
                                <p>STATUS: ${game.isLoading ? 'LOADING' : 'IDLE'}</p>
                                <p>PHASE: ${game.phase}</p>
                            </div>
                        </div>

                    <!-- SCORE REGISTER -->
                        <div class="mt-4 p-3 bg-gray-700 rounded-lg border border-yellow-400/50 shadow-xl">
                            <p class="text-sm font-mono text-gray-400">MONEY</p>
                            <p class="text-4xl font-extrabold text-yellow-400 title-font">$${game.score}</p>
                            <!-- p class="text-xs text-gray-200">TOTAL XP: ${game.totalXP}</p> -->
                        </div>

                    <!-- PHONE -->
                    <div class="mt-8 pt-4 border-t border-gray-700 w-full text-center">
                            <h3 class="text-lg font-bold title-font text-neon-pink mb-2"> Phone</h3>
                            <div 
                                id="iphone-icon-container" 
                                class="relative inline-block cursor-pointer p-2 transition-transform duration-200 hover:scale-110"
                                onclick="handlePhoneClick()"
                            >
                                ${generatePhoneIcon()}
                                ${generateNotificationBadge()}
                            </div>
                        </div>

                    <!-- INVENTORY -->
                        <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                            <p class="text-sm font-mono text-gray-400 mb-2">INVENTORY</p>
                            <div id="inventory-display" class="grid grid-cols-4 gap-2">
                                ${game.purchasedItems.length === 0 
                                    ? '<p class="text-xs text-gray-500 italic col-span-4">No items acquired.</p>'
                                    : game.purchasedItems.map(item => `
                                        <div class="p-1 text-center bg-gray-600 rounded-md border border-electric-cyan/70 hover:bg-gray-500" title="${item.name}">
                                            <span class="text-2xl">${item.icon}</span>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>


                         <!-- NEW: FAN ENTHUSIASM PANEL -->
                        ${game.isFanPanelVisible ? `
                    <div id="fan-enthusiasm-panel" class="w-full mt-6 p-4 text-center rounded-lg border-2 border-fuchsia-500 shadow-neon-red bg-fuchsia-900/40 fan-panel-glow transition-all duration-300 ease-in-out">
                        <h3 class="text-xl font-extrabold title-font text-fuchsia-400 mb-2 border-b border-fuchsia-500/50 pb-1">AUDIENCE HYPE</h3>
                        <!-- Microphone/Vocal SVG Icon for Music Theme -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-fuchsia-500 animate-pulse">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
                        </svg>
                        <p class="text-sm font-mono text-gray-300 mt-2">CURRENT FANS</p>
                        <p class="text-3xl font-extrabold title-font text-fuchsia-400">${game.fans.toLocaleString()}</p>
                        <p class="text-xs text-fuchsia-300 mt-1">THE CROWD ROARS!</p>
                    </div>
                    ` : '<div class="w-full mt-6 p-4 text-center text-xs text-gray-600 italic border border-gray-700 rounded-lg">Fan data minimized.</div>'}
                    <!-- END NEW FAN ENTHUSIASM PANEL -->

                    <!-- SONGS CREATED COUNT (NEW VIBRANT SECTION) -->
                                <div class="mt-4 p-3 bg-gray-800 rounded-lg border-2 border-neon-pink/70 shadow-neon-pink shadow-lg w-full text-center">
                                    <p class="text-sm font-mono text-neon-pink mb-1">SONGS CREATED</p>
                                    <p class="text-5xl font-extrabold text-neon-pink title-font">${game.songCounts}</p>
                                </div>


                             <!--  Memory Counter Display -->
                    <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                        <p class="text-sm font-mono text-gray-400 mb-2">MEMORIES COLLECTED</p>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            ${Object.entries(game.memories)
                                .filter(([type, count]) => count > 0) 
                                .map(([type, count]) => `
                                <div class="flex items-center space-x-2 p-1 px-2 rounded-md bg-gray-700 shadow-inner hover:bg-gray-600 transition-colors" 
                                     title="${memoryComponentMatrix[type].description}">
                                    
                                    <!-- Memory Ball Icon -->
                                    <div class="w-5 h-5 rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white/50 ${memoryComponentMatrix[type].tailwind}" style="font-size: 0.75rem;">
                                        ${memoryComponentMatrix[type].emoji}
                                    </div>
                                    
                                    <span class="font-bold text-yellow-400 text-lg">${count}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>



                       


                        <div class="text-center text-xs text-gray-500">
                            <p>Lux Aeterna!</p>
                        </div>
                    </div>

                    <!-- CENTER PANEL: Game Interaction -->
                    <div id="center-panel" class="flex-1 p-6 flex flex-col justify-between">
                        <h2 class="text-4xl font-extrabold text-white mb-4 text-center font-title">
                            ${game.phase > 1 ? 'LIVE CHALLENGE INTERFACE' : (game.phase === 0 ? 'SYSTEM MENU' : 'BOOT SEQUENCE')}
                        </h2>
                        
                        <!-- Game Message Panel -->
                        <div class="p-4 mb-6 text-center rounded-sm font-semibold shadow-md bg-electric-blue/20 text-electric-cyan border border-electric-blue">
                            ${game.message}
                        </div>

                        <!-- Dynamic Phase Content Placeholder -->
                        <div id="dynamic-content" class="flex-1"></div>
                    </div>

                     <!-- RIGHT PANEL: Player Info -->
                    <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-start border-l-4 border-electric-cyan overflow-y-auto">
                        <div class="text-center space-y-3 w-full">
                            <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 title-font text-electric-cyan">PLAYER DATA</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-yellow-400 speed-icon">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                            
                            <!-- LEVEL AND RANK DISPLAY -->
                            <div class="p-3 bg-gray-700 rounded-lg border border-indigo-400/50 shadow-xl mt-4">
                                <p class="text-sm font-mono text-gray-400">PLAYER LEVEL / RANK</p>
                                <p class="text-4xl font-extrabold text-indigo-400 title-font">${progression.level}</p>
                                <p class="text-lg text-gray-200">${progression.rank.toUpperCase()}</p>
                            </div>

                           
                            
                           <!-- Overall Level Progress Bar -->
                            <div class="mt-4 pt-4 border-t border-gray-700 w-full">
                                <p class="text-sm font-mono text-gray-400 mb-2 font-bold tracking-wider">LEVEL UP PROGRESS</p>
                                <div class="flex justify-between items-center text-xs text-gray-400 mb-1">
                                    <span>LVL ${progression.level}</span>
                                    <span class="text-green-400">${progression.xpToNextLevel === 'MAX' ? 'MAX RANK ACHIEVED' : `${progression.xpToNextLevel} XP to LVL ${progression.level + 1}`}</span>
                                </div>
                                <div class="w-full bg-gray-800 rounded-full h-3 shadow-inner border border-green-700">
                                    <div class="h-3 rounded-full bg-green-500 transition-all duration-500" style="width: ${progression.progressPercentage}%;"></div>
                                </div>
                            </div>
                            <!-- End Level Progress -->

                            <!-- CHOPS SECTION (Dynamic Max: ${chopMax}) -->
                            <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                                <h4 class="text-lg font-extrabold text-neon-pink mb-3 title-font text-center tracking-wider" style="text-shadow: 0 0 5px #ff00ff;">CHOPS</h4>
                                <div id="chops-display" class="space-y-3">
                                    ${chopsHtml}
                                </div>
                            </div>
                            <!-- END CHOP SKILLS SECTION -->

                            
                        </div>
                        <div class="text-center text-xs text-gray-500 mt-auto pt-4 border-t border-gray-700 w-full">
                            <p>Chase that light!</p>
                        </div>
                    </div>
                </div>
            `;
        
        appContainer.innerHTML = mainContent;

        // Render phase-specific content
        const dynamicContent = document.getElementById('dynamic-content');
        dynamicContent.innerHTML = '';
        
        let contentElement;
        switch (game.phase) {
            case 0:
                contentElement = renderPhase0();  //  Menu
                break;
            case 1:
                contentElement = renderPhase_boot(); // Original Phase 1
                break;
            case 2:
                contentElement = renderPhase2(); // show 2 topics
                break;
            case 3:
                contentElement = renderPhase3(); // show trivia question
                break;
            case 4:
                contentElement = renderAmoeba(); // Amoeba phase
                break;
            case 5:
                contentElement = renderPhase5(); // New Instructions Phase
                break;
            case 6:
                contentElement = renderPhase6();
                break;
            case 7:
                contentElement = renderPhase7(); // Wordle Game!
                break;
            case 8:
                contentElement = renderPhase8(); // Midi Game!
                break;
            case 9:
                contentElement = renderPhase9(); // Just one
                break;
            case 10:
                contentElement = renderMap();
                break 
            case 11:
                contentElement = renderPhase11(); // Family feud
                break 
            case 12:
                contentElement = renderPhase12(); // intro
                break 
            case 13:
                contentElement = renderPhase13(); // Song mixer
                break 
            case 14:
                contentElement = renderInventory(); // Inventory
                break 
            case 15:
                contentElement = renderItem(); // Inventory
                break 
            case 16:
                contentElement = renderPhone();
                break
            case 99: // NEW: Cinematic Phase
                contentElement = renderCinematic();
                break;
            default:
                const topicContent = createElement('div', 'flex flex-col items-center justify-center h-full space-y-8 p-8', 'UNKNOWN GAME STATE');
                const backButton = createElement('button', 'metal-button px-6 py-2 text-lg mt-8 bg-gray-600 hover:bg-gray-700', 'RETURN TO MENU');
                backButton.onclick = () => setPhase(0, 'Main Menu. Ready for the next challenge.');
                topicContent.appendChild(backButton);
                return topicContent;
        }
        dynamicContent.appendChild(contentElement);

        if (game.phase === 10) { 
                // Wait a moment to ensure the browser has fully rendered the SVG element
            setTimeout(renderLandmarks, 0); 
        }
    }

    // Initialize the game when the window loads
    window.onload = initializeLLM;
    window.setPhase = setPhase;
    window.updateState = updateState; // Expose updateState as well
    window.toggleLandmarkVisibilityByName = toggleLandmarkVisibilityByName;
    window.displayMemory = displayMemory;
    window.toggleFanPanel = toggleFanPanel;
    window.displayNextSentence = displayNextSentence;
    window.toggleMemoryOnBoard = toggleMemoryOnBoard;
    window.playMovie = playMovie;
    window.closeMessageView = closeMessageView;
    window.returnPhoneToMainMenu = returnPhoneToMainMenu;
    window.handlePhoneClick = handlePhoneClick;
    window.sids_money = sids_money;
    window.sids_cheer = sids_cheer;
    window.go_to_work = go_to_work;


    </script>
</body>
</html>
