    <script type="module">

        // ViewBox is 1000x800.

        let currentContext = { 
            name: game.currentBuildingName,

        };

        const MAIN_OUTPUT_ID = 'output-message';

        
        function createElement(tag, classes, innerHTML = '') {
            const el = document.createElement(tag);
            if(classes){
                el.className = classes;
            }
            if (innerHTML){
                el.innerHTML = innerHTML;
            }
            return el;
        }

        // Function to update the main content area (simulating a phase change)
        function switchToView(newContentElement) {
            const output = document.getElementById(MAIN_OUTPUT_ID);
            if (output) {
                output.innerHTML = '';
                output.appendChild(newContentElement);
            }
        }

        function renderQuestionGrid() {

    function handleClick(name) {

    /**
     * Renders all landmark markers and their bounding boxes.
     */
    function renderLandmarks() {
      const mapElement = document.getElementById('sf-map');
        if (!mapElement) return;

        // Clear all previous children
        mapElement.innerHTML = '';

        // Constants for background sizing
       

        for (const name in landmarkData) {
            const bbox = landmarkData[name];

            // Only render nodes that are visible on the map (Y < 800)
            const isRendered = bbox.Y < 800;

            if (isRendered) {

                // Read the 'hidden' property
                const isHidden = bbox.hidden || false;

            }
        }
        return mapElement;
    }


        function renderInventory() {
            // Main container with the classic dark palette background
            const inventoryContent = createElement('div', 'flex flex-col items-center h-full p-8 space-y-12 bg-[#1a1a2e]');

            // Stylized Header
            const title = createElement('h3', 'text-5xl font-black italic text-[#94a3b8] tracking-widest uppercase mb-4', 'INVENTORY');
            title.style.textShadow = '4px 4px 0px rgba(0,0,0,0.5)';
            inventoryContent.appendChild(title);

             const hint = createElement('div', 'text-[10px] text-indigo-400/80 font-mono tracking-[0.2em] uppercase animate-pulse mb-4 flex items-center');
            hint.innerHTML = `<span class="mr-2">▶</span> Select an icon for details <span class="ml-2">◀</span>`;
            inventoryContent.appendChild(hint);

            const createClassicGrid = (label, items, onClickAction) => {
                const wrapper = createElement('div', 'w-full max-w-2xl flex flex-col');
                
                // Category Label
                const labelEl = createElement('span', 'text-xs font-bold text-[#64748b] uppercase mb-3 px-1 tracking-[0.2em]', label);
                wrapper.appendChild(labelEl);

                // The Grid Container
                const gridContainer = createElement('div', 'grid grid-cols-4 md:grid-cols-6 gap-1 p-1 bg-[#0f172a] border-4 border-[#334155] shadow-[inset_0_4px_12px_rgba(0,0,0,0.8)]');

                // Render acquired items or empty slots
                if (items.length > 0) {
                    items.forEach(item => {
                        const slot = createElement('div', 'aspect-square flex items-center justify-center bg-[#334155] border-2 border-[#1e293b] shadow-[inset_2px_2px_0px_rgba(255,255,255,0.05),_inset_-2px_-2px_0px_rgba(0,0,0,0.3)] hover:bg-[#475569] active:translate-y-0.5 transition-all cursor-pointer group relative');
                        
                        slot.onclick = () => onClickAction(item);
                        
                        // Icon with classic drop shadow
                        slot.innerHTML = `
                            <div class="text-4xl filter drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)] transform group-hover:scale-110 transition-transform">
                                ${item.icon || (label.includes('TOPIC') ? '💬' : '📦')}
                            </div>
                            <!-- Decorative Corner Brackets -->
                            <div class="absolute top-0 left-0 w-1 h-1 border-t border-l border-white/10"></div>
                            <div class="absolute bottom-0 right-0 w-1 h-1 border-b border-r border-black/20"></div>
                        `;
                        gridContainer.appendChild(slot);
                    });

                    // Fill remaining space to make a full row of 4/6 (Optional aesthetic choice)
                    const remaining = items.length % 4 === 0 ? 0 : 4 - (items.length % 4);
                    for(let i = 0; i < remaining; i++) {
                        const empty = createElement('div', 'aspect-square bg-[#1e293b]/30 border-2 border-[#0f172a] shadow-inner opacity-20');
                        gridContainer.appendChild(empty);
                    }
                } else {
                    // Full empty state
                    for(let i = 0; i < 4; i++) {
                        const empty = createElement('div', 'aspect-square bg-[#1e293b]/30 border-2 border-[#0f172a] shadow-inner opacity-20');
                        gridContainer.appendChild(empty);
                    }
                }

                wrapper.appendChild(gridContainer);
                return wrapper;
            };

            return inventoryContent;
        }


        function playMovie(videoPath, cinematicText, returnPhase = game.phase, text) {

        /**
         * Renders the cinematic screen (Phase 99).

        function renderCinematic() {

            cinematicContent.innerHTML = `

                <div class="relative p-1 bg-gradient-to-b from-electric-cyan/40 to-slate-900 rounded-lg shadow-[0_0_50px_rgba(0,0,0,0.8)]">

                        <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-electric-cyan/50"></div>
                        <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-electric-cyan/50"></div>
                    </div>
                </div>

                <div class="mt-8 transform transition-all duration-500">
                    <div id="cinematic-panel" class="relative p-1 bg-gradient-to-r from-transparent via-magenta-500/40 to-transparent">
                        <div class="bg-slate-900/90 py-4 px-8 text-center border-x border-magenta-500/50">
                            <p class="text-xl md:text-2xl font-mono text-white leading-relaxed tracking-wide">
                                <span class="text-electric-cyan animate-pulse mr-2"></span>
                                ${cinematicText}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-10">
                <button onclick="exitCinematic();" 
                    class="group relative overflow-hidden bg-slate-900 border border-electric-cyan/50 px-12 py-3 rounded-full transition-all hover:border-electric-cyan">
                    <span class="relative z-10 title-font text-sm font-bold tracking-[0.3em] text-electric-cyan group-hover:text-white transition-colors">
                        CLOSE
                    </span>
                    <div class="absolute inset-0 bg-electric-cyan transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>

            const videoElement = cinematicContent.querySelector('#cinematic-video');
            if (videoElement) {
                videoElement.volume = 0.5;

            return cinematicContent;

    /**
     * Main render function: builds the entire UI based on game state.
     */
    window.renderGame = function() {
        

        // --- 1. Calculate Progression ---
        const progression = getLevelProgression();
        const chopMax = progression.currentChopMax; // Get dynamic max for chop bars

        // --- 2. Define chop colors ---
        const chopColorMap = {
            "Social Influence": { bg: 'bg-blue-500', text: 'text-blue-400' },
            "Backstage Blueprint": { bg: 'bg-yellow-500', text: 'text-yellow-400' },
            "Rhythm Mastery": { bg: 'bg-red-500', text: 'text-red-400' },
            "Instrument Synergy": { bg: 'bg-green-500', text: 'text-green-400' },
            "Lyrical Flow": { bg: 'bg-purple-500', text: 'text-purple-400' },
            "Stage Presence": { bg: 'bg-pink-500', text: 'text-pink-400' }
        };

          const chopsHtml = game.chops
                .filter(chop => chop.isUnlocked ) // Filter chops that are unlocked and have points
                .map(chop => { 
                    const chopName = chop.name;
                    const chopValue = chop.points;
                    const color = chopColorMap[chopName];

                    if (!color) {
                        console.error(`Missing color definition for chop: ${chopName}`);
                        return ''; // Skip rendering this chop
                    }

                    // Individual Chop Bar calculation uses the dynamic chopMax
                    const percentage = Math.min(100, Math.max(0, (chopValue / chopMax) * 100));
                    
                    return `
                        
                        <div class="mt-4 p-3 bg-gray-800 rounded-lg border-2 border-neon-pink/70 w-full text-center">
                            <div class="flex justify-between items-center text-xs font-mono text-gray-50">
                                <span class="${color.text} font-bold tracking-wide text-sm">${chop.icon} </span>
                                <span class="text-gray-100 text-sm">${chopValue} / ${chopMax} </span>
                            </div>
                            <div class="w-full bg-gray-300 rounded-full h-2 shadow-inner">
                                <div class="h-2 rounded-full transition-all duration-500 ${color.bg}" style="width: ${percentage}%;"></div>
                            </div>
                        </div>
                    `;
                }).join('');


        // Game Panels Structure
        let mainContent = `
            <div class="w-full max-w-5xl mx-auto metal-card min-h-[700px] flex flex-col">
                
                <div id="center-panel" class="w-full p-6 md:p-10 flex flex-col items-center flex-1">
                    
                    <h2 class="text-4xl font-extrabold text-white mb-6 text-center font-title w-full">
                        ${game.phase > 1 ? '' : (game.phase === 0 ? '' : '')}
                    </h2>
                    
                    <div class="p-4 mb-8 text-center rounded-sm font-semibold shadow-md text-electric-cyan  w-full max-w-2xl mx-auto">
                        ${game.message}
                    </div>

                    <div id="dynamic-content" class="w-full flex-1 flex flex-col items-center justify-center space-y-6">


                        </div>







                </div>
            </div>
        `;
        
        appContainer.innerHTML = mainContent;

        // Render phase-specific content
        const dynamicContent = document.getElementById('dynamic-content');
        dynamicContent.innerHTML = '';
        
        let contentElement;
        switch (game.phase) {
            case -1:
                contentElement = renderMainMenu();
                break;
            case 0:
                contentElement = renderPhase0();  //  Menu
                break;
          
            default:
                const topicContent = createElement('div', 'flex flex-col items-center justify-center h-full space-y-8 p-8', 'UNKNOWN GAME STATE');
                const backButton = createElement('button', 'metal-button px-6 py-2 text-lg mt-8 bg-gray-600 hover:bg-gray-700', 'MENU');
                backButton.onclick = () => setPhase(0, '');
                topicContent.appendChild(backButton);
                return topicContent;
        }
        dynamicContent.appendChild(contentElement);

        if (game.phase === 10){

            if (game.startGame) { 
                game.startGame = false;
            }
            else{
                const unreadCount = getUnreadNotificationCount();
                const badgeHtml = unreadCount > 0 
                ? `<span class="absolute -top-2 -right-2 bg-red-600 text-sm font-bold rounded-full h-8 w-8 flex items-center justify-center border-2 border-white">${unreadCount}</span>` 
                : '';

                
                dynamicContent.appendChild(iconRow);
                // Wait a moment to ensure the browser has fully rendered the SVG element
                renderLandmarks(); 
            }
        }
        
    }

    // Initialize the game when the window loads
    window.onload = initializeGame;
    window.setPhase = setPhase;
    window.updateState = updateState; // Expose updateState as well
  

    </script>
