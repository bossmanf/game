        mapElement.innerHTML = '';

        // Constants for background sizing
       

        for (const name in landmarkData) {

            // Only render nodes that are visible on the map (Y < 800)
            const isRendered = bbox.Y < 800;

            if (isRendered) {

                // Read the 'hidden' property
                const isHidden = bbox.hidden || false;

            }
        }
        return mapElement;
    }


        function renderInventory() {
            // Main container with the classic dark palette background
            const inventoryContent = createElement('div', 'flex flex-col items-center h-full p-8 space-y-12 bg-[#1a1a2e]');

            // Stylized Header
            const title = createElement('h3', 'text-5xl font-black italic text-[#94a3b8] tracking-widest uppercase mb-4', 'INVENTORY');

            hint.innerHTML = `<span class="mr-2">▶</span> Select an icon for details <span class="ml-2">◀</span>`;
            inventoryContent.appendChild(hint);

            const createClassicGrid = (label, items, onClickAction) => {
                const wrapper = createElement('div', 'w-full max-w-2xl flex flex-col');
                
                // Category Label
                const labelEl = createElement('span', 'text-xs font-bold text-[#64748b] uppercase mb-3 px-1 tracking-[0.2em]', label);
                wrapper.appendChild(labelEl);

                // The Grid Container
                const gridContainer = createElement('div', 'grid grid-cols-4 md:grid-cols-6 gap-1 p-1 bg-[#0f172a] border-4 border-[#334155] shadow-[inset_0_4px_12px_rgba(0,0,0,0.8)]');

                // Render acquired items or empty slots
                if (items.length > 0) {
                    items.forEach(item => {
                        const slot = createElement('div', 'aspect-square flex items-center justify-center bg-[#334155] border-2 border-[#1e293b] shadow-[inset_2px_2px_0px_rgba(255,255,255,0.05),_inset_-2px_-2px_0px_rgba(0,0,0,0.3)] hover:bg-[#475569] active:translate-y-0.5 transition-all cursor-pointer group relative');
                        
                        slot.onclick = () => onClickAction(item);
                        
                        // Icon with classic drop shadow
                        slot.innerHTML = `
                            <div class="text-4xl filter drop-shadow-[2px_2px_0px_rgba(0,0,0,0.5)] transform group-hover:scale-110 transition-transform">
                                ${item.icon || (label.includes('TOPIC') ? '💬' : '📦')}
                            </div>
                            <!-- Decorative Corner Brackets -->
                            <div class="absolute top-0 left-0 w-1 h-1 border-t border-l border-white/10"></div>
                            <div class="absolute bottom-0 right-0 w-1 h-1 border-b border-r border-black/20"></div>
                        `;
                        gridContainer.appendChild(slot);
                    });

                    // Fill remaining space to make a full row of 4/6 (Optional aesthetic choice)
                    const remaining = items.length % 4 === 0 ? 0 : 4 - (items.length % 4);
                    for(let i = 0; i < remaining; i++) {
                        const empty = createElement('div', 'aspect-square bg-[#1e293b]/30 border-2 border-[#0f172a] shadow-inner opacity-20');
                        gridContainer.appendChild(empty);
                    }
                } else {
                    // Full empty state
                    for(let i = 0; i < 4; i++) {
                        const empty = createElement('div', 'aspect-square bg-[#1e293b]/30 border-2 border-[#0f172a] shadow-inner opacity-20');
                        gridContainer.appendChild(empty);
                    }
                }

                wrapper.appendChild(gridContainer);
                return wrapper;
            };

            return inventoryContent;
        }

 function getIconRow() {


         
        const unreadCount = getUnreadNotificationCount();
        // Enlarged notification badge

        //navContainer.appendChild(hud);

        const createTab = (icon, label, phase, isActive = false, extraHtml = '') => {
            const activeClass = isActive 
                ? 'bg-zinc-800 border-t-4 border-cyan-400 text-white -translate-y-1' 
                : 'text-zinc-500 border-t-4 border-transparent hover:bg-zinc-900';
            
            // Increased width (w-20 to w-24) and padding
            const tab = createElement('div', `relative py-3 flex flex-col items-center w-20 sm:w-24 cursor-pointer transition-all duration-200 ${activeClass} rounded-t-lg`);
            tab.onclick = () => setPhase(phase, '');
            
            tab.innerHTML = `
                <span class="text-3xl mb-1">${icon}</span>
                <span class="text-[11px] font-black uppercase tracking-tight">${label}</span>
                ${extraHtml}
            `;
            return tab;
        };

        const currentPhase = game.phase;

        nav.appendChild(createTab('🗺️', 'MAP', 10, currentPhase === 10));
        nav.appendChild(createTab('📱', 'Inbox', 16, currentPhase === 16, badgeHtml));
        nav.appendChild(createTab('🎒', 'BAG', 14, currentPhase === 14));
        nav.appendChild(createTab('📝', 'To-Do', 1, currentPhase === 1));
        nav.appendChild(createTab('🎸', 'Career', 17, currentPhase === 17));
        nav.appendChild(createTab('⚙️', 'Config', 0, currentPhase === 0));

        navContainer.appendChild(nav);

        return navContainer;
    }


     function playMovie(videoPath, cinematicText, returnPhase = game.phase) {

   function renderGame() {
        // Clear the main container
        container.innerHTML = '';
        
        // 1. Create the main wrapper
        // We ensure it has relative positioning and min-h-screen or h-full logic
        const unifiedWrapper = createElement('div', 'w-full h-full flex flex-col max-w-2xl mx-auto relative');

        // 2. Create the Phase Container
        // Added 'mb-20' conditionally below if nav is present to prevent overlap
        const phaseContainer = createElement('div', 'flex-1 relative w-full bg-gray-900/30 rounded-2xl border border-white/10 p-2 overflow-y-auto flex flex-col');

        let contentElement;
        switch (game.phase) {
            case -1: contentElement = renderMainMenu(); break;
            case 0: contentElement = renderPhase0(); break; 
            case 1: contentElement = renderMissionScreen(); break;
            case 2: contentElement = renderPhase2(); break;
            case 3: contentElement = renderPhase3(); break;
            case 4: contentElement = renderAmoeba(); break;
            case 5: contentElement = renderLocation();break;
            case 7: contentElement = renderPhase7(); break;
            case 8: contentElement = renderPhase8(); break;
            case 9: contentElement = renderPhase9(); break;
            case 10: contentElement = renderMap(); break;
            case 11: contentElement = renderPhase11(); break;
            case 12: contentElement = renderPhase12(); break;
            case 13: contentElement = renderPhase13(); break;
            case 14: contentElement = renderInventory(); break;
            case 15: contentElement = renderItem(); break;
            case 16: contentElement = renderPhone(); break;
            case 17: contentElement = renderChops(); break;
            case 18: contentElement = renderPhase_setup(); break;
            case 19: contentElement = renderCliffs(); break;
            case 20: contentElement = renderPoker(); break;
            case 99: contentElement = renderCinematic(); break;
            case 100: contentElement = startCinematic(); break;
            default:
                contentElement = createElement('div', 'flex flex-col items-center justify-center p-8', 'SYSTEM ERROR: STATE UNKNOWN');
                const b = createElement('button', 'metal-button mt-4', 'REBOOT TO MENU');
                b.onclick = () => setPhase(0, '');
                contentElement.appendChild(b);
        }

        // Append the content to the phase container
        if (contentElement) {
            phaseContainer.appendChild(contentElement);
        }
        
        unifiedWrapper.appendChild(phaseContainer);

        // 3. Message Bar
        if (game.message) {
            const messageBar = document.createElement('div');
            messageBar.className = 'mt-2 py-1 px-3 text-xs text-center rounded bg-black/40 text-cyan-400 border border-cyan-900/30 shrink-0';
            messageBar.textContent = game.message;
            unifiedWrapper.appendChild(messageBar);
        }

        // 4. Navigation Bar (The Icon Row)
        const validPhases = [1, 4, 14, 15, 16, 17, 19, 5];
        if ((game.phase === 10) || validPhases.includes(game.phase)) {
            // Add padding to the wrapper so the fixed nav doesn't cover content
            // Alternatively, we add a spacer div at the end of the flex column
            const iconRow = getIconRow();
            unifiedWrapper.appendChild(iconRow);
            
            // Add a spacer to push content up above the fixed nav
            const spacer = createElement('div', 'h-20 w-full shrink-0');
            unifiedWrapper.appendChild(spacer);
        }

        container.appendChild(unifiedWrapper);

        // Handle Map-specific logic
        if (game.phase === 10) {
            if (game.startGame) {
                game.startGame = false;
            } else {
                // Ensure renderLandmarks is called after DOM is ready
                setTimeout(() => renderLandmarks(0), 0);
            }
        }
    }


    // Initialize the game when the window loads
    window.onload = () => {
            renderGame();
        };
