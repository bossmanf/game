<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habibi's Dream - Mission 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --electric-cyan: #00f2ff;
            --electric-blue: #0047ff;
        }

        body {
            background: #000 url('https://www.greatmusichall.com/wp-content/uploads/2020/07/venue_main_image-5.png?fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: #d1d5db;
            margin: 0;
            overflow: hidden;
        }

        .title-font { font-family: 'Orbitron', sans-serif; }

        /* The Metal Card Styling */
        .metal-card {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .metal-button {
            background: linear-gradient(145deg, #1f2937, #111827);
            border: 1px solid rgba(0, 242, 255, 0.3);
            color: var(--electric-cyan);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .metal-button:hover {
            border-color: var(--electric-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Cinematic Overlay: Forced black background and high z-index */
        #cinematicView {
            position: fixed;
            inset: 0;
            background: black;
            display: none; /* Controlled via JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        .video-box {
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-electric-cyan { color: var(--electric-cyan); }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen p-4 md:p-8 flex flex-col items-center">
        <div id="error-display" class="hidden fixed top-0 left-0 right-0 p-4 bg-red-800 text-white font-bold text-center z-50 shadow-2xl border-b-4 border-red-500">
            <p id="error-message">System Error Detected.</p>
        </div>
            
        <!-- The main game container will be where the dynamic rendering happens -->
        <div id="game-container" class="flex items-center">

                <div class="metal-card">

                    <div class="mx-auto w-11/12 md:w-2/3 mb-10 border-4 border-yellow-500 rounded-lg overflow-hidden shadow-xl">

                    <img 
                        id="main-image-display" 
                        src="https://media.gettyimages.com/id/1363411424/photo/smiling-young-man-playing-an-acoustic-guitar.jpg?s=2048x2048&w=gi&k=20&c=z8m_ZT1x5gFEstoTfBIulNKpBzp6D-XAbbfA7b7e2B8="
                        alt="Current Landmark View" 
                        class="w-full h-auto object-cover"
                        onerror="this.onerror=null;this.src='https://placehold.co/800x400/374151/FFFFFF?text=Image+Load+Error';"
                    />
                    </div>
                </div>
            </div>
     </div>

    <div id="cinematicView" class="hidden fixed inset-0 flex flex-col items-center justify-center p-4 opacity-0 cursor-pointer" onclick="displayNextSentence()">
        <div class="video-box">
            <video id="videoDisplay" muted playsinline></video>
        </div>
        <div class="mt-10 max-w-2xl text-center px-6">
            <p id="cinematicText" class="text-2xl md:text-3xl italic text-gray-100 font-light leading-relaxed"></p>
            <p id="debugInfo" class="text-[10px] text-red-500 font-mono mt-2"></p>
            <p class="mt-8 text-xs uppercase tracking-[0.3em] text-cyan-500 animate-pulse">
                Click anywhere to continue transmission
            </p>
        </div>
    </div>

    <script>
        // Game State
        const game = {
            phase: 0,
            message: 'System Initialized',
            score: 20000
        };

        // Script Data
        const cinematicScript = [
            { text: "The moon hung low, a fractured disc of pale light over the sleeping city.", url: "https://www.w3schools.com/html/mov_bbb.mp4" },
            { text: "Only the distant hum of the ventilation systems betrayed any sign of life.", url: "https://vjs.zencdn.net/v/oceans.mp4" },
            { text: "It was the Watcher, a figure of myth and chrome, observing from the heights.", url: "https://www.w3schools.com/html/movie.mp4" }
        ];

        let currentIndex = -1;

        // --- Navigation ---

        function setPhase(p, msg) {
            game.phase = p;
            game.message = msg;
            renderGame();
        }

        // --- Cinematic Logic ---

        function startCinematic() {
            // 1. Hide the game UI
            document.getElementById('app').style.display = 'none';
            // 2. Show the black cinematic screen
            const view = document.getElementById('cinematicView');
            view.style.display = 'flex';
            // 3. Trigger the first clip immediately (Satisfies browser autoplay rules)
            displayNextSentence();
        }

        function displayNextSentence() {
            currentIndex++;
            const video = document.getElementById('videoDisplay');
            const text = document.getElementById('cinematicText');
            const debug = document.getElementById('debugInfo');

            if (currentIndex < cinematicScript.length) {
                const scene = cinematicScript[currentIndex];
                
                // Set content
                text.innerText = scene.text;
                video.src = scene.url;
                
                // Force Reload and Play
                video.load();
                const playPromise = video.play();

                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        debug.innerText = "BROWSER BLOCKED AUTOPLAY: Click screen to resume.";
                        console.error(err);
                    });
                }
            } else {
                exitCinematic();
            }
        }

        function exitCinematic() {
            currentIndex = -1;
            document.getElementById('cinematicView').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            setPhase(0, "Mission 12 Transmission Complete.");
        }

        // --- Render UI ---

        function renderGame() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            // Header bar
            const header = document.createElement('div');
            header.className = "p-4 border-b border-cyan-900/50 bg-black/40 flex justify-between items-center";
            header.innerHTML = `
                <span class="text-xs font-mono tracking-widest text-cyan-500 uppercase">> ${game.message}</span>
                <span class="title-font text-yellow-500">$${game.score}</span>
            `;
            container.appendChild(header);

            const content = document.createElement('div');
            content.className = "p-12 flex flex-col items-center justify-center min-h-[400px]";

            if (game.phase === 12) {
                // MISSION 12 SCREEN
                content.innerHTML = `
                    <h1 class="text-5xl font-black title-font mb-4 text-white">MISSION 12</h1>
                    <p class="text-cyan-400 mb-10 tracking-widest uppercase text-sm">Target: The Silent Watcher</p>
                    <button onclick="startCinematic()" class="metal-button py-5 px-12 rounded-xl text-xl font-bold">
                        Initiate Transmission
                    </button>
                    <button onclick="setPhase(0, 'Returning to core...')" class="mt-6 text-gray-500 hover:text-white text-xs uppercase tracking-widest">
                        Back to Menu
                    </button>
                `;
            } else {
                // MAIN MENU
                content.innerHTML = `
                    <h1 class="text-4xl font-bold title-font mb-10 text-white italic">HABIBI'S DREAM</h1>
                    <div class="grid grid-cols-1 gap-4 w-full max-w-xs">
                        <button onclick="setPhase(12, 'Mission Selected')" class="metal-button py-4 px-6 rounded-lg text-left flex justify-between items-center">
                            <span>🎬 MISSION 12</span>
                            <span class="text-xs opacity-50">→</span>
                        </button>
                        <button class="metal-button py-4 px-6 rounded-lg text-left opacity-30 cursor-not-allowed">
                            <span>🔒 MISSION 13</span>
                        </button>
                    </div>
                `;
            }

            container.appendChild(content);
        }

        // Boot
        window.onload = renderGame;
    </script>
</body>
</html>
