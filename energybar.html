<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metallica Adventure HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --music-accent: #a855f7;
        }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'sans-serif';
        }
        .title-font { font-family: 'Chakra Petch', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Stripes animation for the stamina bar */
        .stamina-stripes {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }

        /* Smooth transitions for bars */
        .stat-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pixel-border {
            border: 2px solid #27272a;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <!-- --- TOP HUD: Attributes Bar --- -->
    <div class="max-w-4xl mx-auto mb-8 grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Physical: Energy Bar -->
        <div class="bg-zinc-900 pixel-border p-4 rounded-xl shadow-lg relative overflow-hidden">
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2 text-yellow-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>
                    <span class="text-xs font-black tracking-widest uppercase text-zinc-400">Roadie Stamina</span>
                </div>
                <span id="energy-text" class="text-sm mono-font font-bold text-yellow-400">85%</span>
            </div>
            <div class="w-full bg-zinc-950 h-4 rounded-full border border-zinc-700 overflow-hidden p-0.5">
                <div id="energy-bar" class="stat-bar h-full rounded-full bg-yellow-400 stamina-stripes" style="width: 85%;"></div>
            </div>
        </div>

        <!-- Emotional Attributes Indicators -->
        <div class="bg-zinc-900 pixel-border p-4 rounded-xl shadow-lg flex justify-around items-center">
            <!-- Confidence -->
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" id="conf-icon" class="w-6 h-6 mb-1 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                <span class="text-[10px] uppercase font-bold tracking-tighter text-zinc-500">Confidence</span>
                <div class="h-1 w-12 bg-zinc-800 mt-1 rounded-full overflow-hidden">
                    <div id="conf-bar" class="stat-bar h-full bg-purple-500" style="width: 30%;"></div>
                </div>
            </div>
            
            <div class="h-8 w-[1px] bg-zinc-800"></div>

            <!-- Empathy -->
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" id="emp-icon" class="w-6 h-6 mb-1 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <span class="text-[10px] uppercase font-bold tracking-tighter text-zinc-500">Empathy</span>
                <div class="h-1 w-12 bg-zinc-800 mt-1 rounded-full overflow-hidden">
                    <div id="emp-bar" class="stat-bar h-full bg-pink-500" style="width: 40%;"></div>
                </div>
            </div>

            <div class="h-8 w-[1px] bg-zinc-800"></div>

            <!-- Karma -->
            <div class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" id="karma-icon" class="w-6 h-6 mb-1 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-2 3.5h3L11 11h3l-2 3.5"/><path d="m13 18-2 3.5h3L11 22h3l-2 3.5"/><circle cx="12" cy="12" r="10"/></svg>
                <span class="text-[10px] uppercase font-bold tracking-tighter text-zinc-500">Karma</span>
                <div class="h-1 w-12 bg-zinc-800 mt-1 rounded-full overflow-hidden">
                    <div id="karma-bar" class="stat-bar h-full bg-blue-400" style="width: 50%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- --- MAIN GAME AREA --- -->
    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Action Sidebar -->
        <div class="lg:col-span-1 space-y-4">
            <div class="bg-zinc-900 p-4 rounded-xl pixel-border">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-black text-xs tracking-widest text-zinc-500 uppercase italic">Active Phase</h2>
                    <div class="flex items-center gap-1 text-xs mono-font text-zinc-400 bg-zinc-950 px-2 py-1 rounded border border-zinc-800">
                        <span id="game-time">10:00 AM</span>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <button onclick="handleAction(15, 0, 0, 10, 'You spent time with Kevin. His stories are weirdly calming.')" 
                        class="w-full bg-zinc-800 hover:bg-zinc-700 p-3 rounded text-left text-xs font-bold transition-all border-l-4 border-pink-500">
                        ☕ PEETS: Listen to Kevin
                    </button>
                    <button onclick="handleAction(5, -15, 5, -5, 'You swiped a rare pick from the store. You feel like a rebel.')" 
                        class="w-full bg-zinc-800 hover:bg-zinc-700 p-3 rounded text-left text-xs font-bold transition-all border-l-4 border-red-500">
                        🤘 POP-UP: Steal Asset
                    </button>
                    <button onclick="handleAction(20, 5, 15, 0, 'You didn\'t let the Bouncer intimidate you. Cred +1.')" 
                        class="w-full bg-zinc-800 hover:bg-zinc-700 p-3 rounded text-left text-xs font-bold transition-all border-l-4 border-purple-500">
                        🏟️ FILLMORE: Talk Back
                    </button>
                    <button onclick="handleRest()" 
                        class="w-full bg-zinc-800 hover:bg-zinc-700 p-3 rounded text-left text-xs font-bold transition-all border-l-4 border-green-500">
                        🏠 MAMA'S: Home Cooked Meal
                    </button>
                </div>
            </div>
        </div>

        <!-- Map Display -->
        <div class="lg:col-span-2 space-y-4">
            <div class="aspect-[5/4] bg-zinc-800 rounded-xl pixel-border shadow-inner relative overflow-hidden group">
                <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-all duration-700"></div>
                <!-- Background Image (SF Map stylized) -->
                <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?q=80&w=1000&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover">
                
                <div class="absolute bottom-4 left-4 right-4 bg-zinc-950/90 backdrop-blur-md p-4 rounded border border-zinc-800">
                    <p class="text-xs mono-font text-zinc-400 uppercase tracking-widest mb-1">System Message:</p>
                    <p id="message-log" class="text-sm font-bold leading-tight">Welcome back to San Francisco. Watch your energy!</p>
                </div>
            </div>

            <!-- Footer Navigation -->
            <div class="flex justify-between items-center bg-zinc-900 p-4 rounded-xl pixel-border">
                <button class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
                    <div class="p-3 bg-zinc-800 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 24c.715-3.33 2.59-6.33 5.44-8.19.81-.53 1.56-1.15 2.24-1.85.9-.93 1.54-2.1 1.89-3.39.35-1.3.38-2.67.07-3.99a8.55 8.55 0 0 0-4.64-6.19c-1.25-.56-2.6-.82-3.96-.78s-2.68.32-3.89.94a8.62 8.62 0 0 0-4.62 6.16 8.56 8.56 0 0 0 1.93 7.33c.7.72 1.47 1.34 2.3 1.86 2.87 1.81 4.76 4.8 5.46 8.11h.33z"/></svg></div>
                    <span class="text-[10px] font-black uppercase tracking-tighter">Map</span>
                </button>
                <button class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
                    <div class="p-3 bg-zinc-800 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg></div>
                    <span class="text-[10px] font-black uppercase tracking-tighter">Phone</span>
                </button>
                <button class="flex flex-col items-center gap-1 opacity-50 hover:opacity-100 transition-opacity">
                    <div class="p-3 bg-zinc-800 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                    <span class="text-[10px] font-black uppercase tracking-tighter">Status</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Game State Variables ---
        let energy = 85;
        let karma = 50;
        let confidence = 30;
        let empathy = 40;

        // --- DOM Elements ---
        const energyBar = document.getElementById('energy-bar');
        const energyText = document.getElementById('energy-text');
        const confBar = document.getElementById('conf-bar');
        const empBar = document.getElementById('emp-bar');
        const karmaBar = document.getElementById('karma-bar');
        const messageLog = document.getElementById('message-log');
        
        // Icons for color changing
        const confIcon = document.getElementById('conf-icon');
        const empIcon = document.getElementById('emp-icon');
        const karmaIcon = document.getElementById('karma-icon');

        // --- Core Functions ---
        function updateUI() {
            // Update Energy
            energyBar.style.width = `${energy}%`;
            energyText.innerText = `${energy}%`;
            
            if (energy < 20) {
                energyBar.classList.add('animate-pulse');
                energyBar.classList.replace('bg-yellow-400', 'bg-red-500');
            } else {
                energyBar.classList.remove('animate-pulse');
                energyBar.classList.replace('bg-red-500', 'bg-yellow-400');
            }

            // Update Emotional Stats
            confBar.style.width = `${confidence}%`;
            empBar.style.width = `${empathy}%`;
            karmaBar.style.width = `${karma}%`;

            // Update Icons Colors based on thresholds
            confIcon.style.color = confidence > 50 ? '#a855f7' : '#52525b';
            empIcon.style.color = empathy > 50 ? '#f472b6' : '#52525b';
            
            if (karma > 70) karmaIcon.style.color = '#4ade80';
            else if (karma < 30) karmaIcon.style.color = '#f87171';
            else karmaIcon.style.color = '#60a5fa';
        }

        function handleAction(cost, karmaGain, confGain, empGain, description) {
            if (energy - cost < 0) {
                messageLog.innerText = "You're too wiped out! Go see Mama or grab a coffee.";
                messageLog.classList.add('text-red-400');
                setTimeout(() => messageLog.classList.remove('text-red-400'), 1000);
                return;
            }

            energy = Math.max(0, Math.min(100, energy - cost));
            karma = Math.max(0, Math.min(100, karma + karmaGain));
            confidence = Math.max(0, Math.min(100, confidence + confGain));
            empathy = Math.max(0, Math.min(100, empathy + empGain));

            messageLog.innerText = description;
            updateUI();
        }

        function handleRest() {
            energy = 100;
            empathy = Math.min(100, empathy + 5);
            messageLog.innerText = "Mama's cooking restored your spirits and your stamina.";
            updateUI();
        }

        // Initialize
        updateUI();
    </script>
</body>
</html>
