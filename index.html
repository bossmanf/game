<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎶</text></svg>">

    <title>Change this title!</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <script src="https://unpkg.com/@tonejs/midi@2.0.2/build/Midi.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <!-- Load aggressive/angular fonts: Orbitron for titles, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'electric-cyan': '#00FFFF', // Custom color for highlights
                        'neon-pink': '#FF00FF',     // Custom color for titles
                        'electric-blue': '#1e90ff', // Another vibrant blue
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Orbitron', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Define the Speed Metal Aesthetic */
        :root {
            --metal-black: #111827; /* Tailwind gray-900 */
            --metal-gray: #374151;  /* Tailwind gray-700 */
            --electric-cyan: #00ffff;
            --electric-blue: #3b82f6;
            --dark-bg: #1a1a2e;
            --neon-blue: #00fff9;
            --neon-cyan: #00b4d8;
            --light-text: #e6e6fa;
            --neon-gold: #ffdd00; /* Bright, vibrant gold-orange for Location */
            --light-text: #e6e6fa;
        }

        body {
            /* Using a safer background property for better compatibility */
            background-image: url('https://www.greatmusichall.com/wp-content/uploads/2020/07/venue_main_image-5.png?fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center center;
            font-family: 'Inter', sans-serif;
            color: #d1d5db;
            font-family: 'Chakra Petch', sans-serif;
            color: #F7FAFC;
        }

        .title-font {
            font-family: 'Orbitron', sans-serif;
        }
        .text-electric-cyan { color: var(--electric-cyan); }
        .bg-electric-blue\/20 { background-color: rgba(0, 128, 255, 0.2); }
        .border-electric-blue { border-color: #0080ff; }
        .text-neon-pink { color: var(--neon-pink); }
        .border-electric-cyan { border-color: var(--electric-cyan); }

        .container {
            border: 3px solid var(--music-accent);
            border-radius: 1rem;
            box-shadow: 0 0 30px rgba(229, 62, 62, 0.7);
            max-width: 1100px;
            overflow: hidden;
        }

        /* Map Host Setup */
        #map-host {
            position: relative;
            width: 100%;
            /* ViewBox is 1000x800 for better vertical space matching the stylized map */
            padding-bottom: 80%; 
            background-image: url('./sf.jpg');
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        .sf-map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; 
        }

        /* Landmark Node Group (Invisible clickable box) */
        .landmark-group {
            cursor: pointer;
            transition: filter 0.2s;
        }
        .landmark-group:hover {
            /* Static Glow effect instead of scale */
            filter: drop-shadow(0 0 8px var(--music-accent));
        }

        /* Landmark Marker Styling (The visible emoji/text) */
        .landmark-emoji {
            text-shadow: 0 0 13px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }
        
        .landmark-name {
            fill:  #111111; /*#FFFFFF; */
            font-size: 15px; /* 10px Small font size as requested */
            font-weight: 600;
            text-shadow: 100 100 3px #000000; 
            pointer-events: none; /* Allows click-through to the group/rect */
        }

        /* Music Panel Styling */
        .music-panel {
             background-color: var(--panel-bg);
             border-top: 4px dashed var(--music-accent);
             font-family: 'VT323', monospace; /* Retro terminal font */
             color: #A0EEFF;
             box-shadow: inset 0 0 10px rgba(229, 62, 62, 0.5);
        }
        .music-panel .title {
            color: var(--music-accent);
            text-shadow: 0 0 5px var(--music-accent);
        }


        .title-font {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px var(--electric-cyan), 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 0.1em;
        }

        .metal-button {
            background: linear-gradient(145deg, #374151, #1f2937);
            border: 2px solid var(--electric-cyan);
            color: var(--electric-cyan);
            border-radius: 8px;
            box-shadow: 0 4px #0080ff, 0 8px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
        }
        .metal-button:hover {
            background: linear-gradient(145deg, #4b5563, #374151);
            color: white;
            box-shadow: 0 2px #0080ff, 0 4px 10px rgba(0, 0, 0, 0.7);
        }
        .metal-card {
            background-color: rgba(17, 24, 39, 0.9); /* Gray-900 with opacity */
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 255, 255, 0.1);
            overflow: hidden;
        }
        
        .disabled-button {
            background-color: #4b5563 !important;
            color: #d1d5db !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .panel-border {
            border-left: 3px solid var(--electric-cyan);
            border-right: 3px solid var(--electric-cyan);
        }

        /* SVG Icon for angular, fast look */
        .speed-icon {
            filter: drop-shadow(0 0 4px var(--electric-cyan));
        }


        .game-header {
            border-bottom: 1px solid #3d3d3d;
        }

       .wordle-grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 8px;
            padding: 16px;
            max-width: 350px;
            width: 90%;
            margin: 0 auto;
        }
        .wordle-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 8px;
        }
        .wordle-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            color: #f3f4f6;
            border: 3px solid #374151;
            border-radius: 6px;
            text-transform: uppercase;
            transition: background-color 0.5s ease, transform 0.1s ease;
        }

        /* Box Colors */
        .box-empty { border-color: #374151; }
        .box-current { border-color: #6b7280; }
        .box-absent { background-color: #3a3a3c; border-color: #3a3a3c; } /* Gray 900 */
        .box-present { background-color: #b59f3b; border-color: #b59f3b; } /* Yellow 700 */
        .box-correct { background-color: #538d4e; border-color: #538d4e; } /* Green 700 */

        /* Keyboard */
        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }
        .key-button {
            background-color: #6b7280;
            color: white;
            font-weight: 700;
            border-radius: 4px;
            margin: 2px;
            cursor: pointer;
            user-select: none;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.1s ease;
            min-width: 30px;
            flex-grow: 1;
            padding: 0 8px;
            text-transform: uppercase;
            font-size: 14px;
        }
        .key-button:active {
            transform: scale(0.95);
        }
        .key-absent { background-color: #3a3a3c !important; }
        .key-present { background-color: #b59f3b !important; }
        .key-correct { background-color: #538d4e !important; }

        /* Neon Button Style */
        .neon-button {
            background-color: #00ffff;
            color: #000000;
            transition: all 0.3s;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            font-weight: 700;
        }
        .neon-button:hover {
            background-color: #00e5e5;
            box-shadow: 0 0 15px #00e5e5, 0 0 30px #00e5e5;
            transform: translateY(-2px);
        }
        
        /* Visualizer Pulse (for Phase 8) */
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
            50% { box-shadow: 0 0 20px #00ffff, 0 0 30px #00ffff; }
            100% { box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff; }
        }
        .music-pulse {
            animation: pulse 1s infinite alternate;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .record-spin {
            animation: spin 3s linear infinite;
        }

        /* ROCK AESTHETIC - Phase 4 */
        .rock-card {
            background: linear-gradient(145deg, #1f1f1f 10%, #000000 90%);
            border: 5px solid #cc0000;
            border-radius: 10px;
            box-shadow: 0 0 25px #cc0000, inset 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .rock-title {
            color: #ff0000;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #ff0000;
            font-size: 3rem;
            line-height: 1;
        }
        .item-card {
            background-color: rgba(50, 50, 50, 0.7);
            border: 2px dashed #999;
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: scale(1.05);
            border-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* PUNK AESTHETIC - Phase 5 */
        .punk-bg {
            background: repeating-linear-gradient(-45deg, #222, #222 5px, #000 5px, #000 10px);
            border: 4px dashed #99ff00;
            box-shadow: 0 0 20px #99ff00;
        }
        .punk-text {
            font-family: monospace;
            color: #ff00ff;
            text-shadow: 2px 2px #000;
            text-transform: uppercase;
        }
        .punk-button {
            background-color: #ff00ff;
            color: black;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
        }
        .punk-button:hover {
            background-color: #99ff00;
            box-shadow: 2px 2px 0 #000;
            transform: translate(2px, 2px);
        }


         /* Family Feud Board Styles */
        .answer-slot {
            height: 4.5rem; /* Taller slots */
            background: linear-gradient(145deg, #374151, #1f2937);
            border: 3px solid #6b7280;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease-in-out;
            cursor: default;
        }

        .revealed {
            background: linear-gradient(145deg, #fcd34d, #b45309);
            border-color: #f59e0b;
            color: #1f2937;
            box-shadow: 0 0 20px #f59e0b;
        }

        .strike-slot {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background-color: #1f2937;
            border: 2px solid #4b5563;
        }
        .strike-hit {
            background-color: #dc2626;
            border-color: #f87171;
            box-shadow: 0 0 15px #dc2626;
            animation: strike-anim 0.5s ease-in-out;
        }

        @keyframes strike-anim {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* --- SUCCESS ANIMATION STYLES --- */
        @keyframes rockShake {
            0% { transform: scale(1.5) rotate(0deg); }
            10% { transform: scale(1.7) rotate(10deg); }
            20% { transform: scale(1.7) rotate(-10deg); }
            30% { transform: scale(1.8) rotate(10deg); }
            40% { transform: scale(1.8) rotate(-10deg); }
            50% { transform: scale(1.9) rotate(10deg); }
            60% { transform: scale(1.9) rotate(-10deg); }
            100% { transform: scale(2.0) rotate(0deg); }
        }

        .rock-animation {
            /* Keep applying the shaking keyframes */
            animation: rockShake 0.1s linear infinite; 
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }
        /* Cinematic View specific styling */
        #cinematicView {
            z-index: 100; /* Ensure it is on top of everything */
            transition: opacity 500ms ease-out;
            background-color: rgba(0, 0, 0, 0.95);
        }
        
        #cinematicText {
            transition: color 500ms;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        #textBox {
            backdrop-filter: blur(5px);
            background-color: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fan-panel-glow {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 0 20px rgba(255, 100, 100, 0.5); /* Neon red/fuchsia glow */
        }
        
        .speed-icon {
            filter: drop-shadow(0 0 3px currentColor);
        }

        @keyframes cloudPulse { 
            0%, 100% {
                transform: scale(1.1);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03); /* Softer base shadow */
            }
            50% {
                transform: scale(1.2); 
                box-shadow: 0 5px 12px rgba(0, 0, 0, 0.06); /* Even smaller shadow peak */
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8); /* Reduced scale change */
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); /* Much softer shadow */
            }
            100% {
                transform: scale(1.2); /* Reduced scale change */
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7); /* Reduced shadow peak */
            }
        }
        /* Custom style for the dreamy, cloud-shaped memory box */
        .dreamy-cloud {
            position: relative;
            /* Using the original complex cloud shape */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            overflow: visible; /* Allow puffs to extend outside the main box */
            animation: cloudPulse 1.5s infinite alternate; /* Soft, dreamy pulsing effect */
            transition: all 0.3s;
            border: 4px solid; /* Border to use the memory color */
            padding: 50px 70px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transform: scale(0.98);
        }
        .dreamy-puff, 
        .dreamy-cloud::before,
        .dreamy-cloud::after {
            position: absolute;
            background: inherit;
            border-radius: 50%;
            animation: cloudPulse 4s infinite ease-in-out;
            transition: all 0.3s;
            opacity: 100;
            filter: brightness(1.05); /* Slightly less bright than before */
            z-index: -1;
        }

        .dreamy-cloud::before {
            width: 80px;
            height: 80px;
            top: -15px;
            left: 10%;
            filter: brightness(1.05);
        }

        .dreamy-cloud::after {
            width: 100px;
            height: 100px;
            bottom: -25px;
            filter: brightness(1.1); 
            right: 15%;
        }
        /* Puff 1 (::before - Top-Left-Center) */
        .dreamy-cloud::before {
            width: 80px;
            height: 80px;
            top: -15px;
            left: 10%;
            filter: brightness(1.05);
        }

        /* Puff 2 (::after - Bottom-Right-Center) */
        .dreamy-cloud::after {
            width: 100px;
            height: 100px;
            bottom: -25px;
            right: 15%;
            filter: brightness(1.1);
        }

        /* Puff 3 (Explicit HTML element - Far Top-Left Corner) */
        .dreamy-cloud .puff-1 { 
            width: 65px;
            height: 65px;
            top: 20px;
            left: 2px;
            filter: brightness(1.15); 
        }

        /* Puff 4 (Explicit HTML element - Far Bottom-Right Corner) */
        .dreamy-cloud .puff-2 { 
            width: 90px;
            height: 90px;
            bottom: 10px;
            right: -30px;
            filter: brightness(1.1); 
        }
        
        /* Puff 5 (NEW Explicit HTML element - Top-Right Corner) */
        .dreamy-cloud .puff-3 { 
            width: 75px;
            height: 75px;
            top: 5px;
            right: 0px;
            filter: brightness(1.1); 
        }
        .inner-content {
            background-color: rgba(255, 255, 255, 0.01); /* Very subtle overlay */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Modal specific styling */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .memory-ball {
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-in-out;
        }
        .memory-ball:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .memory-ball.used {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .memory-ball-count {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.75rem;
            line-height: 1;
            padding: 2px 5px;
            border-radius: 9999px;
            background-color: #f59e0b; /* Amber */
            color: #1f2937; /* Dark text */
            font-weight: bold;
        }
         /* Item Rotation Animation */
        @keyframes slowRotate {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .rotating-item {
            animation: slowRotate 15s linear infinite;
        }
         /* iPhone Specific Styles */
        .iphone-frame {
            position: relative;
            width: 300px; /* Fixed width for phone effect */
            height: 600px; /* Fixed height for phone effect */
            background: #000;
            border-radius: 40px;
            padding: 10px;
            box-shadow: 0 0 0 2px #333, 0 0 0 5px #111, inset 0 0 10px rgba(0,0,0,0.8);
            margin: 0 auto;
            overflow: hidden;
            cursor: pointer; /* Allows clicking outside the screen to exit */
        }
        
        .iphone-screen {
            width: 100%;
            height: 100%;
            border-radius: 30px;
            /* Punk/Heavy Music Aesthetic Background */
            background: url('./background/guitarbackground.png') no-repeat center center;
            background-size: cover;
            border: 3px solid #222;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        
        .iphone-notch {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: #000;
            border-radius: 0 0 15px 15px;
            z-index: 10;
        }

        .notification-card {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        
        .unread {
            border-left: 5px solid var(--neon-pink);
            background-color: rgba(150, 0, 150, 0.3); /* Darker pink for unread */
        }
        
        .notification-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .message-modal-background {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 15px var(--neon-cyan); }
            50% { box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 30px var(--neon-blue); }
        }

        @keyframes neonPulseBlue {
            0%, 100% { box-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 15px var(--neon-cyan); }
            50% { box-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 30px var(--neon-blue); }
        }

        @keyframes neonPulseGold {
            0%, 100% { box-shadow: 0 0 5px var(--neon-gold), 0 0 10px var(--neon-gold), 0 0 15px var(--neon-gold); }
            50% { box-shadow: 0 0 10px #ffea70, 0 0 20px #ffea70, 0 0 30px #ffea70; }
        }

        @keyframes acquiredEntrance {
            0% { transform: scale(0.5) rotateX(45deg); opacity: 0; filter: blur(10px); }
            80% { transform: scale(1.05) rotateX(0deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(1) rotateX(0deg); opacity: 1; }
        }

        .acquisition-card {
            position: relative;
            background: linear-gradient(135deg, #2c3e50, #1c2833); /* Dark metallic gradient */
            color: var(--light-text);
            border-radius: 12px;
            padding: 45px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--neon-blue); /* Solid neon border */
            cursor: pointer;
            transition: transform 0.2s ease-out;

            /* Initial state for animation */
            opacity: 0;
            transform-style: preserve-3d;
            
            /* Apply animations */
            animation: acquiredEntrance 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, /* Dramatic entrance */
                       neonPulse 1.5s ease-in-out infinite alternate 0.6s; /* Pulse after entrance */
        }

        .acquisition-card:hover {
            transform: scale(1.03);
            border-color: var(--neon-blue);
        }

        /* The Speech Bubble / Card Tail (Sharp) */
        .acquisition-card::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg); /* Diamond/sharp pointer */
            width: 30px;
            height: 30px;
            background-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            z-index: 9;
            border-radius: 4px;
        }

        /* High-impact header */
        .acquisition-header {
            font-size: 2.25rem; /* text-4xl equivalent */
            font-weight: 900; /* Extra bold */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px rgba(0, 255, 255, 0.5); /* Neon text glow */
            color: var(--neon-blue);
            margin-bottom: 20px;
            background: -webkit-linear-gradient(45deg, var(--neon-blue), var(--light-text));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* The Topic Container - Inner Display */
        .topic-display {
            padding: 25px;
            margin-top: 15px;

        .location-house-card::before {
            content: "";

            content: "";

            left: 50%;

        // Helper function to update the status bar for custom actions
        function updateStatusBar(actionType, itemName, handlerName, customResponse) {
            const statusBar = document.getElementById('status-bar-output');
            if (!statusBar) return;
            
            // Construct the dedicated status message (using the updated aesthetic)
            const message = `
                <!-- Action Type Header -->
                <p class="text-sm font-semibold uppercase text-red-400">
                    // TRIGGERED ${actionType}: ${handlerName.toUpperCase()}
                </p>
                <!-- Object Name -->
                <p class="text-white text-xl font-bold mt-1 mb-3">
                    <span class="text-3xl">⚙️</span> ${itemName.toUpperCase()}
                </p>
                
                <!-- Character Response Header -->
                <p class="text-sm font-bold italic text-yellow-500 border-t border-gray-700 pt-2">
                    [ ${game.names.bestie} | ACTION RESULT... ]
                </p>
                
                <!-- Custom/Generic Response -->
                <p class="mt-2 p-3 bg-gray-700/50 rounded-md text-base text-gray-200 border border-electric-cyan/50 shadow-md">
                    "${customResponse}"
                </p>
            `;

            statusBar.innerHTML = message;
            // Add a brief animation to highlight the update
            statusBar.classList.add('border-electric-cyan', 'animate-pulse-quick');
            setTimeout(() => {
                statusBar.classList.remove('animate-pulse-quick');
                statusBar.classList.remove('border-electric-cyan');
            }, 1500);
        }

            // Trigger the musical transformation

        }
        }

        function handleRaffleEntry() {
            // Find the specific conversation topic
            game.currentLocationId = 'Metallica Pop-up Store';
            const newTopic = game.conversation_topics.unlocked.find(i => i.name === 'Metallica tour');
            const statusBar = document.getElementById('status-bar-output');

            if (!newTopic) {
                if (statusBar) {
                     statusBar.innerHTML = `
                        <p class="text-lg font-bold text-yellow-400">⚠️ Topic Not Found</p>
                        <p class="text-sm italic mt-1">The Metallica tour topic is not available to enter the raffle.</p>
                    `;
                }
                return;
            }

            // 1. Check if already entered
            if (newTopic.ruffle === true) {
                if (statusBar) {
                    statusBar.innerHTML = `
                        <p class="text-lg font-bold text-blue-400">ℹ️ Already Entered</p>
                        <p class="text-sm italic mt-1">You have already entered the Metallica raffle. Score: $${game.score}</p>
                    `;
                }
                return; // Stop execution if already entered
            }

            // 2. Check for sufficient score (only runs if not already entered)
            if (game.score < 5) {
                if (statusBar) {
                    statusBar.innerHTML = `
                        <p class="text-lg font-bold text-red-400">🛑 Cannot Enter!</p>
                        <p class="text-sm italic mt-1">You need $5 to enter the raffle. Current Score: $${game.score}</p>
                    `;
                }
                return;
            }

            // 3. Successful entry (only runs if topic exists, not already entered, and score is sufficient)
            newTopic.ruffle = true;
            game.score = game.score - 5;
            iphoneNotifications = appendNotification(iphoneNotifications,'Bridget', 'Hey! I can totally use your help at the Hardly Strictly Bluegrass Festival at the Golden Gate Park right now!', '💬', 'HSB Festival')


            // Update the status bar to confirm the action was successful
            if (statusBar) {
                statusBar.innerHTML = `
                    <p class="text-lg font-bold text-green-400">✅ Entry Confirmed!</p>
                    <p class="text-sm italic mt-1">You are now entered into the Metallica raffle. Score: $${game.score}</p>
                `;
            }
        }

        function askForDetails(name, type) {
            // Find item/topic data to construct the message
            const isItem = type === 'item';
            let item;

            console.log(game.currentLocationId, game.currentBuildingName, game.currentCharacter);
            const currentLocationId = game.currentLocationId;

            if (isItem) {
                item = game.inventory_items.find(i => i.name === name);
            } else {
                // Find topic (must handle topics that are strings vs. structured objects)
                const topicObj = game.conversation_topics.unlocked.find(t => 
                    (typeof t === 'string' && t === name) || (typeof t === 'object' && t.name === name)
                );

                if (typeof topicObj === 'object') {
                    // It's a structured topic object
                    item = topicObj;
                } else {
                    // It's a simple string topic, create a placeholder object
                    item = { 
                        name: name, 
                        icon: '💬', 
                        desc: 'A major conversation topic.',
                        actions: {} // Default to empty actions for generic response
                    };
                }
            }

            if (!item) {
                console.error(`Error: Could not find item/topic named ${name}.`);
                return;
            }
            const actionName = item.actions ? item.actions[currentLocationId] : null;

            console.log('Action name info:', actionName, customActions[actionName]);

            if (actionName ) {
                const output = document.getElementById(MAIN_OUTPUT_ID);
                const actionFunc = actionRegistry[currentContext.data.actionKey];
            
                if (output && actionFunc) {
                    output.innerHTML = actionFunc(currentContext.name, currentContext.data);
                    customActions[actionName](name);
                    return; 
                }
            }
            
            let itemResponse = item.messages ? item.messages[currentLocationId] : null;

            if (!itemResponse) {
                itemResponse = getRandomItemResponse();
                //"I have cross-referenced the "+ name +"data point. It seems vital to Project Aether. I'm detecting a faint energy signature tied to it. Further analysis required, Conductor."
            }
            

            // --- 1. Construct the dedicated status message ---
            const icon = item.icon || (isItem ? '❓' : '🗣️');
            const source = isItem ? 'Inventory Item' : 'Conversation Topic';
             const message = `
                <!-- 1st line: Asking about something -->
                <p class="text-sm font-semibold uppercase text-cyan-400">
                  ASKING ${game.currentCharacter} ABOUT...
                </p>
                <!-- 2nd line: The object being asked for -->
                <p class="text-white text-xl font-bold mt-1 mb-3">
                    <span class="text-3xl">${icon}</span> ${name.toUpperCase()}
                </p>
                
                <!-- 3rd line: Character is responding header -->
                <p class="text-sm font-bold italic text-yellow-500 border-t border-gray-700 pt-2">
                     ${game.currentCharacter} SAYS...
                </p>
                
                <!-- 4th line: The character's appealing response -->
                <p class="mt-2 p-3 bg-gray-700/50 rounded-md text-base text-gray-200 border border-electric-cyan/50 shadow-md">
                    ${itemResponse}
                </p>
            `;

            // --- 2. Re-render the main building view ---
            // This is the core logic: render the previous phase HTML again.
            const output = document.getElementById(MAIN_OUTPUT_ID);
            const actionFunc = actionRegistry[currentContext.data.actionKey];

            if (output && actionFunc) {
                // Re-render the location view using the saved context
                output.innerHTML = actionFunc(currentContext.name, currentContext.data);
            } else {
                console.error('Could not find action function to re-render location view.');
            }
            
            // --- 3. Find the new status bar and update it ---
            const statusBar = document.getElementById('status-bar-output');
            if (statusBar) {
                statusBar.innerHTML = message;
                // Add a brief animation to highlight the update
                statusBar.classList.add('border-electric-cyan', 'animate-pulse-quick');
                setTimeout(() => {
                    statusBar.classList.remove('animate-pulse-quick');
                    statusBar.classList.remove('border-electric-cyan');
                }, 1500);
            } else {
                console.error('Status bar element not found after re-render. Check actionRegistry.building ID.');
            }
        }

        function renderQuestionGrid() {
            const content = createElement('div', 'flex flex-col items-center p-4 h-full bg-gray-900 rounded-lg shadow-2xl');
           // const heading = createElement('h3', 'text-3xl font-extrabold title-font electric-cyan mb-6 border-b border-gray-700 pb-2', 'SELECT QUERY TARGET');
           // content.appendChild(heading);

            // 1. Prepare Data
            const inventoryData = game.inventory_items.filter(item => item.acquired).map(item => ({
                name: item.name,
                icon: item.icon,
                type: 'item'
            }));

            const topicData = game.conversation_topics.unlocked.filter(item => item.acquired).map(topic => ({
                name: topic.name,
                icon: topic.icon ,
                type: 'topic'
            }));

            const allData = [...topicData, ...inventoryData ];
            
            if (allData.length === 0) {
                content.innerHTML += '<p class="text-xl text-gray-500 mt-12">No items or topics available to query.</p>';
                return content;
            }

            // 2. Render Grid
            const gridContainer = createElement('div', 'flex flex-col space-y-8 w-full max-w-4xl p-4');

            // --- Inventory Items Section ---
            const inventoryGrid = createElement('div', 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 p-4 bg-gray-800/50 rounded-xl border border-yellow-700/50');
            inventoryGrid.innerHTML = '<h4 class="col-span-full text-xl font-bold text-yellow-400 mb-2 border-b border-yellow-800 pb-1">INVENTORY ITEMS</h4>';

            inventoryData.forEach(data => {
                const cardClass = 'metal-button p-3 flex flex-col items-center justify-center text-center cursor-pointer hover:scale-[1.03] transition-transform shadow-lg border-yellow-600/50 min-h-[90px]';
                const card = createElement('div', cardClass, 
                    `<span class="text-4xl mb-1">${data.icon}</span>
                     <span class="text-xs font-semibold uppercase text-electric-cyan">${data.name}</span>`
                );

                card.onclick = () => askForDetails(data.name, data.type);
                inventoryGrid.appendChild(card);
            });
            

            // --- Conversation Topics Section ---
            const topicGrid = createElement('div', 'grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 p-4 bg-gray-800/50 rounded-xl border border-teal-700/50');
            topicGrid.innerHTML = '<h4 class="col-span-full text-xl font-bold text-teal-400 mb-2 mt-4 border-b border-teal-800 pb-1">CONVERSATION TOPICS</h4>';

            topicData.forEach(data => {
                const cardClass = 'topic-bubble p-3 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-700/80 transition-all border border-teal-600/50 rounded-lg bg-gray-800 shadow-lg min-h-[90px]';
                const card = createElement('div', cardClass, 
                    `<span class="text-4xl mb-1">${data.icon}</span>
                     <span class="text-xs font-semibold uppercase text-teal-400">${data.name}</span>`
                );

                card.onclick = () => askForDetails(data.name, data.type);
                topicGrid.appendChild(card);
            });

            gridContainer.appendChild(topicGrid);
            gridContainer.appendChild(inventoryGrid);


            content.appendChild(gridContainer);
            
            // Back button to return to the main building view
            const backButton = createElement('button', 'metal-button mt-8 px-6 py-3 bg-gray-600 w-3/4 sm:w-1/2', 'BACK TO LOCATION VIEW');
            backButton.onclick = () => {
                const output = document.getElementById(MAIN_OUTPUT_ID);
                const actionKey = currentContext.data.actionKey;
                const actionFunc = actionRegistry[actionKey];

                if (output && actionFunc) {
                    // Execute the correct action function with the saved context
                    output.innerHTML = actionFunc(currentContext.name, currentContext.data);
                } else if (output) {
                    output.innerHTML = `<span class="block text-red-400">// ERROR: Cannot return to previous location. Action key "${actionKey}" not found. //</span>`;
                }
            };
            content.appendChild(backButton);

            return content;

        }

        function getLevelProgression() {
            // 1. Calculate Total XP
            const totalXP = game.chops.reduce((sum, chop) => sum + chop.level, 0);
            game.totalXP = totalXP; // Update global state
            
            // 2. Determine current level and boundaries
            let currentLevelData = LEVEL_CONFIG[0];
            let currentLevelIndex = 0;

            // Find the highest level the player has achieved
            for (let i = LEVEL_CONFIG.length - 1; i >= 0; i--) {
                if (totalXP >= LEVEL_CONFIG[i].requiredXP) {
                    currentLevelData = LEVEL_CONFIG[i];
                    currentLevelIndex = i;
                    break;
                }
            }

            const nextLevelIndex = currentLevelIndex + 1;
            const nextLevelData = LEVEL_CONFIG[nextLevelIndex] || LEVEL_CONFIG[LEVEL_CONFIG.length - 1];

            // 3. Calculate progress for the overall level bar
            let progressPercentage = 0;
            let xpToNextLevel = 'N/A';
            const isMaxLevel = currentLevelData.level === LEVEL_CONFIG[LEVEL_CONFIG.length - 1].level;
            
            if (!isMaxLevel) {
                const requiredXPForCurrent = currentLevelData.requiredXP;
                const requiredXPForNext = nextLevelData.requiredXP;
                
                const xpInCurrentSegment = totalXP - requiredXPForCurrent;
                const levelSpan = requiredXPForNext - requiredXPForCurrent;

                xpToNextLevel = requiredXPForNext - totalXP;
                progressPercentage = (xpInCurrentSegment / levelSpan) * 100;
                progressPercentage = Math.min(100, Math.max(0, progressPercentage));
            } else {
                // Max level reached
                progressPercentage = 100;
                xpToNextLevel = 'MAX';
            }

            game.level = currentLevelData.level; // Update global state
            
            const RANK_NAMES = ["Dreamer", "Aspiring Artist", "Opener", "Headliner", "Rock Legend"];


            return {
                level: currentLevelData.level,
                rank: RANK_NAMES[currentLevelData.level] || 'Beyond Legend',
                xpToNextLevel: xpToNextLevel,
                progressPercentage: progressPercentage.toFixed(0),
                currentChopMax: currentLevelData.chopMaxScale // New dynamic scale for individual chops
            };
        }

        /**

         */
        const base64ToArrayBuffer = (base64) => {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        };

        /**
         * Exponential backoff retry loop for API calls.
         * @param {Function} fetcher - The function that performs the fetch request.
         * @param {number} maxRetries - Maximum number of retries.
         */
        async function fetchWithRetry(fetcher, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetcher();
                    if (!response.ok) {
                        // Throw error if response is not 2xx
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === maxRetries - 1) throw error; // Re-throw if last attempt failed
                    
                    // Wait 2^i * 1000ms
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        function appendNotification(notifications, appName, fullText, emoji = '🔔', location) {
            const maxId = notifications.reduce((max, notification) => Math.max(max, notification.id), 0);
            const newId = maxId + 1;

            const summaryText = fullText.length > 30 
                                ? fullText.substring(0, 27) + '...' 
                                : fullText;

            const newNotification = {
                id: newId,
                app: appName,
                emoji: emoji,
                summary: summaryText,
                fullContent: fullText,
                location: location,
                unread: true // Always set to true
            };

            let arrayToAppendTo = notifications;

            if (notifications.length >= 6) {
                arrayToAppendTo = notifications.slice(1);
            }
            
            return [...arrayToAppendTo, newNotification];
        }

        function renderPhase7() {
        // --- Local Wordle Game State ---
            const targetWord = 'music'; //game.words[Math.floor(Math.random() * game.words.length)];

            let guesses = []; // Array of {word: '...', result: ['absent', 'present', 'correct', ...]}
            let currentGuess = '';
            let gameStatus = 'playing'; // 'playing', 'win', 'lose'
            let localMessage = game.message; // Use initial global message
            let availableKeys = {}; // Tracks key status for keyboard colors

            // --- Utility Functions ---

            function updateUI() {
                const contentDiv = document.getElementById('wordle-content');
                if (!contentDiv) return;

                // 1. Update the message
                const messageEl = document.getElementById('wordle-message');
                if (messageEl) messageEl.textContent = localMessage;

                // 2. Update the grid
                const gridHtml = Array(6).fill(0).map((_, rowIdx) => {
                    const rowData = guesses[rowIdx];
                    let rowContent = '';
                    for (let i = 0; i < 5; i++) {
                        let letter = '';
                        let className = 'box-empty';

                        if (rowData) {
                            // Previous guess
                            letter = rowData.word[i];
                            className = `box-${rowData.result[i]}`;
                        } else if (rowIdx === guesses.length) {
                            // Current guess
                            letter = currentGuess[i] || '';
                            className = currentGuess[i] ? 'box-current' : 'box-empty';
                        }

                        rowContent += `<div class="wordle-box ${className}">${letter}</div>`;
                    }
                    return `<div class="wordle-row">${rowContent}</div>`;
                }).join('');

                const gridEl = document.getElementById('wordle-grid');
                if (gridEl) gridEl.innerHTML = gridHtml;

                // 3. Update the keyboard
                const keyElements = document.querySelectorAll('.key-button');
                keyElements.forEach(keyEl => {
                    const key = keyEl.getAttribute('data-key');
                    keyEl.className = `key-button ${availableKeys[key] ? `key-${availableKeys[key]}` : ''}`;

                    // Disable keys if game over
                    if (gameStatus !== 'playing') {
                        keyEl.disabled = true;
                    } else {
                        keyEl.disabled = false;
                    }
                });
            }

            function checkGuess(guess) {
                guess = guess.toLowerCase()
                if (guess.length !== 5) {
                    localMessage = 'ERROR: Word must be 5 letters.';
                    updateUI();
                    return;
                }

                        //Dictionary Check ---
                if (!game.words.includes(guess)) {
                    //console.log('Guess:', guess)
                    localMessage = `ERROR: "${guess}" is not in the dictionary.`;
                    currentGuess = ''; // Clear guess to force re-entry
                    updateUI();
                    return;
                }

                const result = Array(5).fill('absent');
                const targetMap = {};
                for (const char of targetWord) {
                    targetMap[char] = (targetMap[char] || 0) + 1;
                }

                // Pass 1: Check for correct (green)
                for (let i = 0; i < 5; i++) {
                    if (guess[i] === targetWord[i]) {
                        result[i] = 'correct';
                        targetMap[guess[i]]--;
                        availableKeys[guess[i]] = 'correct';
                    }
                }

                // Pass 2: Check for present (yellow)
                for (let i = 0; i < 5; i++) {
                    if (result[i] !== 'correct') {
                        if (targetMap[guess[i]] > 0) {
                            result[i] = 'present';
                            targetMap[guess[i]]--;
                            if (availableKeys[guess[i]] !== 'correct') {
                                availableKeys[guess[i]] = 'present';
                            }
                        } else {
                            if (!availableKeys[guess[i]]) {
                                availableKeys[guess[i]] = 'absent';
                            }
                        }
                    }
                }

                guesses.push({ word: guess, result: result });
                currentGuess = '';

                if (guess === targetWord) {
                    gameStatus = 'win';
                    const scoreIncrease = 100 - (guesses.length * 10); // Better score for fewer guesses
                    let chop = game.chops.find(i => i.name === 'Social Influence');

                    chop.points +=scoreIncrease;
                    showSuccessAnimation();
                    localMessage = `WIN! ${targetWord} was the word. You earned ${scoreIncrease} Social Influence XP points! Returning to menu...`;
                    updateUI(); // Update UI for next gue
                    setTimeout(returnToMainMenu, 3500);
                } else if (guesses.length >= 6) {
                    gameStatus = 'lose';
                    localMessage = `DEFEAT! The word was ${targetWord}. Losing 10 XP points. Returning to menu...`;
                    game.chops["Social Influence"] = Math.max(0, game.chops["Social Influence"] - 10);
                    updateUI(); // Update UI for next gue
                    setTimeout(returnToMainMenu, 3500);
                } else {
                    localMessage = 'Guess submitted. Try again.';
                    updateUI(); // Update UI for next gue
                }

                updateUI();
            }



            function handleKey(key) {
                if (gameStatus !== 'playing') return;

                key = key.toUpperCase();

                if (key === 'ENTER') {
                    checkGuess(currentGuess);
                } else if (key === 'BACKSPACE') {
                    currentGuess = currentGuess.slice(0, -1);
                    localMessage = 'Guess the 5-letter word!';
                    updateUI();
                } else if (key.length === 1 && key.match(/[A-Z]/)) {
                    if (currentGuess.length < 5) {
                        currentGuess += key;
                        localMessage = 'Guess the 5-letter word!';
                        updateUI();
                    }
                }
            }

            function returnToMainMenu() {
                // Return to the main menu (Phase 0) as requested.
                setPhase(0, `Wordly challenge complete. Target word was: ${targetWord}. Score: $${game.score}.`);
            }

            // --- Event Listener Setup ---

            function setupEventListeners() {
                // Keyboard click handler
                const keyboardContainer = document.getElementById('keyboard-container');
                if(keyboardContainer) {
                    keyboardContainer.addEventListener('click', (e) => {
                        const keyButton = e.target.closest('.key-button');
                        if (keyButton) {
                            handleKey(keyButton.getAttribute('data-key'));
                        }
                    });
                }


                // Physical keyboard handler
                // Store the handler on the window so we can remove it later (in setPhase)
                window.wordleKeyHandler = (e) => {
                    if (game.phase === 7) { // Only handle keys in Phase 7
                        const key = e.key;
                        if (key === 'Enter') {
                            e.preventDefault();
                            handleKey('ENTER');
                        } else if (key === 'Backspace') {
                            handleKey('BACKSPACE');
                        } else if (key.match(/^[a-zA-Z]$/)) {
                            handleKey(key.toUpperCase());
                        }
                    }
                };
                document.addEventListener('keydown', window.wordleKeyHandler);
            }

            // --- Render Structure ---

            const wordleContainer = createElement('div', 'flex flex-col items-center justify-start h-full p-4 space-y-6');
            wordleContainer.id = 'wordle-content';

            // Title
            const title = createElement('h3', 'text-4xl font-extrabold title-font text-yellow-400 text-center', 'WORDLY CHALLENGE');
            wordleContainer.appendChild(title);

            // Message

        /**
         * Initializes the Tone.js components with better sound quality.
         * Creates a PolySynth with distortion for a "rock/metal" feel.
         */
        function initializeTone() {
            if (game.leadSynth && game.musicTransport) {
                return;
            }
            
            //console.log("Initializing Tone.js components...");

            // 1. Create Effects Chain
            const reverb = new Tone.Reverb({
                decay: 1.5, // Slightly shorter reverb
                preDelay: 0.01,
            });
            reverb.wet.value = 0.05; 

            // 2. Create the PolySynth (Tone.Synth for a cleaner sound)
            game.leadSynth = new Tone.PolySynth(Tone.Synth, {
                // Classic MIDI/clean tone parameters
                oscillator: { 
                    type: "triangle" // Softer, cleaner waveform, replacing 'sawtooth'
                },
                envelope: {
                    attack: 0.005, // Very fast attack
                    decay: 0.1,   // Quick decay
                    sustain: 0.8, // No sustain (more like a piano/bell)
                    release: 1.0, // Moderate release
                },
                volume: -10 //
            }).chain(reverb, Tone.Destination); // Chain through reverb to output (no distortion)

            // 3. Set up Tone.Transport
            game.musicTransport = Tone.Transport;
            game.musicTransport.bpm.value = 120; // Fast tempo
           // console.log("Tone.js PolySynth and Transport Initialized.");
        }




        async function playMusicChallenge(rawMidiPath) {
             // 1. Dispose of previous music part if it exists
            if (game.musicPart) {
                game.musicPart.dispose();
                game.musicPart = null;
            }
            stopMusic(); // Ensure transport is stopped

            // Safety check
            if (!Midi) {
                 updateState({ error: "MIDI parser library not loaded.", message: 'MIDI PARSER MISSING.' });
                 return;
            }
            
            // Ensure audio context and instruments are initialized
            await Tone.start();
            initializeTone();

            const PUBLIC_MIDI_URL = rawMidiPath
            try {
               // console.log(`Attempting to load MIDI from: ${PUBLIC_MIDI_URL}`);
                updateState({ message: `Loading and parsing track: ${game.currentSong}...`, isLoading: true });

                // 2. Fetch the MIDI file as an ArrayBuffer
                const response = await fetch(PUBLIC_MIDI_URL);
                const arrayBuffer = await response.arrayBuffer();

                // 3. Parse the MIDI data
                const midi = new Midi(arrayBuffer);

                // 4. Extract notes for the Tone.Part
                const partData = [];
                let maxDuration = 0; // Use to calculate the loop end

                midi.tracks.forEach(track => {
                    // Collect all notes from all tracks
                    track.notes.forEach(note => {
                        // The MIDI parser returns note data in the format Tone.js expects
                        partData.push({
                            time: note.time,        // Time in seconds
                            note: note.name,        // E.g., 'C4'
                            duration: note.duration,
                            velocity: note.velocity // 0-1
                        });
                    });
                    
                    // Track the maximum duration for looping purposes
                    if (track.duration > maxDuration) {
                        maxDuration = track.duration;
                    }
                });

                if (partData.length === 0) {
                    throw new Error("MIDI file contained no playable notes/tracks.");
                }

                const START_OFFSET_SECONDS  = 40
                // Set the transport loop based on the MIDI file's total duration
                // We will loop the music over the total max duration of the longest track.
                game.musicTransport.loop = true;
                game.musicTransport.position = START_OFFSET_SECONDS;
                game.musicTransport.loopEnd = maxDuration; // Set loop end to the actual duration

                // 5. Create the Tone.Part with the real data
                game.musicPart = new Tone.Part((time, value) => {
                    // Use the leadSynth to play the note
                    game.leadSynth.triggerAttackRelease(
                        value.note, 
                        value.duration, 
                        time, 
                        value.velocity
                    );
                }, partData);
                
                game.musicPart.start(0); // Start the part at transport position 0

                // 6. Start the Transport
                game.musicTransport.start();

               // console.log(`Successfully loaded and scheduled ${partData.length} notes from MIDI.`);
                updateState({ message: `Streaming LIVE: ${game.currentSong}. GUESS THE BAND!`, isLoading: false });

            } catch (e) {
                console.error("MIDI loading/parsing failed:", e);
                updateState({ 
                    error: `MIDI Load Error: ${e.message}. Check console for details.`, 
                    message: 'AUDIO SYSTEM FAILED TO LOAD TRACK.', 
                    isLoading: false 
                });
            }

        }

        /**
         * Stops the Tone.js transport and disposes of the synth.
         */
        function stopMusic() {
            if (game.musicTransport && game.musicTransport.state === 'started') {
                game.musicTransport.stop();
                game.musicTransport.cancel(0); // Clear all scheduled events
            }
            if (game.musicLoop) {
                game.musicLoop.dispose();
                game.musicLoop = null;
            }
        }
  
        window.handleGuessSubmission = function(isTimeout = false) {
            const inputElement = document.getElementById('guess-input');
            const playerGuess = inputElement ? inputElement.value.trim().toLowerCase() : '';

            if (!game.challengeActive && !isTimeout) return; 

            stopMusic();
            clearInterval(game.timerInterval);
            game.challengeActive = false;
            
            const correctBand = game.currentBand.toLowerCase();
            let resultMessage = '';

            if (isTimeout) {
                game.chops["Rhythm Mastery"] = Math.max(0, game.chops["Rhythm Mastery"] - 10);
                resultMessage = `TIME OUT! Challenge Failed. You lose 20 points. Correct: ${game.currentBand}.`;
            } else if (playerGuess === correctBand) {
                game.score += 50;
                game.chops["Rhythm Mastery"] += 50;
                resultMessage = `CORRECT! +50 Rhythm mastery Points. Band: ${game.currentBand}.`;
            } else {
                game.chops["Rhythm Mastery"] = Math.max(0, game.chops["Rhythm Mastery"] - 10);
                resultMessage = `INCORRECT. -10 Points. Correct Band: ${game.currentBand}.`;
            }

            game.message = resultMessage;
            
            // Wait 3 seconds, then move to the menu
            setTimeout(() => {
                game.phase = 0;
                game.message = "Challenge complete. Returning to System Menu.";
                renderGame();
            }, 3000);

            renderGame(); // Immediate update with result message
        }

        function startTimer() {
            if (game.timerInterval) {

        }

        /**
         * Loads the next question from the challenge pool.
         */
        function loadNextFeudQuestion() {
            const index = game.familyFeud.currentChallengeIndex;
            if (index >= game.familyFeud.Challenges.length) {
                setPhase(0, `You cleared all challenges! Total score: $${game.familyFeud.totalPointsScored}`, null);
                return;
            }

            const challenge = game.familyFeud.Challenges[index];
            game.familyFeud.currentChallenge = challenge;
            game.familyFeud.revealedAnswers = challenge.a.map(() => false);
            game.familyFeud.strikes = 0;
            game.familyFeud.roundPoints = 0;
            game.familyFeud.isRoundActive = true;
            renderGame(); // Re-render to show new question
        }

        function setupFeudGame() {
            game.familyFeud.Challenges = game.familyFeud.Challenges.sort(() => Math.random() - 0.5); // Shuffle challenges
            game.familyFeud.currentChallengeIndex = 0;
            game.familyFeud.totalPointsScored = 0;
            loadNextFeudQuestion();
            if (game.familyFeud.currentChallenge) {
                 setPhase(11, 'Welcome to the Survey Challenge! Guess the top 5 answers.');
            } else {
                 setPhase(0, `No challenges found! Returning to menu.`, null);
            }
            renderGame();
        }
        /**
         * Player submits a guess for the current question.
         * @param {string} guess - The player's answer attempt.
         */
        function submitFeudGuess(guess) {
            if (!game.familyFeud.isRoundActive || game.isLoading) return;
            
            const normalizedGuess = guess.trim().toLowerCase();
            const currentChallenge = game.familyFeud.currentChallenge;
            let correct = false;

            // Check against each unrevealed answer
            for (let i = 0; i < currentChallenge.a.length; i++) {
                if (game.familyFeud.revealedAnswers[i]) continue; // Skip revealed answers

                const normalizedAnswer = currentChallenge.a[i].text.toLowerCase();

                // Simple matching logic (could be improved with fuzzy matching)
                if (normalizedAnswer.includes(normalizedGuess) || normalizedGuess === normalizedAnswer) {
                    game.familyFeud.revealedAnswers[i] = true;
                    game.familyFeud.roundPoints += currentChallenge.a[i].points;
                    game.message = `CORRECT! You found answer #${i + 1} for ${currentChallenge.a[i].points} points.`;
                    correct = true;
                    break;
                }
            }

            if (correct) {
                // Check if all answers are revealed (round over)
                if (game.familyFeud.revealedAnswers.filter(r => r).length >= 3) {
                    endFeudRound(true);
                    

                }
            } else {
                game.familyFeud.strikes++;
                game.message = `STRIKE ${game.familyFeud.strikes}! Incorrect answer.`;
                // Check for 3 strikes (round lost)
                if (game.familyFeud.strikes >= 3) {
                    endFeudRound(false);
                    
                }
            }

            renderGame();
        }

        /**
         * Ends the current round and updates score.
         * @param {boolean} wonRound - True if all answers were found, false if 3 strikes hit.
         */
        function endFeudRound(wonRound) {
            game.familyFeud.isRoundActive = false;
            
            if (wonRound) {
                game.score += game.familyFeud.roundPoints;
                game.familyFeud.totalPointsScored += game.familyFeud.roundPoints;
                let chop = game.chops.find(i => i.name === 'Stage Presence');
                chop.points +=game.familyFeud.roundPoints;

                game.message = `ROUND WON! You scored ${game.familyFeud.roundPoints} Stage Presence points.`;
            } else {
                game.chops["Stage Presence"] = Math.max(0, game.chops["Stage Presence"] - 10);
                game.message = `THREE STRIKES! You lost score 10 points. Total score remains $${game.chops["Stage Presence"]}.`;
                  // Reveal all answers for feedback
                game.familyFeud.revealedAnswers = game.familyFeud.currentChallenge.a.map(() => true);
            }

            // Move to next question index
            game.familyFeud.currentChallengeIndex++;

            renderGame();
        }

        function handleGuess() {
            if (CLUE_GAME_STATE.gameOver || !clueGameElements.guessInput || !CLUE_GAME_STATE.currentChallenge) return;

            const { word, points } = CLUE_GAME_STATE.currentChallenge;
            const rawGuess = clueGameElements.guessInput.value.trim();
            if (rawGuess === '') {
                updateFeedback("Please enter a guess.", 'text-yellow-400 bg-yellow-900/50 border border-yellow-700');
                return;
            }
            
            const normalizedGuess = rawGuess.toUpperCase();
            const normalizedCorrect = word.toUpperCase();

            if (normalizedGuess === normalizedCorrect) {
                //game.score += points; // Use dynamic points
                let chop = game.chops.find(i => i.name === 'Lyrical Flow');

                chop.points += points;

                updateFeedback(`🎉 CORRECT! The word was: ${word}. +${points} Lyrical Flow points!`, 'text-green-400 bg-green-900/50 border border-green-700');
                endGame();
                //renderGame(); // Update main score display

            } else {
                CLUE_GAME_STATE.triesLeft--;

                if (CLUE_GAME_STATE.triesLeft > 0) {
                    game.chops["Lyrical Flow"] = Math.max(0, game.chops["Lyrical Flow"] - 10);
                    updateFeedback(`INCORRECT. Try again! You have ${CLUE_GAME_STATE.triesLeft} guesses left.`, 'text-red-400 bg-red-900/50 border border-red-700');
                    clueGameElements.guessInput.value = '';
                } else {
                    updateFeedback(`❌ GAME OVER. The correct word was: ${word}.`, 'text-red-400 bg-red-900/50 border border-red-700');
                    endGame();
                }
            }
        }

    /**
     * Renders all landmark markers and their bounding boxes.
     */
    function renderLandmarks() {
      const mapElement = document.getElementById('sf-map');
    if (!mapElement) return;

    // Clear all previous children
    mapElement.innerHTML = '';

    // Constants for background sizing
    const TEXT_HEIGHT = 20; // Estimated height of the text area
    const TEXT_BASELINE_OFFSET = 24; // Y position offset for the text baseline
    const CHAR_WIDTH_ESTIMATE = 9; // Estimated pixel width per character
    const PADDING = 12; // Padding around the text

    for (const name in landmarkData) {
        const bbox = landmarkData[name];

        // Only render nodes that are visible on the map (Y < 800)
        const isRendered = bbox.Y < 800;

        if (isRendered) {

            // Read the 'hidden' property
            const isHidden = bbox.hidden || false;

            // Calculate center of bounding box for the visual node
            const centerX = bbox.X + (bbox.W / 2);
            const centerY = bbox.Y + (bbox.H / 2);

            // --- Create a group for the whole landmark (emoji + name + click area) ---
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            group.setAttribute('class', `landmark-group ${isHidden ? 'hidden' : ''}`);
            group.setAttribute('title', name);
            group.onclick = () => handleClick(name);

            // --- 1. Draw the Invisible Bounding Box (Clickable Area) ---
            const nodeRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            // Add padding around the bounding box for easier clicking
            nodeRect.setAttribute('x', bbox.X - 5);
            nodeRect.setAttribute('y', bbox.Y - 5);
            nodeRect.setAttribute('width', bbox.W + 10);
            nodeRect.setAttribute('height', bbox.H + 10);
            nodeRect.setAttribute('fill', '#000');
            nodeRect.setAttribute('opacity', 0);

            group.appendChild(nodeRect);

            // --- 2. Draw the Visual Landmark Marker (Emoji) ---
            const markerEmoji = document.createElementNS("http://www.w3.org/2000/svg", "text");
            markerEmoji.setAttribute('x', centerX);
            markerEmoji.setAttribute('y', centerY + 3);
            markerEmoji.setAttribute('font-size', '24');
            markerEmoji.setAttribute('text-anchor', 'middle');
            markerEmoji.setAttribute('class', 'landmark-emoji');
           // markerEmoji.setAttribute('fill', '#fff'); //
            markerEmoji.textContent = bbox.emoji;

            group.appendChild(markerEmoji);

            // --- 3. Name Truncation Logic ---
            let displayName = name;
            const maxChars = 12;

            if (name.length > 15) {
                // Prefer splitting by space if the first word is short enough
                if (name.indexOf(' ') !== -1 && name.split(' ')[0].length < maxChars) {
                    displayName = name.split(' ')[0] + '...';
                } else {
                    // Otherwise, just truncate
                    displayName = name.substring(0, maxChars) + '...';
                }
            }

            displayName = displayName.toUpperCase(); // Ensure uppercase for map

            // Estimate background width based on the final display name length
            const backgroundWidth = Math.max(70, displayName.length * CHAR_WIDTH_ESTIMATE + PADDING); // Min 70px

            // --- 4. Draw the Shading Background (Rectangle) ---
            const markerBg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            // Y position calculation: text baseline (24) minus text height (20) to place the box over the text area
            const bgY = centerY + TEXT_BASELINE_OFFSET - TEXT_HEIGHT;
            const bgX = centerX - (backgroundWidth / 2);

            markerBg.setAttribute('x', bgX);
            markerBg.setAttribute('y', bgY);
            markerBg.setAttribute('width', backgroundWidth);
            markerBg.setAttribute('height', TEXT_HEIGHT);
            markerBg.setAttribute('rx', 4); // Rounded corners
            markerBg.setAttribute('fill', 'rgba(200, 200, 200, 0.7)'); // Semi-transparent dark background
            markerBg.setAttribute('class', 'landmark-name-bg');

            group.appendChild(markerBg); // Must be appended before text

            // --- 5. Draw the Location Name (Text) ---
            const markerName = document.createElementNS("http://www.w3.org/2000/svg", "text");
            markerName.setAttribute('x', centerX);
            markerName.setAttribute('y', centerY + TEXT_BASELINE_OFFSET);
            markerName.setAttribute('text-anchor', 'middle');
            markerName.setAttribute('class', 'landmark-name');
            markerName.setAttribute('fill', '#000'); // White text for high contrast
            markerName.textContent = displayName;

            group.appendChild(markerName);

            mapElement.appendChild(group);
        }
    }
    return mapElement;
    }

    /** Calculates the combined score from memories on the mixing board. */
        function calculateMixedScore() {
            let grit = 0;
            let soul = 0;
            let depth = 0;

            game.mixingBoard.forEach(theme => {
                const memory = memoryComponentMatrix[theme];
                grit += memory.grit;
                soul += memory.soul;
                depth += memory.depth;
            });

            game.mixedScore = { grit, soul, depth };
        }

        /** Checks if the current mixed score matches any un-found recipe. */
        function checkRecipeMatch() {
            const currentG = game.mixedScore.grit;
            const currentS = game.mixedScore.soul;
            const currentD = game.mixedScore.depth;
            let matchFound = null;

            game.songRecipes.forEach(recipe => {
                if (!recipe.found && 
                    recipe.mix.grit === currentG &&
                    recipe.mix.soul === currentS &&
                    recipe.mix.depth === currentD) {
                    
                    recipe.found = true; 
                    game.songCounts +=1; // Mark as found
                    matchFound = recipe;
                }
            });


            if (matchFound) {
                game.message = `NEW SONG ACHIEVED: "${matchFound.title}" (${matchFound.type})!`;
            }
        }

        /** Handles adding/removing a memory from the mixing board. */
        function toggleMemoryOnBoard(memoryTheme, isFromBoard = false) {
            
            // Check if the memory is already on the board
            const indexOnBoard = game.mixingBoard.indexOf(memoryTheme);

            if (indexOnBoard !== -1) {
                // Remove from board
                game.mixingBoard.splice(indexOnBoard, 1);
                game.memories[memoryTheme]++; // Return count
                game.message = `De-mixed ${memoryTheme}.`;
            } else if (!isFromBoard) {
                // Add to board (only if clicked from inventory and capacity allows)
                if (game.mixingBoard.length < 3) {
                    if (game.memories[memoryTheme] > 0) {
                        game.mixingBoard.push(memoryTheme);
                        game.memories[memoryTheme]--; // Decrement count
                        game.message = `Mixed in ${memoryTheme}.`;
                    } else {
                        game.message = `No ${memoryTheme} memories remaining in inventory.`;
                    }
                } else {
                    game.message = `Mixing Board is full (Max 3 components). Click a memory on the board to remove it first.`;
                }
            }

            calculateMixedScore();
            checkRecipeMatch();
            renderGame(); // Re-render to update scores and UI
        }
