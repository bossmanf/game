        function loadNextFeudQuestion() {
            const index = game.familyFeud.currentChallengeIndex;
            if (index >= game.familyFeud.Challenges.length) {
                setPhase(10, `You cleared all challenges! Total score: $${game.familyFeud.totalPointsScored}`, null);
                return;
            }

            const challenge = game.familyFeud.Challenges[index];
            game.familyFeud.currentChallenge = challenge;
            game.familyFeud.revealedAnswers = challenge.a.map(() => false);
            game.familyFeud.strikes = 0;
            game.familyFeud.roundPoints = 0;
            game.familyFeud.isRoundActive = true;
            renderGame(); // Re-render to show new question
        }

        function setupFeudGame() {
            game.familyFeud.Challenges = game.familyFeud.Challenges.sort(() => Math.random() - 0.5); // Shuffle challenges
            game.familyFeud.currentChallengeIndex = 0;
            game.familyFeud.totalPointsScored = 0;
            loadNextFeudQuestion();
            if (game.familyFeud.currentChallenge) {
                 setPhase(11, '');
            } else {
                 setPhase(10, '', null);
            }
            renderGame();
        }
        /**
         * Player submits a guess for the current question.
         * @param {string} guess - The player's answer attempt.
         */
        function submitFeudGuess(guess) {
            if (!game.familyFeud.isRoundActive || game.isLoading) return;
            
            const normalizedGuess = guess.trim().toLowerCase();

            if (normalizedGuess.length <= 2) {
                game.message = "Guess too short! Try a more specific answer.";
                renderGame();
                return;
            }

            const currentChallenge = game.familyFeud.currentChallenge;
            let correct = false;

            // Check against each unrevealed answer
            for (let i = 0; i < currentChallenge.a.length; i++) {
                if (game.familyFeud.revealedAnswers[i]) continue; // Skip revealed answers

                const normalizedAnswer = currentChallenge.a[i].text.toLowerCase();

                // Simple matching logic (could be improved with fuzzy matching)
                if (normalizedAnswer.includes(normalizedGuess) || normalizedGuess === normalizedAnswer) {
                    game.familyFeud.revealedAnswers[i] = true;
                    game.familyFeud.roundPoints += currentChallenge.a[i].points;
                    correct = true;
                    break;
                }
            }

            if (correct) {
                // Check if all answers are revealed (round over)
                showSuccessAnimation();
                if (game.familyFeud.revealedAnswers.filter(r => r).length >= 3) {
                    endFeudRound(true);
                    

                }
            } else {
                game.familyFeud.strikes++;
                // Check for 3 strikes (round lost)
                if (game.familyFeud.strikes >= 3) {
                    endFeudRound(false);
                    
                }
            }

            renderGame();
        }

        /**
         * Ends the current round and updates score.
         * @param {boolean} wonRound - True if all answers were found, false if 3 strikes hit.
         */
        function endFeudRound(wonRound) {
            game.familyFeud.isRoundActive = false;
            
            if (wonRound) {
                game.familyFeud.totalPointsScored += game.familyFeud.roundPoints;
                let chop = game.chops.find(i => i.name === 'Stage Presence');
                chop.points += updateChopScore('Stage Presence',game.familyFeud.totalPointsScored); 
                addChopAvailable(chop.name);
                game.message = `ROUND WON! You scored ${game.familyFeud.roundPoints} Stage Presence points.`;
            } else {
                game.chops["Stage Presence"] = Math.max(0, game.chops["Stage Presence"] );
                game.message = `THREE STRIKES! Try again. Total score remains ${game.chops["Stage Presence"]}.`;
                  // Reveal all answers for feedback
                game.familyFeud.revealedAnswers = game.familyFeud.currentChallenge.a.map(() => true);
            }

            // Move to next question index
            game.familyFeud.currentChallengeIndex ++;

            renderGame();
        }

    /**

    function renderLandmarks() {
      const mapElement = document.getElementById('sf-map');
        if (!mapElement) return;

        mapElement.innerHTML = '';

        // Constants for background sizing
        const TEXT_HEIGHT = 20; // Estimated height of the text area
        const TEXT_BASELINE_OFFSET = 24; // Y position offset for the text baseline
        const CHAR_WIDTH_ESTIMATE = 9; // Estimated pixel width per character
        const PADDING = 12; // Padding around the text

        for (const name in landmarkData) {
            const bbox = landmarkData[name];

            // Only render nodes that are visible on the map (Y < 800)
            const isRendered = bbox.Y < 800;

            if (isRendered) {

                // Read the 'hidden' property
                const isHidden = bbox.hidden || false;

                // Calculate center of bounding box for the visual node
                const centerX = bbox.X + (bbox.W / 2);
                const centerY = bbox.Y + (bbox.H / 2);

                // --- Create a group for the whole landmark (emoji + name + click area) ---
                const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
                group.setAttribute('class', `landmark-group ${isHidden ? 'hidden' : ''}`);
                group.setAttribute('title', name);
                group.onclick = () => handleClick(name);

                // --- 1. Draw the Invisible Bounding Box (Clickable Area) ---
                const nodeRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                // Add padding around the bounding box for easier clicking
                nodeRect.setAttribute('x', bbox.X - 5);
                nodeRect.setAttribute('y', bbox.Y - 5);
                nodeRect.setAttribute('width', bbox.W + 10);
                nodeRect.setAttribute('height', bbox.H + 10);
                nodeRect.setAttribute('fill', '#000');
                nodeRect.setAttribute('opacity', 0);

                group.appendChild(nodeRect);

                // --- 2. Draw the Visual Landmark Marker (Emoji) ---
                const markerEmoji = document.createElementNS("http://www.w3.org/2000/svg", "text");
                markerEmoji.setAttribute('x', centerX);
                markerEmoji.setAttribute('y', centerY + 3);
                markerEmoji.setAttribute('font-size', '24');
                markerEmoji.setAttribute('text-anchor', 'middle');
                markerEmoji.setAttribute('class', 'landmark-emoji');
               // markerEmoji.setAttribute('fill', '#fff'); //
                markerEmoji.textContent = bbox.emoji;

                group.appendChild(markerEmoji);

                // --- 3. Name Truncation Logic ---
                let displayName = name;
                const maxChars = 12;

                if (name.length > 15) {
                    // Prefer splitting by space if the first word is short enough
                    if (name.indexOf(' ') !== -1 && name.split(' ')[0].length < maxChars) {
                        displayName = name.split(' ')[0] + '...';
                    } else {
                        // Otherwise, just truncate
                        displayName = name.substring(0, maxChars) + '...';
                    }
                }

                displayName = displayName.toUpperCase(); // Ensure uppercase for map

                // Estimate background width based on the final display name length
                const backgroundWidth = Math.max(70, displayName.length * CHAR_WIDTH_ESTIMATE + PADDING); // Min 70px

                // --- 4. Draw the Shading Background (Rectangle) ---
                const markerBg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                // Y position calculation: text baseline (24) minus text height (20) to place the box over the text area
                const bgY = centerY + TEXT_BASELINE_OFFSET - TEXT_HEIGHT;
                const bgX = centerX - (backgroundWidth / 2);

                markerBg.setAttribute('x', bgX);
                markerBg.setAttribute('y', bgY);
                markerBg.setAttribute('width', backgroundWidth);
                markerBg.setAttribute('height', TEXT_HEIGHT);
                markerBg.setAttribute('rx', 4); // Rounded corners
                markerBg.setAttribute('fill', 'rgba(200, 200, 200, 0.7)'); // Semi-transparent dark background
                markerBg.setAttribute('class', 'landmark-name-bg');

                group.appendChild(markerBg); // Must be appended before text

                // --- 5. Draw the Location Name (Text) ---
                const markerName = document.createElementNS("http://www.w3.org/2000/svg", "text");
                markerName.setAttribute('x', centerX);
                markerName.setAttribute('y', centerY + TEXT_BASELINE_OFFSET);
                markerName.setAttribute('text-anchor', 'middle');
                markerName.setAttribute('class', 'landmark-name');
                markerName.setAttribute('fill', '#000'); // White text for high contrast
                markerName.textContent = displayName;

                group.appendChild(markerName);

                mapElement.appendChild(group);
            }
        }
        return mapElement;
    }

        async function resumeContext() {
            if (Tone.context.state !== 'running') {
                try {
                    await Tone.start();
                    game.radio.isInitialized = true;
                    console.log("Audio Context Started");
                } catch (e) {
                    console.error("Failed to start Tone.js:", e);
                }
            }
        }

        function playTrack() {
            // 1. Cleanup existing player
            if (game.radio.player) {
                try {
                    game.radio.player.stop();
                    game.radio.player.dispose();
                } catch (e) {
                    console.warn("Error cleaning up player:", e);
                }
                game.radio.player = null;
            }

            const station = game.radio.currentStation;
            const track = station.tracks[game.radio.currentTrackIndex];
            
            if (!track || !track.url) {
                game.radio.errorState = "NO SIGNAL";
                game.radio.isPlaying = false;
                renderGame();
                return;
            }

            console.log('Testing ', track.url);
            // 2. Create new player with explicit destination connection
            // Note: EncodingError usually means the URL is valid but the format is unreadable
            const player = new Tone.Player({
                url: track.url,
                autostart: true,
                volume: game.radio.volume,
                onload: () => {
                    console.log("Track Loaded Successfully:", track.title);
                    game.radio.isPlaying = true;
                    game.radio.errorState = false;
                    // Ensure UI reflects active state
                    //setTimeout(renderGame, 50);
                },
                onerror: (err) => {

                    console.error("Tone Player Error (Decoding/Loading):", err);
                    // If decoding fails, mark as error but allow user to try next track
                    game.radio.errorState = "DECODE ERROR";
                    game.radio.isPlaying = false;
                    renderGame();
                    
                    // Auto-cleanup failed player
                    if (player) {
                        player.dispose();
                    }
                }
            }).toDestination();

            // 3. Setup event listeners
            player.onstop = () => {
                // Only auto-advance if it stopped naturally at the end (not manual stop)
                if (game.radio.isPlaying && player.state === 'stopped' && player.buffer.loaded) {
                    // Check if we reached the end of the track
                    const bufferDuration = player.buffer.duration;
                    if (bufferDuration > 0) {
                        console.log("Track finished, moving to next...");
                        changeTrack(1);
                        game.endSong = true;
                    }
                }
            };

            game.radio.player = player;
        }

                `;
                document.head.appendChild(style);
            }

            const container = document.createElement('div');
            container.className = 'terminal-container';

            const canvas = document.createElement('canvas');
            canvas.className = 'terminal-canvas';
            canvas.width = 600;
            canvas.height = 300; 
            container.appendChild(canvas);

            const overlay = document.createElement('div');
            overlay.className = 'terminal-overlay-ui';
            overlay.innerHTML = `
                <h2 id="term-ui-title"></h2>
                <p id="term-ui-desc"></p>
                <button id="term-ui-btn">CONTINUE</button>
            `;
            container.appendChild(overlay);

            const ctx = canvas.getContext('2d');
            
            // Internal State
            const state = {
                input: ['', '', '', '', ''],
                currentIndex: 0,
                status: 'READY',
                shake: 0,
                targetWord: "MUSIC",
                colors: {
                    bg: '#050505',
                    text: '#00ff41',
                    accent: '#003b00',
                    error: '#ff0033'
                }
            };

            const showUI = (title, desc) => {
                overlay.querySelector('#term-ui-title').innerText = title;
                overlay.querySelector('#term-ui-desc').innerText = desc;
                overlay.style.display = 'block';
            };

            const checkWord = () => {
                const word = state.input.join('');
                if (word === state.targetWord) {
                    state.status = 'GRANTED';
                    setTimeout(() => {
                        showUI("ACCESS GRANTED", "The bouncer steps aside. Welcome to the club.");
                        if (onSuccess) onSuccess();
                    }, 800);
                } else {
                    state.shake = 20;
                    state.status = 'DENIED';
                    if (onFailure) onFailure();
                    setTimeout(() => {
                        state.status = 'READY';
                        state.input = ['', '', '', '', ''];
                        state.currentIndex = 0;
                    }, 1500);
                }
            };

            const processChar = (char) => {
                if (state.status !== 'READY' || overlay.style.display === 'block') return;
                if (state.currentIndex < 5) {
                    state.input[state.currentIndex] = char.toUpperCase();
                    state.currentIndex++;
                    if (state.currentIndex === 5) setTimeout(checkWord, 300);
                }
            };

            const processBackspace = () => {
                if (state.status !== 'READY' || overlay.style.display === 'block') return;
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    state.input[state.currentIndex] = '';
                }
            };

            // Visual Keyboard Construction
            const kbContainer = document.createElement('div');
            kbContainer.className = 'term-keyboard-container';
            
            const layout = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
            ];

            layout.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'term-kb-row';
                row.forEach(key => {
                    const kBtn = document.createElement('button');
                    kBtn.className = `term-key ${key === 'DEL' ? 'key-special key-del' : ''}`;
                    kBtn.textContent = key;
                    kBtn.onclick = (e) => {
                        e.preventDefault();
                        if (key === 'DEL') processBackspace();
                        else processChar(key);
                    };
                    rowEl.appendChild(kBtn);
                });
                kbContainer.appendChild(rowEl);
            });
            container.appendChild(kbContainer);

            // Keep physical keyboard listener for desktop users
            const handleKeydown = (e) => {
                if (e.key === 'Backspace') processBackspace();
                else if (e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) processChar(e.key);
            };
            window.addEventListener('keydown', handleKeydown);

            overlay.querySelector('#term-ui-btn').onclick = () => {
                overlay.style.display = 'none';
                if (state.status !== 'GRANTED') {
                    state.status = 'READY';
                    state.input = ['', '', '', '', ''];
                    state.currentIndex = 0;
                }
            };

            // Drawing Loop
            function render(time) {
                if (!container.isConnected) {
                    window.removeEventListener('keydown', handleKeydown);
                    return;
                }

                let offsetX = 0, offsetY = 0;
                if (state.shake > 0) {
                    offsetX = (Math.random() - 0.5) * state.shake;
                    offsetY = (Math.random() - 0.5) * state.shake;
                    state.shake *= 0.9;
                }

                ctx.fillStyle = state.colors.bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Scanlines
                ctx.strokeStyle = state.colors.accent;
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.height; i += 4) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }

                ctx.save();
                ctx.translate(offsetX, offsetY);

                // Title
                ctx.fillStyle = state.status === 'DENIED' ? state.colors.error : state.colors.text;
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                let titleText = "BOUNCER SECURITY TERMINAL";
                if (state.status === 'GRANTED') titleText = "ACCESS GRANTED";
                if (state.status === 'DENIED') titleText = "SYSTEM REJECTED";
                ctx.fillText(titleText, canvas.width / 2, 70);

                // Inputs
                const boxSize = 60, spacing = 15;
                const startX = (canvas.width - (boxSize * 5 + spacing * 4)) / 2;
                state.input.forEach((char, i) => {
                    const x = startX + i * (boxSize + spacing), y = 140;
                    ctx.strokeStyle = (i === state.currentIndex && state.status === 'READY') ? state.colors.text : state.colors.accent;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, boxSize, boxSize);
                    ctx.fillStyle = state.colors.text;
                    ctx.font = 'bold 40px "Courier New"';
                    ctx.fillText(char, x + boxSize / 2, y + 45);

                    if (i === state.currentIndex && state.status === 'READY' && Math.floor(time / 500) % 2 === 0) {
                        ctx.fillRect(x + 10, y + boxSize - 10, boxSize - 20, 4);
                    }
                });

                ctx.font = '14px "Courier New"';
                ctx.fillStyle = state.colors.accent;
                ctx.fillText("USE ON-SCREEN KEYS TO ENTER PASSCODE", canvas.width / 2, 260);
                
                ctx.restore();

                // CRT Vignette
                const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 400);
                grad.addColorStop(0, 'rgba(0,255,65,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                requestAnimationFrame(render);
            }

            requestAnimationFrame(render);
            return container;
        }

        function createSecurityTerminalChapter(chapter_number, code, text, { onSuccess, onFailure }) {
            // 1. Inject Styles for the Terminal and Keyboard
            if (!document.getElementById('terminal-styles')) {
                const style = document.createElement('style');
                style.id = 'terminal-styles';
                style.textContent = `
                    .terminal-container { position: relative; box-shadow: 0 0 50px rgba(0, 255, 65, 0.2); border: 8px solid #222; border-radius: 12px; background: #000; overflow: hidden; display: flex; flex-col; align-items: center; padding-bottom: 20px; }
                    .terminal-overlay-ui { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); color: #0f0; padding: 30px; border: 2px solid #0f0; text-align: center; z-index: 10; display: none; min-width: 280px; font-family: 'Courier New', monospace; }
                    .terminal-overlay-ui button { background: #0f0; border: none; padding: 10px 20px; margin-top: 15px; cursor: pointer; font-weight: bold; font-family: inherit; color: black; }
                    
                    .terminal-keyboard { width: 100%; max-width: 400px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: -20px; position: relative; z-index: 5; }
                    .term-key { background: #111; border: 2px solid #003b00; color: #00ff41; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 20px; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
                    .term-key:active { background: #00ff41; color: black; transform: scale(0.95); }
                    .term-key.key-del { background: #220000; border-color: #550000; color: #ff0033; }
                `;
                document.head.appendChild(style);
            }

            const container = createElement('div', 'terminal-container flex flex-col items-center');
            
            // 2. Terminal Display (Canvas)
            const canvas = createElement('canvas');
            canvas.width = 500;
            canvas.height = 300; // Slightly shorter to make room for keys
            container.appendChild(canvas);

            const overlay = createElement('div', 'terminal-overlay-ui');
            overlay.innerHTML = `<h2 id="term-ui-title"></h2><p id="term-ui-desc"></p><button id="term-ui-btn">CONTINUE</button>`;
            container.appendChild(overlay);

            const ctx = canvas.getContext('2d');
            const state = { input: ['', '', '', ''], currentIndex: 0, status: 'READY', shake: 0, targetWord: code };

            // 3. Logic Functions
            const showUI = (title, desc) => {
                overlay.querySelector('#term-ui-title').innerText = title;
                overlay.querySelector('#term-ui-desc').innerText = desc;
                overlay.style.display = 'block';
            };

            const checkWord = () => {
                const word = state.input.join('');
                if (word === state.targetWord) {
                    state.status = 'GRANTED';
                    setTimeout(() => {
                        showUI(`CHAPTER ${chapter_number}`, "Access Verified. " + text);
                    }, 600);
                } else {
                    state.shake = 15;
                    state.status = 'DENIED';
                    if (onFailure) onFailure();
                    setTimeout(() => { 
                        state.status = 'READY'; 
                        state.input = ['', '', '', '']; 
                        state.currentIndex = 0; 
                    }, 1200);
                }
            };

            const handleInput = (val) => {
                if (state.status !== 'READY' || overlay.style.display === 'block') return;
                if (state.currentIndex < 4) {
                    state.input[state.currentIndex] = val;
                    state.currentIndex++;
                    if (state.currentIndex === 4) setTimeout(checkWord, 200);
                }
            };

            const handleBackspace = () => {
                if (state.status !== 'READY' || overlay.style.display === 'block') return;
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    state.input[state.currentIndex] = '';
                }
            };

            // 4. Create Visual Keyboard
            const keyboard = createElement('div', 'terminal-keyboard');
            const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'DEL'];
            
            keys.forEach(key => {
                const kBtn = createElement('button', `term-key ${key === 'DEL' ? 'key-del col-span-2' : ''}`, key);
                kBtn.onclick = (e) => {
                    e.preventDefault();
                    if (key === 'DEL') handleBackspace();
                    else handleInput(key);
                };
                keyboard.appendChild(kBtn);
            });
            container.appendChild(keyboard);

            // 5. Physical Keyboard Support (for Mac users)
            const handleKeydown = (e) => {
                if (e.key === 'Backspace') handleBackspace();
                else if (/^[0-9]$/.test(e.key)) handleInput(e.key);
            };
            window.addEventListener('keydown', handleKeydown);

            // 6. Drawing Loop
            function renderLoop(time) {
                if (!container.isConnected) { window.removeEventListener('keydown', handleKeydown); return; }
                
                let ox = 0, oy = 0;
                if (state.shake > 0) {
                    ox = (Math.random() - 0.5) * state.shake;
                    oy = (Math.random() - 0.5) * state.shake;
                    state.shake *= 0.85;
                }

                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.save();
                ctx.translate(ox, oy);

                // Scanlines
                ctx.strokeStyle = '#001a00';
                ctx.lineWidth = 1;
                for (let i = 0; i < canvas.height; i += 3) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }

                // Header
                ctx.fillStyle = state.status === 'DENIED' ? '#ff0033' : '#00ff41';
                ctx.font = 'bold 18px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(state.status === 'DENIED' ? "INVALID PASSCODE" : `CHAPTER ${chapter_number} SECURITY`, canvas.width / 2, 50);

                // Code Boxes
                state.input.forEach((char, i) => {
                    const x = 110 + i * 75, y = 100;
                    ctx.strokeStyle = (i === state.currentIndex && state.status === 'READY') ? '#00ff41' : '#003b00';
                    ctx.strokeRect(x, y, 65, 65);
                    ctx.fillStyle = '#00ff41';
                    ctx.font = 'bold 44px "Courier New"';
                    ctx.fillText(char, x + 32, y + 48);
                    
                    // Cursor
                    if (i === state.currentIndex && state.status === 'READY' && Math.floor(time / 500) % 2 === 0) {
                        ctx.fillRect(x + 10, y + 55, 45, 4);
                    }
                });

                ctx.font = '10px "Courier New"';
                ctx.fillStyle = '#003b00';
                ctx.fillText("TAP KEYS OR TYPE CODE TO PROCEED", canvas.width / 2, 220);
                
                ctx.restore();
                requestAnimationFrame(renderLoop);
            }

            requestAnimationFrame(renderLoop);

            // 7. Success logic
            overlay.querySelector('#term-ui-btn').onclick = () => {
                if (state.status === 'GRANTED') {
                    document.getElementById('chapter-unlock-modal')?.remove();
                    if (onSuccess) onSuccess(); 
                } else {
                    overlay.style.display = 'none';
                }
            };

            return container;
        }

                const itemWrapper = createElement('div', 'flex flex-col space-y-4');
                
                // Input Field / Solved Header

                    inputWrapper.appendChild(input);
                } else {
                    inputWrapper.innerHTML = `<p class="font-handwriting text-xl text-green-800 flex items-center">✓ ${loc.name}</p>`;
                }

                // Photo Area
                const photoSlot = createElement('div', `photo-slot relative overflow-hidden flex items-center justify-center bg-black/5 ${isSolved ? 'photo-revealed' : ''}`);
       
                
                if (hasPhoto) {

                            <span class="check-mark">✓</span>
                            <p class="font-handwriting text-xs text-[#5d4037] mt-1">Location Verified</p>

                }

                // Description
                const desc = createElement('div', 'space-y-2');
                desc.innerHTML = `
                    <p class="font-handwriting text-sm italic leading-relaxed text-[#5d4037]">"${loc.visual}"</p>
                    <p class="font-handwriting text-sm italic text-[#6d4c41] mt-2">${loc.sensory}</p>
                `;

                itemWrapper.appendChild(inputWrapper);
                itemWrapper.appendChild(photoSlot);
                itemWrapper.appendChild(desc);
                grid.appendChild(itemWrapper);
            });

            scrapbook.appendChild(grid);

            // Pagination Controls
            const controls = createElement('div', 'mt-10 pt-6 border-t border-[#a39476] flex justify-between items-center');
            
            const prevBtn = createElement('button', 'metal-button text-xs', '← Prev');
            prevBtn.disabled = game.scrapbookPage === 0;

            const closeBtn = createElement('button', 'metal-button text-xs', 'Close Book');
            closeBtn.onclick = () => { game.phase = 1; renderGame(); };

            const nextBtn = createElement('button', 'metal-button text-xs', 'Next →');

            controls.appendChild(prevBtn);
            controls.appendChild(closeBtn);
            controls.appendChild(nextBtn);
            scrapbook.appendChild(controls);

            return scrapbook;
        }

    /** Calculates the combined score from memories on the mixing board. */
        function calculateMixedScore() {
            let grit = 0;
            let soul = 0;
            let depth = 0;

            game.mixingBoard.forEach(theme => {
                const memory = memoryComponentMatrix[theme];
                grit += memory.grit;
                soul += memory.soul;
                depth += memory.depth;
            });

            game.mixedScore = { grit, soul, depth };
        }

        /** Checks if the current mixed score matches any un-found recipe. */
        function checkRecipeMatch() {
            const currentG = game.mixedScore.grit;
            const currentS = game.mixedScore.soul;
            const currentD = game.mixedScore.depth;
            let matchFound = null;

            game.songRecipes.forEach(recipe => {
                if (!recipe.found && recipe.available &&
                    recipe.mix.grit === currentG &&
                    recipe.mix.soul === currentS &&
                    recipe.mix.depth === currentD) {
                    
                    recipe.found = true; 
                    game.songCounts +=1; // Mark as found
                    matchFound = recipe;
                }
            });


            if (matchFound) {
               // game.message = `NEW SONG ACHIEVED: "${matchFound.title}" (${matchFound.type})!`;
                game.songs +=1;
            }
        }

        /** Handles adding/removing a memory from the mixing board. */
        function toggleMemoryOnBoard(memoryTheme, isFromBoard = false) {
            
            // Check if the memory is already on the board
            const indexOnBoard = game.mixingBoard.indexOf(memoryTheme);

            if (indexOnBoard !== -1) {
                // Remove from board
                game.mixingBoard.splice(indexOnBoard, 1);
                game.memories[memoryTheme]++; // Return count
             //   game.message = `De-mixed ${memoryTheme}.`;
            } else if (!isFromBoard) {
                // Add to board (only if clicked from inventory and capacity allows)
                if (game.mixingBoard.length < 3) {
                    if (game.memories[memoryTheme] > 0) {
                        game.mixingBoard.push(memoryTheme);
                       //game.memories[memoryTheme]--; // Decrement count
                        game.message = `Mixed in ${memoryTheme}.`;
                    } else {
                        game.message = `No ${memoryTheme} memories remaining in inventory.`;
                    }
                } else {
                    game.message = `Mixing Board is full (Max 3 components). Click a memory on the board to remove it first.`;
                }
            }

            calculateMixedScore();
            checkRecipeMatch();
            renderGame(); // Re-render to update scores and UI
        }

         function updateChopScore(chopName, scoreIncrease) {
            const currentLevelData = LEVEL_CONFIG[game.level];
            const chop = game.chops.find(c => c.name === chopName);
            
            if (!chop) return;

            // 1. Limit points so they don't exceed current rank's max
            const maxPoints = currentLevelData.chopMaxScale;
            const previousPoints = chop.points;
            chop.points = Math.min(maxPoints, chop.points + scoreIncrease);
            
            const actualIncrease = chop.points - previousPoints;

            // 2. Check if ALL chops have reached the current max level
            const allAtMax = game.chops.every(c => c.points >= maxPoints);

            if (game.chapter === 2){

                return actualIncrease;
            }

            // 3. Update Rank Level if all at max and next level exists
            if (allAtMax && game.level < LEVEL_CONFIG.length - 1) {
                game.level++;


                // NEW: Reset all scores to 0 for the new rank tier
                game.chops.forEach(c => {
                    c.points = 0;
                });
                let nextRank = LEVEL_CONFIG[game.level].rank;
                game.rank = nextRank;
                showGameMessage(`YOU LEVEL UP! You are now a ${nextRank}! Go back home and claim your title!.`, 'success');

                return -previousPoints;
            }

            return actualIncrease;
        };

     function renderScenarioScreen() {
            // 1. Finale Return Catcher
            if (game.pendingFinaleTier) {
                const tier = game.pendingFinaleTier;
                const finalevideo = game.pendingFinaleVideo;
                delete game.pendingFinaleTier;
                delete game.pendingFinaleVideo;
                setTimeout(() => renderFinaleScreen(tier, finalevideo), 50);
                return createElement('div', 'flex items-center justify-center h-full', `
                    <div class="text-center space-y-4">
                        <div class="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto"></div>
                        <p class="text-white font-mono text-xs tracking-[0.5em] uppercase animate-pulse">Compiling Legacy...</p>
                    </div>
                `);
            }

            // 2. Standard Choice Return Catcher
            if (game.deferredFeedback) {
                const { reasoning, deltas } = game.deferredFeedback;
                delete game.deferredFeedback;
                setTimeout(() => {
                    showImpactFeedback(reasoning, deltas, () => {
                        advanceScenario();
                    });
                }, 50);
                return createElement('div', 'flex items-center justify-center h-full min-h-[400px]', `
                    <div class="text-center space-y-4">
                        <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p class="text-cyan-400 font-mono text-xs tracking-widest uppercase">Synchronizing Legacy Data...</p>
                    </div>
                `);
            }

            const idx = game.currentScenario;
            const scenario = scenarioData[idx];

            if (idx === 31 || idx >= scenarioData.length - 1) return renderCrossroads();

            const container = createElement('div', 'flex flex-col w-full h-full p-6 space-y-4 animate-in fade-in zoom-in-95 duration-500 relative overflow-hidden');

            const bgGlows = `

            `;
            container.innerHTML = bgGlows;

            // --- 1. Narrative Progress Section ---
            const progressPercent = ((idx + 1) / 32) * 100;
            const progressHeader = createElement('div', 'w-full space-y-2 mb-2 relative z-10');
            progressHeader.innerHTML = `
                <div class="flex justify-between items-end px-1">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black text-cyan-400 uppercase tracking-[0.3em]">Story Progress</span>
                    </div>
                    <span class="text-xl font-black text-white italic tracking-tighter">${idx + 1} <span class="text-zinc-600 text-sm">/ 32</span></span>
                </div>
                <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden border border-white/5">
                    <div class="h-full bg-cyan-500 transition-all duration-1000 shadow-[0_0_15px_#06b6d4]" style="width: ${progressPercent}%"></div>
                </div>
            `;
            container.appendChild(progressHeader);

            // --- 2. THE ROUNDEL DASHBOARD (New Creative Visual) ---
            const traitsBar = createElement('div', 'grid grid-cols-3 md:grid-cols-6 gap-2 w-full p-6 bg-black/60 border-y border-white/10 backdrop-blur-xl relative z-10 rounded-2xl');
            
            const traitConfig = [
                { k: 'relationship', n: 'Relationship', e: '❤️', color: '#f43f5e', text: 'text-rose-500' },
                { k: 'community', n: 'Community', e: '🤝', color: '#22d3ee', text: 'text-cyan-400' },
                { k: 'karma', n: 'Karma', e: '✨', color: '#fbbf24', text: 'text-amber-400' },
                { k: 'confidence', n: 'Confidence', e: '🛡️', color: '#818cf8', text: 'text-indigo-400' },
                { k: 'motivation', n: 'Motivation', e: '⚡', color: '#34d399', text: 'text-emerald-400' },
                { k: 'happiness', n: 'Happiness', e: '☀️', color: '#fb923c', text: 'text-orange-400' }
            ];
            
            traitConfig.forEach(t => {
                const val = game.traits[t.k];
                const isHighPerformance = val >= 75;
                
                // CSS for the circular progress ring using conic-gradient
                const ringStyle = `background: conic-gradient(${t.color} ${val}%, transparent 0)`;
                const glowStyle = isHighPerformance ? `box-shadow: 0 0 20px ${t.color}66` : '';

                traitsBar.innerHTML += `
                    <div class="flex flex-col items-center group">
                        <!-- Circular Ring Visual -->
                        <div class="relative w-16 h-16 rounded-full flex items-center justify-center mb-2 transition-transform duration-500 group-hover:scale-110" style="${glowStyle}">

                            <div class="absolute inset-0 rounded-full opacity-80" style="${ringStyle}; mask-image: radial-gradient(transparent 58%, black 60%); -webkit-mask-image: radial-gradient(transparent 58%, black 60%);"></div>
                            <!-- Overdrive Animation for high scores -->
                            ${isHighPerformance ? `<div class="absolute inset-0 rounded-full border-2 border-white/20 animate-ping"></div>` : ''}
                            
                            <span class="text-2xl drop-shadow-md z-10">${t.e}</span>

                        <span class="text-[9px] font-black ${t.text} uppercase tracking-tighter mb-0.5">${t.n}</span>
                        <span class="text-lg font-black text-white italic leading-none">${val}</span>
                    </div>
                `;
            });
            container.appendChild(traitsBar);

            // --- 3. Central Scenario Content ---
            const scenarioBox = createElement('div', 'flex-1 flex flex-col items-center justify-center text-center space-y-6 py-4 relative z-10');
            scenarioBox.innerHTML = `

                    </p>
                </div>
            `;
            container.appendChild(scenarioBox);

            // --- 4. Choice Buttons ---
            const choiceContainer = createElement('div', 'grid grid-cols-1 gap-3 w-full max-w-lg mx-auto pb-6 relative z-10');
            scenario.choices.forEach((choice) => {
                const btn = createElement('button', 'group relative p-0.5 transition-all transform hover:scale-[1.02] active:scale-95');
                btn.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-xl opacity-10 group-hover:opacity-100 transition-opacity blur-sm"></div>
                    <div class="relative bg-zinc-900/90 border border-white/10 group-hover:border-cyan-400 p-4 rounded-xl flex items-center justify-between overflow-hidden">
                        <span class="text-base font-black uppercase italic text-zinc-400 group-hover:text-white transition-colors pr-6">
                            ${choice.text}
                        </span>
                        <div class="flex items-center shrink-0">
                            <div class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group-hover:bg-cyan-500 group-hover:text-black transition-all">
                                <span class="text-sm">▶</span>
                            </div>
                        </div>
                    </div>
                `;
                btn.onclick = () => handleChoice(choice);
                choiceContainer.appendChild(btn);
            });
            container.appendChild(choiceContainer);

            // Final Touch: Decorative Scanline
            const scanline = createElement('div', 'absolute inset-0 pointer-events-none opacity-[0.02] z-50 bg-[linear-gradient(rgba(18,16,16,0)50%,rgba(0,0,0,0.25)50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_2px,3px_100%]');
            container.appendChild(scanline);

            return container;
        }
                
     function handleChoice(choice) {
            const deltas = [];
            
            // 1. Calculate and update trait changes immediately
            for (const [trait, value] of Object.entries(choice.impact)) {
                const oldVal = game.traits[trait];
                game.traits[trait] = Math.min(100, Math.max(0, oldVal + value));
                
                const emojiMap = { relationship: '❤️', community: '🤝', karma: '✨', confidence: '🛡️', motivation: '⚡', happiness: '☀️' };
                const nameMap = { relationship: 'Relationship', community: 'Community', karma: 'Karma', confidence: 'Confidence', motivation: 'Motivation', happiness: 'Happiness' };
                deltas.push({ name: nameMap[trait], emoji: emojiMap[trait], value });
            }

            const reasoning = choice.resolution_reasoning || "Your decision ripples through the city.";

            // 2. Control Flow: Video FIRST, Feedback SECOND
            if (choice.video) {
                // Save the impact info to be shown after the video ends
                game.deferredFeedback = { reasoning, deltas };
                // Trigger movie, specifying we want to return to Phase 24 (Scenario screen)
                playMovie(choice.video, reasoning, 24);
            } else {
                // No video? Just show results and then advance
                showImpactFeedback(reasoning, deltas, () => {
                    advanceScenario();
                });
            }
        }


       function showImpactFeedback(reasoning, deltas, callback) {
            reasoning = null;
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 z-[2000] flex items-center justify-center bg-black/95 backdrop-blur-xl animate-in fade-in duration-700";
            overlay.id = 'trait-impact-overlay';
            
            let rowsHtml = '';

        function triggerFinale(choice) {
            // Final Impact Logic
            if (choice === 'FRIENDSHIP_VISIT') { 
                game.traits.relationship = Math.min(100, game.traits.relationship + 10); 
                game.traits.community = Math.min(100, game.traits.community + 10); 
            }
            if (choice === 'FRIENDSHIP_HEAL') { 
                game.traits.confidence = Math.min(100, game.traits.confidence + 15); 
                game.traits.motivation = Math.min(100, game.traits.motivation + 15); 
            }

            // Branch A: Direct Triggers
            if (choice === 'MARRIAGE')  return renderFinaleScreen('MARRIAGE', './videos/chapter3-end-marry.mp4');
            if (choice === 'TROUBADOUR')  return renderFinaleScreen('TROUBADOUR', './videos/chapter3-end-marryno.mp4');

            // Branch B: Threshold Triggers
            const t = game.traits;
            if (t.motivation < 40 || t.confidence < 40)  return renderFinaleScreen('CORPORATE', './movies/chapter3-end-apex.mp4');
            if (t.karma >= 75 && t.motivation >= 70) return renderFinaleScreen('ACTIVIST', './videos/chapter3-end-global.mp4');
            if (t.community >= 75 && t.karma >= 65)  return renderFinaleScreen('BESTIE', './videos/chapter3-end-bestie.mp4');
            if (t.happiness >= 70 && t.confidence >= 65)  return renderFinaleScreen('BACHELOR', './videos/chapter3-end-bachelor.mp4');
            
            return renderFinaleScreen('GHOST', './videos/chapter3-end-ghost.mp4');
        }

   function renderGame() {
        // Clear the main container
        container.innerHTML = '';
        // Use glass-panel if I want the botton menu to adjust as much as possible and float to the min height
        const unifiedWrapper = createElement('div', 'w-full h-full flex flex-col phase-container-bg max-w-2xl mx-auto relative');

        // 2. Create the Phase Container
        const phaseContainer = createElement('div', 'flex-1 relative w-full bg-gray-900/30  rounded-2xl border border-white/10 p-2 overflow-y-auto flex flex-col');

        let contentElement;
        switch (game.phase) {
            case -1: contentElement = renderMainMenu(); break;
            case 0: contentElement = renderPhase0(); break; 
            case 1: contentElement = renderMissionScreen(); break;
            case 2: contentElement = renderPhase2(); break;
            case 3: contentElement = renderPhase3(); break;
            case 4: contentElement = renderAmoeba(); break;
            case 5: contentElement = renderLocation();break;
            case 6: contentElement = renderConfig(); break;
            case 7: contentElement = renderPhase7(); break;
            case 8: contentElement = renderPhase8(); break;
            case 9: contentElement = renderPhase9(); break;
            case 10: contentElement = renderMap(); break;
            case 11: contentElement = renderPhase11(); break;
            case 12: contentElement = renderPhase12(); break;
            case 13: contentElement = renderPhase13(); break;
            case 14: contentElement = renderInventory(); break;
            case 15: contentElement = renderItem(); break;
            case 16: contentElement = renderPhone(); break;
            case 17: contentElement = renderChops(); break;
            case 18: contentElement = renderPhase_setup(); break;
            case 19: contentElement = renderCliffs(); break;
            case 20: contentElement = renderPoker(); break;
            case 21: contentElement = renderScrapbook(); break;
            case 22: contentElement = renderCode();break;
            case 23: contentElement = renderChapterTwoIntro();break;
            case 24: contentElement = renderScenarioScreen(); break;
            case 25: contentElement = renderChapterThreeIntro();break;
            case 99: contentElement = renderCinematic(); break;
            case 100: contentElement = startCinematic(); break;
            default:
                contentElement = createElement('div', 'flex flex-col items-center justify-center p-8', 'SYSTEM ERROR: STATE UNKNOWN');
                const b = createElement('button', 'metal-button mt-4', 'REBOOT TO MENU');
                b.onclick = () => setPhase(0, '');
                contentElement.appendChild(b);
        }

        // Append the content to the phase container
        if (contentElement) {
            phaseContainer.appendChild(contentElement);
        }
        
        unifiedWrapper.appendChild(phaseContainer);

        // 3. Message Bar
        if (game.message) {
            const messageBar = document.createElement('div');
            messageBar.className = 'mt-2 py-1 px-3 text-xs text-center rounded bg-black/40 text-cyan-400 border border-cyan-900/30 shrink-0';
            messageBar.textContent = game.message;
            unifiedWrapper.appendChild(messageBar);
        }

        // 4. Navigation Bar (The Icon Row)
        const validPhases = [1, 4, 14, 15, 16, 17, 19, 5, 8, 20, 7, 9, 11, 13];
        if ((game.phase === 10) || validPhases.includes(game.phase)) {
            // Add padding to the wrapper so the fixed nav doesn't cover content
            // Alternatively, we add a spacer div at the end of the flex column
            const iconRow = getIconRow();
            unifiedWrapper.appendChild(iconRow);
            
            // Add a spacer to push content up above the fixed nav
            const spacer = createElement('div', 'h-20 w-full shrink-0');
            unifiedWrapper.appendChild(spacer);
        }

        container.appendChild(unifiedWrapper);

        // Handle Map-specific logic
        if (game.phase === 10) {
            if (game.startGame) {
                game.startGame = false;
            } else {
                // Ensure renderLandmarks is called after DOM is ready
                setTimeout(() => renderLandmarks(0), 0);
            }
        }
    }
