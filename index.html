        // --- Utility Functions ---

        /**
         * Simple Base64 decoding utility (needed for exponential backoff)
         */
        const base64ToArrayBuffer = (base64) => {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes.buffer;
        };

        /**
         * Exponential backoff retry loop for API calls.
         * @param {Function} fetcher - The function that performs the fetch request.
         * @param {number} maxRetries - Maximum number of retries.
         */
        async function fetchWithRetry(fetcher, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetcher();
                    if (!response.ok) {
                        // Throw error if response is not 2xx
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response;
                } catch (error) {
                    console.error(`Attempt ${i + 1} failed:`, error.message);
                    if (i === maxRetries - 1) throw error; // Re-throw if last attempt failed
                    
                    // Wait 2^i * 1000ms
                    const delay = Math.pow(2, i) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }


        async function initializeLLM(){
            updateState({ message: 'SYSTEM: Loading Machine Core...', isLoading: true, error: null });

            try {
          

                read_wordle = await fetch('./wordle.txt');
                if (!read_wordle.ok) throw new Error(`HTTP error! status: ${read_wordle.status}`);

                // Fetch, split, trim, and filter in one chain
                game.words = (await read_wordle.text())
                    .split('\n')
                    .map(t => t.trim())
                    .filter(t => t.length > 0);

                read_midis = await fetch('./midis_list.txt');
                if (!read_midis.ok) throw new Error(`HTTP error! status: ${read_midis.status}`);

                // Fetch, split, trim, and filter in one chain
                game.midis = (await read_midis.text())
                    .split('\n')
                    .map(t => t.trim())
                    .filter(t => t.length > 0);


                updateState({ 
                message: 'Loading model...',
                isLoading: true
                });
                

                updateState({ 
                    isLLMLoaded: true, 
                    message: 'CORE ONLINE. Ready to Challenge.', 
                    isLoading: false 
                });
               
                renderGame()

            } catch (e) {
                console.error("Failed to initialize WebLLM or load model weights. Check WebGPU support.", e);
                updateState({ 
                    error: `Initialization Failure: ${e.message}. Check Network.`, 
                    message: 'FATAL ERROR.', 
                    isLoading: false 
                });
            }  
                
        }

        async function getTopics() {
            if (game.score >=200001) return; // Win check

            updateState({ 
                isLoading: true, 
                currentTopic: '', 
                questionData: null, 
                selectedAnswer: null, 
                topics: [], 
                phase: 2,
                message: 'QUERYING SYSTEM for next target...'
            });

            try {

                //console.log("Fetching topics from ./topics.txt...");
                const res = await fetch('./topics.txt');
                
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                
                // Fetch, split, trim, and filter in one chain
                arr = (await res.text())
                    .split('\n')
                    .map(t => t.trim())
                    .filter(t => t.length > 0);

                if (arr.length < 2) throw new Error("File contains less than 2 valid topics.");
                // console.log(`Successfully loaded ${arr.length} topics.`);
                const length = arr.length;
                let index1 = Math.floor(Math.random() * length);
                let index2 = index1;
                
                while (index1 === index2) index2 = Math.floor(Math.random() * length);

                topics = [arr[index1], arr[index2]];

            } catch (error) {
                console.error("Failed to load topics. Using defaults.", error);
                // 'arr' remains 'defaultTopics' if the try block fails
            }
            try{
                if (topics.length >= 2) {
                    updateState({ 
                        topics: topics.slice(0, 2),
                        message: 'TWO TARGETS IDENTIFIED.',
                        isLoading: false
                    });
                } else {
                    throw new Error('LLM returned insufficient topics.');
                }
            }
            catch (e) {
                updateState({ 
                    error: `Topic Generation Error: ${e.message}`, 
                    message: 'SYSTEM ABORTED TOPIC GENERATION.',
                    isLoading: false
                });
            }
        }

        /**
         * Calls LLM to generate a question, correct answer, and 3 wrong answers.
         */
        async function generateTriviaQuestion(topic) {
            updateState({ 
                isLoading: true, 
                currentTopic: topic, 
                questionData: null, 
                phase: 3, 
                message: `GENERATING QUESTION on: ${topic.toUpperCase()}...` 
            });

            const responseSchema = {

                  "additionalProperties": false,
                  "properties": {

                    "wrongAnswers": {
                      "type": "array",
                      "description": "An array containing exactly three plausible, incorrect answers.",
                      "items": { "type": "string", "minLength": 1 },
                      "minItems": 3,
                      "maxItems": 3,
                      "uniqueItems": true
                    },
                    "correctAnswer": { "type": "string", "minLength": 1, "description": "The single, correct answer to the question." }
                  },
                  "required": ["question", "wrongAnswers", "correctAnswer"]
                }

                question: "Which gas is most responsible for the greenhouse effect on Earth?",
                wrongAnswers: ["Oxygen", "Hydrogen", "Ozone"],
                correctAnswer: "Carbon dioxide"
              };
            const responseSchemaStr= JSON.stringify(responseSchema, null, 2);

            The resulting output must have:

            Exactly THREE plausible but incorrect answers (wrongAnswers array size must be 3). Do not repeat answers.

            GENERATE THE FINAL JSON OBJECT ONLY

        function renderPhase7() {
        // --- Local Wordle Game State ---
            const targetWord = game.words[Math.floor(Math.random() * game.words.length)];

            let guesses = []; // Array of {word: '...', result: ['absent', 'present', 'correct', ...]}
            let currentGuess = '';
            let gameStatus = 'playing'; // 'playing', 'win', 'lose'
            let localMessage = game.message; // Use initial global message
            let availableKeys = {}; // Tracks key status for keyboard colors

            // --- Utility Functions ---

            function updateUI() {
                const contentDiv = document.getElementById('wordle-content');
                if (!contentDiv) return;

                // 1. Update the message
                const messageEl = document.getElementById('wordle-message');
                if (messageEl) messageEl.textContent = localMessage;

                // 2. Update the grid
                const gridHtml = Array(6).fill(0).map((_, rowIdx) => {
                    const rowData = guesses[rowIdx];
                    let rowContent = '';
                    for (let i = 0; i < 5; i++) {
                        let letter = '';
                        let className = 'box-empty';

                        if (rowData) {
                            // Previous guess
                            letter = rowData.word[i];
                            className = `box-${rowData.result[i]}`;
                        } else if (rowIdx === guesses.length) {
                            // Current guess
                            letter = currentGuess[i] || '';
                            className = currentGuess[i] ? 'box-current' : 'box-empty';
                        }

                        rowContent += `<div class="wordle-box ${className}">${letter}</div>`;
                    }
                    return `<div class="wordle-row">${rowContent}</div>`;
                }).join('');

                const gridEl = document.getElementById('wordle-grid');
                if (gridEl) gridEl.innerHTML = gridHtml;

                // 3. Update the keyboard
                const keyElements = document.querySelectorAll('.key-button');
                keyElements.forEach(keyEl => {
                    const key = keyEl.getAttribute('data-key');
                    keyEl.className = `key-button ${availableKeys[key] ? `key-${availableKeys[key]}` : ''}`;

                    // Disable keys if game over
                    if (gameStatus !== 'playing') {
                        keyEl.disabled = true;
                    } else {
                        keyEl.disabled = false;
                    }
                });
            }

            function checkGuess(guess) {
                guess = guess.toLowerCase()
                if (guess.length !== 5) {
                    localMessage = 'ERROR: Word must be 5 letters.';
                    updateUI();
                    return;
                }

                        //Dictionary Check ---
                if (!game.words.includes(guess)) {
                    //console.log('Guess:', guess)
                    localMessage = `ERROR: "${guess}" is not in the dictionary.`;
                    currentGuess = ''; // Clear guess to force re-entry
                    updateUI();
                    return;
                }

                const result = Array(5).fill('absent');
                const targetMap = {};
                for (const char of targetWord) {
                    targetMap[char] = (targetMap[char] || 0) + 1;
                }

                // Pass 1: Check for correct (green)
                for (let i = 0; i < 5; i++) {
                    if (guess[i] === targetWord[i]) {
                        result[i] = 'correct';
                        targetMap[guess[i]]--;
                        availableKeys[guess[i]] = 'correct';
                    }
                }

                // Pass 2: Check for present (yellow)
                for (let i = 0; i < 5; i++) {
                    if (result[i] !== 'correct') {
                        if (targetMap[guess[i]] > 0) {
                            result[i] = 'present';
                            targetMap[guess[i]]--;
                            if (availableKeys[guess[i]] !== 'correct') {
                                availableKeys[guess[i]] = 'present';
                            }
                        } else {
                            if (!availableKeys[guess[i]]) {
                                availableKeys[guess[i]] = 'absent';
                            }
                        }
                    }
                }

                guesses.push({ word: guess, result: result });
                currentGuess = '';

                if (guess === targetWord) {
                    gameStatus = 'win';
                    const scoreIncrease = 500 - (guesses.length * 50); // Better score for fewer guesses
                    game.score += scoreIncrease;
                    localMessage = `WIN! ${targetWord} was the word. You earned $${scoreIncrease}! Returning to menu...`;
                    updateUI(); // Update UI for next gue
                    setTimeout(returnToMainMenu, 3500);
                } else if (guesses.length >= 6) {
                    gameStatus = 'lose';
                    localMessage = `DEFEAT! The word was ${targetWord}. Returning to menu...`;
                    updateUI(); // Update UI for next gue
                    setTimeout(returnToMainMenu, 3500);
                } else {
                    localMessage = 'Guess submitted. Try again.';
                    updateUI(); // Update UI for next gue
                }

                updateUI();
            }

            function handleKey(key) {
                if (gameStatus !== 'playing') return;

                key = key.toUpperCase();

                if (key === 'ENTER') {
                    checkGuess(currentGuess);
                } else if (key === 'BACKSPACE') {
                    currentGuess = currentGuess.slice(0, -1);
                    localMessage = 'Guess the 5-letter word!';
                    updateUI();
                } else if (key.length === 1 && key.match(/[A-Z]/)) {
                    if (currentGuess.length < 5) {
                        currentGuess += key;
                        localMessage = 'Guess the 5-letter word!';
                        updateUI();
                    }
                }
            }

            function returnToMainMenu() {
                // Return to the main menu (Phase 0) as requested.
                setPhase(0, `Wordle challenge complete. Target word was: ${targetWord}. Score: $${game.score}.`);
            }

            // --- Event Listener Setup ---

            function setupEventListeners() {
                // Keyboard click handler
                const keyboardContainer = document.getElementById('keyboard-container');
                if(keyboardContainer) {
                    keyboardContainer.addEventListener('click', (e) => {
                        const keyButton = e.target.closest('.key-button');
                        if (keyButton) {
                            handleKey(keyButton.getAttribute('data-key'));
                        }
                    });
                }


                // Physical keyboard handler
                // Store the handler on the window so we can remove it later (in setPhase)
                window.wordleKeyHandler = (e) => {
                    if (game.phase === 7) { // Only handle keys in Phase 7
                        const key = e.key;
                        if (key === 'Enter') {
                            e.preventDefault();
                            handleKey('ENTER');
                        } else if (key === 'Backspace') {
                            handleKey('BACKSPACE');
                        } else if (key.match(/^[a-zA-Z]$/)) {
                            handleKey(key.toUpperCase());
                        }
                    }
                };
                document.addEventListener('keydown', window.wordleKeyHandler);
            }

            // --- Render Structure ---

            const wordleContainer = createElement('div', 'flex flex-col items-center justify-start h-full p-4 space-y-6');
            wordleContainer.id = 'wordle-content';

            // Title
            const title = createElement('h3', 'text-4xl font-extrabold title-font text-yellow-400 text-center', 'WORDLE CHALLENGE');
            wordleContainer.appendChild(title);

            // Message
            const messageEl = createElement('p', 'text-xl font-bold text-gray-300 text-center min-h-[40px]', localMessage);
            messageEl.id = 'wordle-message';
            wordleContainer.appendChild(messageEl);

            // Grid Placeholder
            const gridDiv = createElement('div', 'wordle-grid mb-6');
            gridDiv.id = 'wordle-grid';
            wordleContainer.appendChild(gridDiv);

            // Keyboard Layout
            const keyboardContainer = createElement('div', 'w-full max-w-lg');
            keyboardContainer.id = 'keyboard-container';

            const keyboardKeys = [
                ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACKSPACE']
            ];

            keyboardKeys.forEach(row => {
                const rowEl = createElement('div', 'keyboard-row');
                row.forEach(key => {
                    const keyEl = createElement('button', 'key-button', key === 'BACKSPACE' ? 'DEL' : key);
                    keyEl.setAttribute('data-key', key);
                    keyEl.style.flexGrow = (key === 'ENTER' || key === 'BACKSPACE') ? 1.5 : 1;
                    rowEl.appendChild(keyEl);
                });
                keyboardContainer.appendChild(rowEl);
            });
            wordleContainer.appendChild(keyboardContainer);

            // Initialize UI and listeners immediately after the DOM is rendered
            setTimeout(() => {
                updateUI();
                setupEventListeners();
            }, 0);

            return wordleContainer;
        }
    


        async function playMusicChallenge() {
            if (game.synth) {
                stopMusic();
            }
            
            await Tone.start();

            // 3. Setup Audio Chain: Synth -> Gain -> Limiter -> Destination
            const limiter = new Tone.Limiter(-6).toDestination();
            // Reduced gain to 0.5 to provide more headroom and prevent polyphonic clipping
            const gain = new Tone.Gain(0.5).connect(limiter); 
            
            // Setup PolySynth
            const newSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" }, 
                envelope: { 
                    attack: 0.02, 
                    decay: 0.1, 
                    sustain: 0.2, 
                    release: 0.3 
                }
            }).connect(gain); 
            
            game.synth = newSynth; // Store the synth instance

            // 4. Setup Sequence
            const pattern = new Tone.Sequence((time, note) => {
                // Crucial fix: Use "16n" duration instead of "8n" for a tighter, non-overlapping sound.
                newSynth.triggerAttackRelease(note, "16n", time); 
            }, [["C3", "G3"], ["C3", "F3"], ["C3", "A3"], ["C3", "G3"]], "4n").start(0);
            
            game.pattern = pattern; // Store the sequence instance
            
            // 5. Start Transport
            Tone.Transport.bpm.value = 120; 
            Tone.Transport.start();
        }

        /**
         * Stops the Tone.js transport and disposes of the synth.
         */
        function stopMusic() {
            if (game.synth) {
                Tone.Transport.stop();
                Tone.Transport.cancel();
                game.synth.dispose();
                game.synth = null;
            }
        }
  
        function startPhase8Challenge() {
            game.challengeActive = true;
            
            // 1. Pick a random MIDI entry and parse X/Y.midi format
            const rawIndex = Math.floor(Math.random() * game.midis.length);
            const rawMidi = game.midis[rawIndex]; // e.g., "Iron_Maiden/The_Trooper.midi"

            const parts = rawMidi.split('/');
            const bandRaw = parts[0]; // "Iron_Maiden"
            const songRaw = parts[1].replace('.midi', ''); // "The_Trooper"

            game.currentBand = bandRaw.replace(/_/g, ' ');
            game.currentSong = songRaw.replace(/_/g, ' ');
            game.timer = 30; // Reset timer

            // 2. Play the audio track
            playMusicChallenge();

            // 3. Start the countdown
            startTimer();

            // 4. Update message
            game.message = `Now streaming: ${game.currentSong}. GUESS THE BAND in 30 seconds!`;
            renderGame(); // Force full re-render to display challenge UI
        }

        function startTimer() {
            if (game.timerInterval) {
                clearInterval(game.timerInterval);
            }
            
            game.timerInterval = setInterval(() => {
                game.timer--;
                
                // Update timer element directly to avoid full UI rebuild
                const countdownEl = document.getElementById('countdown-display');
                if (countdownEl) {
                    countdownEl.innerText = game.timer;
                    const parentDiv = countdownEl.closest('.p-3');
                    if(parentDiv) {
                         // Apply visual warning when time is low
                         parentDiv.className = `p-3 w-40 text-center rounded-lg mono-font text-4xl font-bold bg-red-800 border-2 shadow-xl ${game.timer <= 10 ? 'border-yellow-500 text-yellow-300 music-pulse' : 'border-red-500 text-white'}`;
                    }
                }

                if (game.timer <= 0) {
                    clearInterval(game.timerInterval);
                    handleGuessSubmission(true); // Treat as a loss due to timeout
                }
            }, 1000);
        }

        function handleGuessSubmission(isTimeout = false) {
            const inputElement = document.getElementById('guess-input');
            const playerGuess = inputElement ? inputElement.value.trim().toLowerCase() : '';

            if (!game.challengeActive && !isTimeout) return; 

            stopMusic();
            clearInterval(game.timerInterval);
            game.challengeActive = false;
            
            const correctBand = game.currentBand.toLowerCase();
            let resultMessage = '';

            if (isTimeout) {
                game.score -= 50;
                resultMessage = `TIME OUT! Challenge Failed. You lose 50 points. Correct: ${game.currentBand}.`;
            } else if (playerGuess === correctBand) {
                game.score += 1000;
                resultMessage = `CORRECT! +1000 Points. Band: ${game.currentBand}.`;
            } else {
                game.score -= 50;
                resultMessage = `INCORRECT. -50 Points. Correct Band: ${game.currentBand}.`;
            }

            game.message = resultMessage;
            
            // Wait 3 seconds, then move to the menu
            setTimeout(() => {
                game.phase = 0;
                game.message = "Challenge complete. Returning to System Menu.";
                renderGame();
            }, 3000);

            renderGame(); // Immediate update with result message
        }

                    <div class="w-32 h-32 rounded-full border-4 border-yellow-400 flex items-center justify-center mx-auto record-spin bg-gray-900 ${game.challengeActive ? 'music-pulse' : ''}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-red-500">
                            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M7.75 16.25l-2.5 2.5"/><path d="M16.25 7.75l2.5-2.5"/><path d="M16.25 16.25l2.5 2.5"/><path d="M7.75 7.75l-2.5-2.5"/>
                        </svg>
                    </div>
                    <p class="text-xl title-font ${game.challengeActive ? 'text-yellow-400' : 'text-gray-400'}">AUDIO TRACK ${game.challengeActive ? 'LIVE' : 'STOPPED'}</p>
                    <p class="text-xs mono-font text-gray-500">${game.currentSong} (Simulated MIDI)</p>
                </div>

                <!-- Timer -->
                <div class="p-3 w-40 text-center rounded-lg mono-font text-4xl font-bold bg-red-800 border-2 shadow-xl ${game.timer <= 10 && game.challengeActive ? 'border-yellow-500 text-yellow-300 music-pulse' : 'border-red-500 text-white'}">
                    <span id="countdown-display">${game.timer}</span>s
                </div>

                <!-- Input Field -->
                <div class="w-full max-w-md space-y-4">
                    <label for="${inputId}" class="block text-lg font-semibold text-electric-cyan title-font">GUESS THE ARTIST/BAND NAME:</label>
                    <input type="text" id="${inputId}" class="w-full p-4 text-xl text-white bg-gray-900 border-2 border-electric-cyan rounded-lg mono-font focus:ring-4 focus:ring-electric-blue focus:border-electric-blue" placeholder="Type your answer here..." value="${currentValue}" ${isDisabled ? 'disabled' : ''}>
                    <button id="submit-button" class="w-full neon-button py-3 text-xl rounded-lg" onclick="handleGuessSubmission()" ${isDisabled ? 'disabled' : ''}>
                        SUBMIT GUESS
                    </button>
                    <p class="text-sm text-gray-400 text-center">Challenge ends automatically on timeout or incorrect guess.</p>
                </div>
            `;
            
            // Attach event listener for Enter key and set focus
            if (!isDisabled) {
                setTimeout(() => {
                    const input = document.getElementById(inputId);
                    if (input) {
                        input.focus();
                        // Only add keypress listener if game is active
                        input.addEventListener('keypress', (e) => {
                            if (e.key === 'Enter') {
                                document.getElementById('submit-button').click();
                            }
                        });
                    }
                }, 0);
            }
            
            return div;
        }

        function renderPhase9() {
        


        }  

    /**
     * Main render function: builds the entire UI based on game state.
     */
    function renderGame() {
        if (game.score >= 20001) {
            appContainer.innerHTML = '';
            appContainer.appendChild(renderWinScreen());
            return;
        }

        // Game Panels Structure
        appContainer.innerHTML = `
            <div class="flex w-full metal-card min-h-[700px]">
                <!-- LEFT PANEL: Conductor Info -->
                <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-between border-r-4 border-electric-cyan">
                    <div class="text-center space-y-3">
                        <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 title-font text-electric-cyan">A.I. CONDUCTOR</h3>
                        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-electric-cyan speed-icon">
                            <path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M9 10h.01"/><path d="M15 10h.01"/>
                        </svg>
                        <div class="text-sm font-mono mt-4 p-2 bg-gray-700 rounded-lg border border-electric-cyan/50">
                            <p>STATUS: ${game.isLoading ? 'LOADING' : 'IDLE'}</p>
                            <p>PHASE: ${game.phase}</p>
                        </div>
                    </div>
                    <div class="text-center text-xs text-gray-500">
                        <p>Lux Aeterna!</p>
                    </div>
                </div>

                <!-- CENTER PANEL: Game Interaction -->
                <div id="center-panel" class="flex-1 p-6 flex flex-col justify-between">
                    <h2 class="text-4xl font-extrabold text-white mb-4 text-center title-font">
                        ${game.phase > 1 ? 'LIVE CHALLENGE INTERFACE' : (game.phase === 0 ? 'SYSTEM MENU' : 'BOOT SEQUENCE')}
                    </h2>
                    
                    <!-- Game Message Panel -->
                    <div class="p-4 mb-6 text-center rounded-sm font-semibold shadow-md bg-electric-blue/20 text-electric-cyan border border-electric-blue">
                        ${game.message}
                    </div>

                    <!-- Dynamic Phase Content Placeholder -->
                    <div id="dynamic-content" class="flex-1"></div>
                </div>

                <!-- RIGHT PANEL: Player Info -->
                <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-between border-l-4 border-electric-cyan">
                    <div class="text-center space-y-3">
                        <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 title-font text-electric-cyan">PLAYER DATA</h3>
                        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-yellow-400 speed-icon">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                        <div class="mt-4 p-3 bg-gray-700 rounded-lg border border-yellow-400/50 shadow-xl">
                            <p class="text-sm font-mono text-gray-400">SCORE REGISTER</p>
                            <p class="text-4xl font-extrabold text-yellow-400 title-font">$${game.score}</p>
                            <p class="text-xs text-gray-200">TARGET: $1000</p>
                        </div>

                        <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                            <p class="text-sm font-mono text-gray-400 mb-2">INVENTORY</p>
                            <div id="inventory-display" class="grid grid-cols-4 gap-2">
                                ${game.purchasedItems.length === 0 
                                    ? '<p class="text-xs text-gray-500 italic col-span-4">No items acquired.</p>'
                                    : game.purchasedItems.map(item => `
                                        <div class="p-1 text-center bg-gray-600 rounded-md border border-electric-cyan/70 hover:bg-gray-500" title="${item.name}">
                                            <span class="text-2xl">${item.icon}</span>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                    <div class="text-center text-xs text-gray-500">
                        <p>Chase that light!</p>
                    </div>
                </div>
            </div>
        `;
        
        // Render phase-specific content
        const dynamicContent = document.getElementById('dynamic-content');
        dynamicContent.innerHTML = '';
        
        let contentElement;
        switch (game.phase) {
            case 0:
                contentElement = renderPhase0();  //  Menu
                break;
            case 1:
                contentElement = renderPhase_boot(); // Original Phase 1
                break;
            case 2:
                contentElement = renderPhase2(); // show 2 topics
                break;
            case 3:
                contentElement = renderPhase3(); // show trivia question
                break;
            case 4:
                contentElement = renderPhase4(); // New Shop Phase
                break;
            case 5:
                contentElement = renderPhase5(); // New Instructions Phase
                break;
            case 6:
                contentElement = renderPhase6();
                break;
            case 7:
                contentElement = renderPhase7(); // Wordle Game!
                break;
            case 8:
                contentElement = renderPhase8(); // Midi Game!
                break;
            case 9:
                contentElement = renderPhase9(); // Just One!
                break;
            default:
                const topicContent = createElement('div', 'flex flex-col items-center justify-center h-full space-y-8 p-8', 'UNKNOWN GAME STATE');
                const backButton = createElement('button', 'metal-button px-6 py-2 text-lg mt-8 bg-gray-600 hover:bg-gray-700', 'RETURN TO MENU');
                backButton.onclick = () => setPhase(0, 'Main Menu. Ready for the next challenge.');
                topicContent.appendChild(backButton);
                return topicContent;
        }
        dynamicContent.appendChild(contentElement);
    }

    // Initialize the game when the window loads
    window.onload = initializeLLM;
    </script>
</body>
</html>
