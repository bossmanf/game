                chopItem.appendChild(progressGroup);
                chopList.appendChild(chopItem);
            });

            documentContainer.appendChild(chopList);
            
            // Append document to the main content wrapper
            chopContent.appendChild(documentContainer);

            // Back button retains the metal style as it's outside the "paper" area
            const backButton = createElement('button', 'metal-button w-full max-w-xs py-3 text-lg mt-12 bg-gray-600 hover:bg-gray-700', 'BACK TO MENU');
            backButton.onclick = () => setPhase(0, 'Returning to Main Menu.');
            chopContent.appendChild(backButton);

            return chopContent;
        }

        function reloadCurrentLocation() {
            const output = document.getElementById(MAIN_OUTPUT_ID);
            
            // Debugging: Check if the element is found.
            if (!output) {
                console.error(`[DEBUG ERROR] Critical element missing: Cannot find element with ID: ${MAIN_OUTPUT_ID}. Reload aborted.`);
                return;
            }

            const actionFunc = actionRegistry[currentContext.data.actionKey];
            
            if (output && actionFunc) {
                output.innerHTML = actionFunc(currentContext.name, currentContext.data);                  
            }


            // Clear the status bar explicitly after re-rendering the view
            const statusBar = document.getElementById('status-bar-output');
            if (statusBar) {
                statusBar.innerHTML = '<p class="italic">Select an item or topic to query ' + game.names.bestie + '.</p>';
            }

            
            
        }

    function renderWinScreen() {
        const winContent = createElement('div', 'flex flex-col items-center justify-center h-full text-center bg-gray-800 p-10 rounded-xl shadow-2xl');
        winContent.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-electric-cyan mb-6 speed-icon">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>
            </svg>
            <h3 class="text-5xl font-extrabold title-font text-electric-cyan">SYSTEM OVERRIDE!</h3>
            <p class="text-2xl text-gray-300 mt-4">MACHINE DEFEATED. FINAL SCORE: $${game.score}</p>
        `;
        const restartButton = createElement('button', 'metal-button w-2/3 py-4 text-xl mt-8 bg-red-600 hover:bg-red-700', 'REBOOT CHALLENGE');
        restartButton.onclick = () => window.location.reload();
        winContent.appendChild(restartButton);
        return winContent;
    }

        

    /**
     * Main render function: builds the entire UI based on game state.
     */
    window.renderGame = function() {
        if (game.score >= 20001) {
            appContainer.innerHTML = '';
            appContainer.appendChild(renderWinScreen());
            return;
        }

        // --- 1. Calculate Progression ---
        const progression = getLevelProgression();
        const chopMax = progression.currentChopMax; // Get dynamic max for chop bars

        // --- 2. Define chop colors ---
        const chopColorMap = {
            "Social Influence": { bg: 'bg-blue-500', text: 'text-blue-400' },
            "Circuit Navigation": { bg: 'bg-yellow-500', text: 'text-yellow-400' },
            "Rhythm Mastery": { bg: 'bg-red-500', text: 'text-red-400' },
            "Instrument Synergy": { bg: 'bg-green-500', text: 'text-green-400' },
            "Lyrical Flow": { bg: 'bg-purple-500', text: 'text-purple-400' },
            "Stage Presence": { bg: 'bg-pink-500', text: 'text-pink-400' }
        };

          const chopsHtml = game.chops
                .filter(chop => chop.isUnlocked ) // Filter chops that are unlocked and have points
                .map(chop => { 
                    const chopName = chop.name;
                    const chopValue = chop.points;
                    const color = chopColorMap[chopName];

                    if (!color) {
                        console.error(`Missing color definition for chop: ${chopName}`);
                        return ''; // Skip rendering this chop
                    }

                    // Individual Chop Bar calculation uses the dynamic chopMax
                    const percentage = Math.min(100, Math.max(0, (chopValue / chopMax) * 100));
                    
                    return `
                        
                        <div class="mt-4 p-3 bg-gray-800 rounded-lg border-2 border-neon-pink/70 w-full text-center">
                            <div class="flex justify-between items-center text-xs font-mono text-gray-50">
                                <span class="${color.text} font-bold tracking-wide text-sm">${chop.icon} </span>
                                <span class="text-gray-100 text-sm">${chopValue} / ${chopMax} </span>
                            </div>
                            <div class="w-full bg-gray-300 rounded-full h-2 shadow-inner">
                                <div class="h-2 rounded-full transition-all duration-500 ${color.bg}" style="width: ${percentage}%;"></div>
                            </div>
                        </div>
                    `;
                }).join('');


        // Game Panels Structure
        let mainContent = `
                <div class="flex w-full metal-card min-h-[700px]">
                    <!-- LEFT PANEL: Conductor Info -->
                    <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-between border-r-4 border-electric-cyan">
                        <div class="text-center space-y-3">
                            <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 font-title text-electric-cyan">A.I. CONDUCTOR</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-electric-cyan speed-icon">
                                <path d="M12 2a10 10 0 0 0 0 20 10 10 0 0 0 0-20z"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><path d="M9 10h.01"/><path d="M15 10h.01"/>
                            </svg>
                            <div class="text-sm font-mono mt-4 p-2 bg-gray-700 rounded-lg border border-electric-cyan/50">
                                <p>STATUS: ${game.isLoading ? 'LOADING' : 'IDLE'}</p>
                                <p>PHASE: ${game.phase}</p>
                            </div>
                        </div>

                    <!-- SCORE REGISTER -->
                        <div class="mt-4 p-3 bg-gray-700 rounded-lg border border-yellow-400/50 shadow-xl">
                            <p class="text-sm font-mono text-gray-400">MONEY</p>
                            <p class="text-4xl font-extrabold text-yellow-400 title-font">$${game.score}</p>

                        </div>

                    <!-- PHONE -->
                    <div class="mt-8 pt-4 border-t border-gray-700 w-full text-center">

                                ${generateNotificationBadge()}
                            </div>
                        </div>

                    <!-- INVENTORY -->
                        <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                            <p class="text-sm font-mono text-gray-400 mb-2">INVENTORY</p>
                            <div id="inventory-display" class="grid grid-cols-4 gap-2">
                                ${game.inventory_items.length === 0

                                    : game.inventory_items.filter(item => item.acquired).map(item => `
                                        <div class="p-1 text-center bg-gray-600 rounded-md border border-electric-cyan/70 hover:bg-gray-500" title="${item.name}">
                                            <span class="text-2xl">${item.icon}</span>
                                        </div>
                                    `).join('')
                                }
                            </div>
                        </div>


                         <!-- NEW: FAN ENTHUSIASM PANEL -->
                        ${game.isFanPanelVisible ? `
                    <div id="fan-enthusiasm-panel" class="w-full mt-6 p-4 text-center rounded-lg border-2 border-fuchsia-500 shadow-neon-red bg-fuchsia-900/40 fan-panel-glow transition-all duration-300 ease-in-out">
                        <h3 class="text-xl font-extrabold title-font text-fuchsia-400 mb-2 border-b border-fuchsia-500/50 pb-1">AUDIENCE HYPE</h3>
                        <!-- Microphone/Vocal SVG Icon for Music Theme -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-fuchsia-500 animate-pulse">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>
                        </svg>
                        <p class="text-sm font-mono text-gray-300 mt-2">CURRENT FANS</p>
                        <p class="text-3xl font-extrabold title-font text-fuchsia-400">${game.fans.toLocaleString()}</p>
                        <p class="text-xs text-fuchsia-300 mt-1">THE CROWD ROARS!</p>
                    </div>
                    ` : '<div class="w-full mt-6 p-4 text-center text-xs text-gray-600 italic border border-gray-700 rounded-lg">Fan data minimized.</div>'}
                    <!-- END NEW FAN ENTHUSIASM PANEL -->

                    <!-- SONGS CREATED COUNT (NEW VIBRANT SECTION) -->
                                <div class="mt-4 p-3 bg-gray-800 rounded-lg border-2 border-neon-pink/70 shadow-neon-pink shadow-lg w-full text-center">
                                    <p class="text-sm font-mono text-neon-pink mb-1">SONGS CREATED</p>
                                    <p class="text-5xl font-extrabold text-neon-pink title-font">${game.songCounts}</p>
                                </div>


                             <!--  Memory Counter Display -->
                    <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                        <p class="text-sm font-mono text-gray-400 mb-2">MEMORIES COLLECTED</p>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            ${Object.entries(game.memories)
                                .filter(([type, count]) => count > 0) 
                                .map(([type, count]) => `
                                <div class="flex items-center space-x-2 p-1 px-2 rounded-md bg-gray-700 shadow-inner hover:bg-gray-600 transition-colors" 
                                     title="${memoryComponentMatrix[type].description}">
                                    
                                    <!-- Memory Ball Icon -->
                                    <div class="w-5 h-5 rounded-full flex items-center justify-center text-xs shadow-md border-2 border-white/50 ${memoryComponentMatrix[type].tailwind}" style="font-size: 0.75rem;">
                                        ${memoryComponentMatrix[type].emoji}
                                    </div>
                                    
                                    <span class="font-bold text-yellow-400 text-lg">${count}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>



                       


                        <div class="text-center text-xs text-gray-500">
                            <p>Lux Aeterna!</p>
                        </div>
                    </div>

                    <!-- CENTER PANEL: Game Interaction -->

                            ${game.phase > 1 ? 'LIVE CHALLENGE INTERFACE' : (game.phase === 0 ? 'SYSTEM MENU' : 'BOOT SEQUENCE')}

                        <!-- Game Message Panel -->
                        <div class="p-4 mb-6 text-center rounded-sm font-semibold shadow-md bg-electric-blue/20 text-electric-cyan border border-electric-blue">
                            ${game.message}
                        </div>

                        <!-- Dynamic Phase Content Placeholder -->
                        <div id="dynamic-content" class="flex-1"></div>
                    </div>

                     <!-- RIGHT PANEL: Player Info -->
                    <div class="w-1/5 bg-gray-900 text-white p-4 hidden md:flex flex-col items-center justify-start border-l-4 border-electric-cyan overflow-y-auto">
                        <div class="text-center space-y-3 w-full">
                            <h3 class="text-xl font-bold border-b pb-2 border-gray-700 mb-4 title-font text-electric-cyan">PLAYER DATA</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-yellow-400 speed-icon">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                            </svg>
                            
                            <!-- LEVEL AND RANK DISPLAY -->
                            <div class="p-3 bg-gray-700 rounded-lg border border-indigo-400/50 shadow-xl mt-4">
                                <p class="text-sm font-mono text-gray-400">PLAYER LEVEL / RANK</p>
                                <p class="text-4xl font-extrabold text-indigo-400 title-font">${progression.level}</p>
                                <p class="text-lg text-gray-200">${progression.rank.toUpperCase()}</p>
                            </div>

                           
                            
                           <!-- Overall Level Progress Bar -->
                            <div class="mt-4 pt-4 border-t border-gray-700 w-full">
                                <p class="text-sm font-mono text-gray-400 mb-2 font-bold tracking-wider">LEVEL UP PROGRESS</p>
                                <div class="flex justify-between items-center text-xs text-gray-400 mb-1">
                                    <span>LVL ${progression.level}</span>
                                    <span class="text-green-400">${progression.xpToNextLevel === 'MAX' ? 'MAX RANK ACHIEVED' : `${progression.xpToNextLevel} XP to LVL ${progression.level + 1}`}</span>
                                </div>
                                <div class="w-full bg-gray-800 rounded-full h-3 shadow-inner border border-green-700">
                                    <div class="h-3 rounded-full bg-green-500 transition-all duration-500" style="width: ${progression.progressPercentage}%;"></div>
                                </div>
                            </div>
                            <!-- End Level Progress -->

                            <!-- CHOPS SECTION (Dynamic Max: ${chopMax}) -->
                            <div class="mt-6 pt-4 border-t border-gray-700 w-full">
                                <h4 class="text-lg font-extrabold text-neon-pink mb-3 title-font text-center tracking-wider" style="text-shadow: 0 0 5px #ff00ff;">CHOPS</h4>
                                <div id="chops-display" class="space-y-3">
                                    ${chopsHtml}
                                </div>
                            </div>
                            <!-- END CHOP SKILLS SECTION -->

                            
                        </div>
                        <div class="text-center text-xs text-gray-500 mt-auto pt-4 border-t border-gray-700 w-full">
                            <p>Chase that light!</p>
                        </div>
                    </div>
                </div>
            `;
        
        appContainer.innerHTML = mainContent;

        // Render phase-specific content
        const dynamicContent = document.getElementById('dynamic-content');
        dynamicContent.innerHTML = '';
        
        let contentElement;
        switch (game.phase) {
            case 0:
                contentElement = renderPhase0();  //  Menu
                break;
            case 1:
                contentElement = renderPhase_boot(); // Original Phase 1
                break;
            case 2:
                contentElement = renderPhase2(); // show 2 topics
                break;
            case 3:
                contentElement = renderPhase3(); // show trivia question
                break;
            case 4:
                contentElement = renderAmoeba(); // Amoeba phase
                break;
            case 5:
                contentElement = renderPhase5(); // New Instructions Phase
                break;
            case 6:
                contentElement = renderPhase6();
                break;
            case 7:
                contentElement = renderPhase7(); // Wordle Game!
                break;
            case 8:
                contentElement = renderPhase8(); // Midi Game!
                break;
            case 9:
                contentElement = renderPhase9(); // Just one
                break;
            case 10:
                contentElement = renderMap(); // Map
                break 
            case 11:
                contentElement = renderPhase11(); // Family feud
                break 
            case 12:
                contentElement = renderPhase12(); // intro
                break 
            case 13:
                contentElement = renderPhase13(); // Song mixer
                break 
            case 14:
                contentElement = renderInventory(); // Inventory
                break 
            case 15:
                contentElement = renderItem(); // Inventory
                break 
            case 16:
                contentElement = renderPhone();
                break
            case 17:
                contentElement = renderChops();
                break
            case 18:
                contentElement = renderPhase_setup();
                break
            case 19:
                contentElement = renderCliffs();
                break
            case 99: // NEW: Cinematic Phase
                contentElement = renderCinematic();
                break;
            default:
                const topicContent = createElement('div', 'flex flex-col items-center justify-center h-full space-y-8 p-8', 'UNKNOWN GAME STATE');
                const backButton = createElement('button', 'metal-button px-6 py-2 text-lg mt-8 bg-gray-600 hover:bg-gray-700', 'RETURN TO MENU');
                backButton.onclick = () => setPhase(0, 'Main Menu. Ready for the next challenge.');
                topicContent.appendChild(backButton);
                return topicContent;
        }
        dynamicContent.appendChild(contentElement);

        if (game.phase === 10) { 
                // Wait a moment to ensure the browser has fully rendered the SVG element
            setTimeout(renderLandmarks, 0); 
        }
    }

    // Initialize the game when the window loads
    window.onload = initializeLLM;
    window.setPhase = setPhase;

    window.toggleLandmarkVisibilityByName = toggleLandmarkVisibilityByName;
    window.displayMemory = displayMemory;
    window.toggleFanPanel = toggleFanPanel;

    window.toggleMemoryOnBoard = toggleMemoryOnBoard;
    window.playMovie = playMovie;
    window.closeMessageView = closeMessageView;

    window.renderQuestionGrid = renderQuestionGrid;
    window.showQuestionGrid = showQuestionGrid;
